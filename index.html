  const ic = (k, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k] || P.panel}</svg>`;

  const APP_ICON = { 'Faturamento': 'money', 'Vendas': 'cart', 'Devoluções': 'back', 'Compras': 'inbox', 'Estoque': 'box', 'Contas a Receber': 'down', 'Contas a Pagar': 'up', 'Monitor Fiscal': 'tax' };

  /* ---------- status de atualização (horário de Brasília) ---------- */
  function agoraBRT() {
    const p = new Intl.DateTimeFormat('pt-BR', { timeZone: SYNC.fuso, hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());

  }

  /* linha de estado no início: carga contínua das 07h às 19h, a cada 30 min */

    const now = agoraBRT(), ini = 7 * 60, fim = 19 * 60, on = now >= ini && now <= fim + 8;
    const ult = ini + Math.floor((Math.min(now, fim) - ini) / 30) * 30;
    const prox = ult + 30 <= fim ? hhmm(ult + 30) : 'amanhã 07:00';
    return `<div class="state${on ? '' : ' off'}" role="status"><b><i aria-hidden="true"></i>${on ? 'Dados atualizando' : 'Atualização pausada até 07:00'}</b>

  function daySvg() {
    const W = 760, L = 150, R = 16, top = 24, lane = 34;

    const lanes = [
      { n: 'Contínua (30 min)', c: 'var(--brand)', ticks: Array.from({ length: 25 }, (_, i) => 420 + i * 30) },

  /* ---------- planilha de metas ----------
     O cliente entra pelo OAuth do próprio Horus (a senha nunca passa por esta página) e a página lê,
     só para leitura, pelo MCP do Horus: os cadastros de meta dos apps, as ligações de cada agrupamento
     (Representante, Cliente...) e os IDs e nomes da dimensão. A planilha sai no formato da importação
     do Cadastro (Ações > Importar). O token fica só na memória da aba. */
  const HORUS = 'https://dataviz.horusbi.com.br';
  const PM_ROTA = 'planilha-metas';
  const VOLTA = location.origin + location.pathname;
  const guarda = (s) => ({
    get: (k) => { try { return s().getItem(k); } catch (_) { return null; } },
    set: (k, v) => { try { s().setItem(k, v); } catch (_) {} },
    del: (k) => { try { s().removeItem(k); } catch (_) {} }
  });
  const ss = guarda(() => sessionStorage), ls = guarda(() => localStorage);
  /* nomes que a importação aceita no cabeçalho: o nome técnico do campo com espaço no lugar do "_" */
  const PM_FIXOS = { competencia: 'COMPETENCIA', tipo: 'TIPO AGRUPAMENTO', meta: 'META VALOR' };
  const PM_TIPOS = ['Geral', 'Cliente', 'Produto', 'Grupo de Produto', 'Representante', 'Responsável'];
  const semAcento = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
  const aliasDe = (rotulo) => semAcento(rotulo).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
  const mesTxt = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const hoje = new Date();
  const pmIni = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1);
  const PM = { token: null, exp: 0, sessao: null, etapa: 'fora', erro: '', aviso: '', cadastros: [], cad: 0, agrup: '',
    ini: mesTxt(pmIni), fim: mesTxt(new Date(pmIni.getFullYear(), 11, 1)), soAtivos: true, filtro: '', progresso: '', feito: null };

  const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const aleatorio = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
  const naPlanilha = () => atual === PM_ROTA;
  const redesenha = () => { if (naPlanilha()) { const y = window.scrollY; render(); window.scrollTo({ top: y }); } };

  async function pmEntrar() {
    PM.erro = '';
    const chave = 'pm_cliente:' + VOLTA;
    let cid = ls.get(chave);
    if (!cid) {
      const r = await fetch(HORUS + '/oauth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_name: 'Guia Horus BI · Planilha de metas', redirect_uris: [VOLTA],
          grant_types: ['authorization_code', 'refresh_token'], response_types: ['code'], token_endpoint_auth_method: 'none' }) });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || !j.client_id) throw new Error(`O Horus não liberou o acesso desta página (HTTP ${r.status}).`);
      cid = j.client_id;
      ls.set(chave, cid);
    }
    const verifier = aleatorio(), state = aleatorio();
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    ss.set('pm_oauth', JSON.stringify({ verifier, state, cid }));
    const u = new URL(HORUS + '/oauth/authorize');
    Object.entries({ response_type: 'code', client_id: cid, redirect_uri: VOLTA, code_challenge: challenge,
      code_challenge_method: 'S256', state, scope: 'mcp:read', resource: HORUS + '/mcp' }).forEach(([k, v]) => u.searchParams.set(k, v));
    location.href = u.toString();
  }

  /* volta do Horus com ?code=... (roda antes do primeiro desenho) */
  function pmRetorno() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return;
    try { history.replaceState(null, '', VOLTA + '#' + PM_ROTA); } catch (_) {}
    atual = PM_ROTA;
    const est = JSON.parse(ss.get('pm_oauth') || 'null');
    ss.del('pm_oauth');
    if (q.has('error')) {
      if (est) ls.del('pm_cliente:' + VOLTA);
      PM.erro = q.get('error') === 'access_denied' ? 'O acesso não foi autorizado na tela do Horus.' : 'O Horus não concluiu a entrada. Tente de novo.';
      return;
    }
    if (!est || est.state !== q.get('state')) { PM.erro = 'A entrada expirou ou veio de outra aba. Tente de novo.'; return; }
    PM.etapa = 'carregando';
    PM.progresso = 'Confirmando o acesso com o Horus...';
    (async () => {
      const r = await fetch(HORUS + '/oauth/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: VOLTA,
          client_id: est.cid, code_verifier: est.verifier, resource: HORUS + '/mcp' }) });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || !j.access_token) throw new Error('O Horus não confirmou o acesso. Tente entrar de novo.');
      PM.token = j.access_token;
      PM.exp = Date.now() + (Number(j.expires_in) || 3600) * 1000;
      await pmCarregar();
    })().catch((e) => { PM.token = null; PM.etapa = 'fora'; PM.erro = e.message; redesenha(); });
  }

  async function mcpPost(corpo) {
    if (!PM.token || Date.now() > PM.exp - 30000) { PM.token = null; throw new Error('O acesso ao Horus expirou. Entre de novo.'); }
    const h = { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', Authorization: 'Bearer ' + PM.token, 'MCP-Protocol-Version': '2025-06-18' };
    if (PM.sessao) h['Mcp-Session-Id'] = PM.sessao;
    const r = await fetch(HORUS + '/mcp', { method: 'POST', headers: h, body: JSON.stringify(corpo) });
    if (r.status === 401) { PM.token = null; throw new Error('O acesso ao Horus expirou. Entre de novo.'); }
    const s = r.headers.get('mcp-session-id');
    if (s) PM.sessao = s;
    const t = await r.text();
    try { return JSON.parse(t); } catch (_) {}
    const m = t.match(/^data: (.*)$/m);
    try { return m ? JSON.parse(m[1]) : null; } catch (_) { return null; }
  }
  let mcpId = 10;
  async function ferramenta(nome, args) {
    const j = await mcpPost({ jsonrpc: '2.0', id: mcpId++, method: 'tools/call', params: { name: nome, arguments: args } });
    if (!j) throw new Error('O Horus não respondeu. Tente de novo em instantes.');
    if (j.error) throw new Error(j.error.message || 'O Horus recusou a consulta.');
    if (j.result && j.result.isError) throw new Error((j.result.content || []).map((c) => c.text).join(' ').slice(0, 300) || 'O Horus recusou a consulta.');
    return j.result || {};
  }
  const textoDe = (r) => (r.content || []).map((c) => c.text || '').join('\n');

  /* lê a estrutura de um app: colunas por tabela e ligações "lado 1 -> lado N" */
  function lerApp(txt) {
    const cols = {}, rel = [];
    let tab = null;
    txt.split('\n').forEach((l) => {
      const t = l.match(/^## Tabela (.+?) \(/);
      if (t) { tab = t[1]; return; }
      if (/^## /.test(l)) { tab = null; return; }
      const c = l.match(/^- `([^`]+)` \((\w+)/);
      if (tab && c && c[1].startsWith(tab + '.')) (cols[tab] = cols[tab] || []).push({ ref: c[1], nome: c[1].slice(tab.length + 1), tipo: c[2] });
      const r = l.match(/^- `([^`]+)` -> `([^`]+)`/);
      if (r) rel.push([r[1], r[2]]);
    });
    return { cols, rel };
  }
  const tabelaDe = (ref) => ref.slice(0, ref.indexOf('.'));

  async function pmCarregar() {
    PM.etapa = 'carregando'; PM.erro = ''; PM.progresso = 'Procurando os cadastros de meta...'; redesenha();
    const ini = await mcpPost({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'guia-horus-metas', version: '1' } } });
    if (!ini || !ini.result) throw new Error('O Horus não abriu a leitura dos dados.');
    await mcpPost({ jsonrpc: '2.0', method: 'notifications/initialized', params: {} });
    /* cada cadastro de meta tem a coluna "Tipo de Agrupamento"; guarda o primeiro app que traz cada um */
    const cat = textoDe(await ferramenta('search_catalog', { terms: ['Tipo de Agrupamento'] }));
    const achados = new Map();
    let app = null;
    cat.split('\n').forEach((l) => {
      const a = l.match(/\(app (\d+) "([^"]*)"\)/);
      if (a) app = { id: +a[1], nome: a[2] };
      const r = l.match(/"ref":"(.+?)\.Tipo de Agrupamento"/);
      if (r && app && !achados.has(r[1])) achados.set(r[1], app);
    });
    if (!achados.size) throw new Error('Não achei cadastro de metas nos apps que você vê. Confira com o administrador do Horus se você tem acesso ao app de Faturamento ou Vendas.');
    const cads = [];
    for (const [tabela, a] of achados) {
      PM.progresso = `Lendo o app ${a.nome}...`; redesenha();
      const { cols, rel } = lerApp(textoDe(await ferramenta('get_app', { appId: a.id })));
      const agrup = rel.filter(([um, n]) => tabelaDe(n) === tabela && !/^calend/i.test(semAcento(tabelaDe(um))))
        .map(([um, n]) => {
          const dim = tabelaDe(um), campo = n.slice(tabela.length + 1);
          const texto = (cols[dim] || []).filter((c) => c.tipo === 'String');
          const util = texto.filter((c) => !/inativ|^ativo|codigo|cidade|estado|cnpj|cpf|sigla|^uf$|cep|fone|mail|rede/i.test(semAcento(c.nome)));
          const nome = util.find((c) => /raz|nome|descri/i.test(semAcento(c.nome))) || util[0];
          const inativo = texto.find((c) => /^(inativo|ativo|situacao|status)$/i.test(semAcento(c.nome)));
          return { campo, alias: aliasDe(campo), tipo: PM_TIPOS.find((t) => semAcento(t).toLowerCase() === semAcento(campo).toLowerCase()) || null,
            dim, idRef: um, nomeRef: nome ? nome.ref : null, inativoRef: inativo ? inativo.ref : null };
        });
      cads.push({ tabela, appId: a.id, appNome: a.nome, agrup });
    }
    cads.sort((x, y) => x.tabela.localeCompare(y.tabela, 'pt-BR'));
    PM.cadastros = cads; PM.cad = 0;
    PM.agrup = (cads[0].agrup.find((g) => g.tipo === 'Representante') || cads[0].agrup.find((g) => g.tipo) || { campo: 'Geral' }).campo;
    PM.etapa = 'pronto'; PM.progresso = ''; redesenha();
  }

  function pmMeses() {
    const [ai, mi] = PM.ini.split('-').map(Number), [af, mf] = PM.fim.split('-').map(Number);
    const out = [];
    for (let y = ai, m = mi; (y < af || (y === af && m <= mf)) && out.length < 61; m === 12 ? (y++, m = 1) : m++) out.push([y, m]);
    return out;
  }

  function carregarXLSX() {
    if (window.XLSX) return Promise.resolve();
    return new Promise((ok, falha) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = ok;
      s.onerror = () => falha(new Error('Não consegui carregar o gerador de Excel. Confira a internet e tente de novo.'));
      document.head.appendChild(s);
    });
  }

  async function pmGerar() {
    const c = PM.cadastros[PM.cad];
    const g = c.agrup.find((x) => x.campo === PM.agrup) || null;
    const meses = pmMeses();
    if (!PM.ini || !PM.fim || !meses.length) throw new Error('Confira o período: o mês final tem que ser igual ou depois do inicial.');
    if (meses.length > 60) throw new Error('Escolha no máximo 60 meses por planilha.');
    if (g && !g.tipo) throw new Error(`O cadastro não aceita o tipo "${g.campo}". Fale com o suporte WebMais.`);
    PM.etapa = 'gerando'; PM.erro = ''; PM.feito = null;
    let itens = [];
    if (g) {
      const filtros = [];
      if (PM.soAtivos && g.inativoRef) {
        const vals = textoDe(await ferramenta('search_values', { appId: c.appId, ref: g.inativoRef })).split('\n').slice(1).map((v) => v.trim()).filter(Boolean);
        const fora = vals.find((v) => /^(inativo|s|sim|true|1|i)$/i.test(semAcento(v)));
        if (fora) filtros.push({ ref: g.inativoRef, op: '!=', value: fora });
      }
      if (PM.filtro.trim() && g.nomeRef) filtros.push({ ref: g.nomeRef, op: 'like', value: '%' + PM.filtro.trim() + '%' });
      const campos = [{ ref: g.idRef }].concat(g.nomeRef ? [{ ref: g.nomeRef }] : []);
      const vistos = new Map();
      let ultimo = null;
      for (let pag = 0; pag < 200; pag++) {
        PM.progresso = `Buscando ${g.campo.toLowerCase()} no Horus... ${vistos.size} até agora`; redesenha();
        const f = filtros.concat(ultimo == null ? [] : [{ ref: g.idRef, op: '>', value: ultimo }]);
        const r = await ferramenta('query', { appId: c.appId, fields: campos, filters: f.length ? f : null, orderBy: [{ ref: g.idRef, dir: 'asc' }], limit: 500 });
        const linhas = (r.structuredContent && r.structuredContent.rows) || [];
        linhas.forEach(([id, nome]) => { if (id != null && !vistos.has(id)) vistos.set(id, nome == null ? '' : String(nome)); });
        if (linhas.length < 500) break;
        ultimo = linhas[linhas.length - 1][0];
      }
      itens = [...vistos].map(([id, nome]) => ({ id, nome }));
      if (!itens.length) throw new Error('Nenhum item encontrado com essas opções. Tire o filtro por nome ou desmarque "só ativos".');
    }
    const total = (g ? itens.length : 1) * meses.length;
    if (total > 100000) throw new Error(`Ficariam ${total.toLocaleString('pt-BR')} linhas. Use o filtro por nome ou um período menor.`);
    PM.progresso = 'Montando a planilha...'; redesenha();
    await carregarXLSX();
    const X = window.XLSX;
    const outros = c.agrup.filter((x) => x !== g).map((x) => x.alias);
    const cab = [PM_FIXOS.competencia, PM_FIXOS.tipo].concat(g ? [g.alias, 'NOME'] : [], [PM_FIXOS.meta], outros);
    const serial = (y, m) => (Date.UTC(y, m - 1, 1) - Date.UTC(1899, 11, 30)) / 86400000;
    const linhas = [];
    meses.forEach(([y, m]) => (g ? itens : [null]).forEach((it) => linhas.push(
      [{ t: 'n', v: serial(y, m), z: 'mm/yyyy' }, g ? g.tipo : 'Geral'].concat(it ? [it.id, it.nome] : [], [null], outros.map(() => null)))));
    const ws = X.utils.aoa_to_sheet([cab].concat(linhas));
    ws['!cols'] = cab.map((h) => ({ wch: h === 'NOME' ? 48 : Math.max(14, h.length + 4) }));
    ws['!autofilter'] = { ref: ws['!ref'] };
    const iMeta = cab.indexOf(PM_FIXOS.meta);
    for (let r = 1; r <= linhas.length; r++) {
      const ref = X.utils.encode_cell({ r, c: iMeta });
      ws[ref] = { t: 'z', z: '#,##0.00' };
    }
    const ajuda = X.utils.aoa_to_sheet([
      ['Como preencher esta planilha'], [''],
      ['1. Preencha só a coluna META VALOR, com o valor da meta em reais (ex.: 15000,00).'],
      ['2. Apague as linhas que não vão ter meta. A importação é tudo ou nada: uma linha sem valor barra o arquivo inteiro.'],
      ['3. Não mude os títulos da linha 1, a COMPETENCIA, o TIPO AGRUPAMENTO nem os códigos. NOME é só para você se achar.'],
      ['4. No Horus: Cadastros > ' + c.tabela + ' > Ações > Importar.'],
      ['5. Escolha "Adicionar à base". "Limpar base" apaga TODAS as metas que já existem, de todos os agrupamentos.'],
      ['6. Se já existir meta para o mesmo mês e o mesmo item, a importação recusa o arquivo: apague essa linha ou edite a meta na tela.'],
      [''], ['Gerada pelo Guia Horus BI em ' + new Date().toLocaleString('pt-BR') + '.']
    ]);
    ajuda['!cols'] = [{ wch: 110 }];
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Metas');
    X.utils.book_append_sheet(wb, ajuda, 'Como preencher');
    const nomeArq = `metas-${slug(c.tabela)}-${slug(g ? g.campo : 'geral')}-${PM.ini}-a-${PM.fim}.xlsx`;
    X.writeFile(wb, nomeArq);
    PM.amostra = g ? itens.slice(0, 3) : null;
    PM.feito = { arquivo: nomeArq, linhas: linhas.length, itens: g ? itens.length : 0, meses: meses.length, tabela: c.tabela, campo: g ? g.campo : 'Geral' };
    PM.etapa = 'pronto'; PM.progresso = ''; redesenha();
  }

  function pmView() {
    const bread = `<nav class="bread" aria-label="Você está em"><a href="#inicio" data-route="inicio">Início</a>${ic('right', 12)}<a href="#tut-metas" data-route="tut-metas">Metas</a>${ic('right', 12)}<span aria-current="page">Planilha de metas</span></nav>`;
    const logado = !!PM.token && PM.etapa !== 'fora';
    const fase = !logado ? 0 : PM.feito ? 2 : 1;
    const flow = `<ol class="flow" aria-label="Etapas">${['Entrar', 'Baixar', 'Importar']
      .map((n, i) => `<li data-s="${i < fase ? 'feito' : i === fase ? 'agora' : ''}"${i === fase ? ' aria-current="step"' : ''}>${n}</li>`).join('')}</ol>`;
    const head = `<div class="pm-head"><div><h1 class="page-h">Planilha de metas</h1><p class="lead">Códigos prontos. Você só digita a meta.</p></div>${flow}</div>`;
    const erro = PM.erro ? `<p class="note" role="alert" style="margin:16px 0 0">${esc(PM.erro)}</p>` : '';
    const andando = (t) => `<span class="pm-andando" role="status"><i aria-hidden="true"></i>${esc(t)}</span>`;
    const regras = `<ul class="rules3">
      <li><b>Apague as linhas sem meta.</b> A importação é tudo ou nada.</li>
      <li><b>Importe com "Adicionar à base".</b> "Limpar base" apaga as metas existentes.</li>
      <li><b>Errou?</b> Desfaça em Cadastros › Ações › Importações.</li></ul>`;

    const c = logado && PM.cadastros.length ? PM.cadastros[PM.cad] : null;
    const g = c ? c.agrup.find((x) => x.campo === PM.agrup) || null : null;
    /* prévia: as colunas reais da importação; depois de baixar, as primeiras linhas de verdade */
    const cols = g ? ['COMPETENCIA', g.alias, 'NOME', 'META VALOR'] : ['COMPETENCIA', 'TIPO AGRUPAMENTO', 'META VALOR'];
    const [ay, am] = (PM.ini || '2027-01').split('-');
    const mes = `${am}/${ay}`;
    const amostra = (PM.amostra && PM.amostra.length ? PM.amostra : g ? [{ id: '27', nome: 'Exemplo Ltda' }, { id: '47', nome: 'Outro exemplo' }, { id: '83', nome: '…' }] : [null])
      .slice(0, 3).map((it) => `<tr><td>${mes}</td>${g ? `<td class="n">${esc(it.id)}</td><td>${esc(it.nome)}</td>` : '<td class="n">Geral</td>'}<td class="v"></td></tr>`).join('');
    const sheet = `<aside class="sheet" aria-label="Prévia da planilha">
      <span class="sheet-t">${ic('sheet', 14)}Prévia</span>
      <table><thead><tr>${cols.map((h) => `<th title="${h}">${h}</th>`).join('')}</tr></thead><tbody>${amostra}</tbody></table>
      <p>Você preenche só META VALOR.</p></aside>`;

    let card;
    if (PM.etapa === 'carregando') card = `<div class="pm-card">${andando(PM.progresso || 'Carregando...')}</div>`;
    else if (!logado) card = `<div class="pm-card pm-entrar">
        <button class="btn go" type="button" data-pm="entrar">${ic('lock', 16)}Entrar com o Horus</button>
        <small>A senha fica na tela do Horus. Na autorização, confira a empresa e clique em Autorizar.</small></div>`;
    else {
      const ocupado = PM.etapa === 'gerando', dis = ocupado ? ' disabled' : '';
      const n = pmMeses().length;
      const chips = [`<button class="chip" type="button" data-pm="agr:Geral" aria-pressed="${!g}"${dis}>Geral</button>`]
        .concat(c.agrup.map((x) => `<button class="chip" type="button" data-pm="agr:${esc(x.campo)}" aria-pressed="${g === x}"${x.tipo && !ocupado ? '' : ' disabled'}${x.tipo ? '' : ' title="O cadastro ainda não aceita este tipo"'}>${esc(x.campo)}</button>`)).join('');
      card = `<div class="pm-card">
        <div class="pm-quem"><span><i aria-hidden="true"></i>Conectado até <span class="tab">${new Date(PM.exp).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span></span><button class="btn ghost" type="button" data-pm="sair">Sair</button></div>
        ${PM.cadastros.length > 1 ? `<label class="pm-campo full">Cadastro
          <select data-pm-campo="cad"${dis}>${PM.cadastros.map((x, i) => `<option value="${i}"${i === PM.cad ? ' selected' : ''}>${esc(x.tabela)}</option>`).join('')}</select></label>` : ''}
        <div class="pm-campo">Agrupamento<div class="chips" role="group" aria-label="Agrupamento">${chips}</div></div>
        <div class="pm-grid">
          <label class="pm-campo">De<input type="month" data-pm-campo="ini" value="${esc(PM.ini)}"${dis}></label>
          <label class="pm-campo">Até<input type="month" data-pm-campo="fim" value="${esc(PM.fim)}"${dis}></label>
          ${g ? `<label class="pm-campo">Nome contém<input type="search" data-pm-campo="filtro" value="${esc(PM.filtro)}" placeholder="Todos"${dis}></label>` : ''}
          ${g && g.inativoRef ? `<label class="pm-check" style="align-self:end"><input type="checkbox" data-pm-campo="soAtivos"${PM.soAtivos ? ' checked' : ''}${dis}>Só ativos</label>` : ''}
        </div>
        <div class="pm-acoes">
          <button class="btn go" type="button" data-pm="gerar"${ocupado || !n ? ' disabled' : ''}>${ic('down', 16)}Baixar planilha</button>
          ${ocupado ? andando(PM.progresso) : `<span class="pm-conta"><b>${n || 0}</b>${n === 1 ? 'mês' : 'meses'}</span>`}</div>
        ${PM.feito ? `<p class="pm-ok" role="status"><span class="tab">${PM.feito.linhas.toLocaleString('pt-BR')}</span> linhas baixadas. Importe em Cadastros › ${esc(PM.feito.tabela)} › Ações › Importar.</p>` : ''}
      </div>`;
    }
    return `${bread}${head}${erro}<div class="pm-shell">${card}${sheet}</div>${regras}`;
  }

  async function pmAcao(qual) {
    try {
      if (qual === 'entrar') await pmEntrar();
      else if (qual === 'sair') { PM.token = null; PM.sessao = null; PM.etapa = 'fora'; PM.feito = null; PM.erro = ''; redesenha(); }
      else if (qual === 'gerar') await pmGerar();
      else if (qual.startsWith('agr:')) { PM.agrup = qual.slice(4); PM.feito = null; PM.amostra = null; PM.erro = ''; redesenha(); }
    } catch (e) {
      PM.erro = e.message || String(e);
      if (!PM.token) PM.etapa = 'fora'; else if (PM.etapa !== 'pronto') PM.etapa = PM.cadastros.length ? 'pronto' : 'fora';
      PM.progresso = '';
      redesenha();
    }
  }
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-pm-campo]');
    if (!el) return;
    const k = el.dataset.pmCampo;
    if (k === 'soAtivos') PM.soAtivos = el.checked;
    else if (k === 'cad') { PM.cad = +el.value; const c = PM.cadastros[PM.cad]; if (!c.agrup.some((x) => x.campo === PM.agrup)) PM.agrup = 'Geral'; }
    else PM[k] = el.value;
    PM.feito = null; PM.amostra = null;
    if (k !== 'filtro') redesenha();
  });

  /* ---------- rotas ---------- */
  let atual = location.hash.replace('#', '') || 'inicio';
  function render(focar) {
    const q = $('#q').value.trim();
    const a = apps.find((x) => x.slug === atual);
    const t = atual.startsWith('tut-') ? TUT.find((x) => 'tut-' + x.id === atual) : null;
    const hub = atual === 'como-fazer', pm = atual === PM_ROTA, pg = !q && PAGINAS[atual];
    document.querySelectorAll('.menu a').forEach((el) => {
      const r = el.dataset.route;
      const on = !q && (r === atual || (r === 'apps' && a) || (r === 'como-fazer' && (t || pm)));
      on ? el.setAttribute('aria-current', 'page') : el.removeAttribute('aria-current');
    });
    document.body.dataset.rota = !q && !a && !t && !hub && !pm && !pg ? 'home' : 'pagina';
    $('#view').innerHTML = q ? searchView(q) : a ? appView(a) : t ? tutView(t) : hub ? hubView() : pm ? pmView() : pg ? pg() : home();
    iniciarMotions();
    if (focar) $('#view').focus({ preventScroll: true });
  }
  function ir(s) {
    atual = s || 'inicio';
    $('#q').value = '';
    try { history.replaceState(null, '', '#' + atual); } catch (_) {}
    window.scrollTo({ top: 0 });
    render(true);
  }
  document.addEventListener('click', (e) => {
    const pmb = e.target.closest('[data-pm]');
    if (pmb) { e.preventDefault(); if (!pmb.disabled) pmAcao(pmb.dataset.pm); return; }
    const r = e.target.closest('[data-route]');
    if (r) { e.preventDefault(); ir(r.dataset.route); return; }
    const go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); const el = document.getElementById(go.dataset.go); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
    const sq = e.target.closest('[data-q]');
    if (sq) { $('#q').value = sq.dataset.q; render(); $('#q').focus(); return; }
    const mf = e.target.closest('[data-met]');
    if (mf) { metFilter = mf.dataset.met; document.querySelectorAll('[data-met]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.met === metFilter)); $('#mt').innerHTML = metTable(metFilter === 'Todos' ? MET : MET.filter((m) => m.app === metFilter)); return; }
    const btn = e.target.closest('.item > button');
    if (btn) { const it = btn.parentElement, open = it.dataset.open !== 'true'; it.dataset.open = open; btn.setAttribute('aria-expanded', open); it.querySelector('.panel').hidden = !open; }
  });
  let t;
  $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => render(), 200); });
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#q').value = ''; render(); } });
  window.addEventListener('hashchange', () => { const s = location.hash.replace('#', '') || 'inicio'; if (s !== atual) ir(s); });
  $('#foot').textContent = `Atualizado em ${DATA.gerado}, a partir dos apps publicados no tenant Bacco. Os números dos painéis mudam com os filtros do topo.`;
  pmRetorno();
  render();
})();
</script>
