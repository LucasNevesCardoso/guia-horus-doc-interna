umo Nota Fiscal", "tipo": "Tabela", "mostra": "Lista as ordens de compra com o fornecedor, a data de entrada, o código da ordem e o prazo de entrega em dias. A tabela tem total e contagem de linhas.", "como_ler": "Dias de entrega maiores indicam fornecedor mais lento. Compare fornecedores para ver quem entrega no prazo combinado.", "perguntas": ["Quais fornecedores demoram mais para entregar?", "Qual o prazo de uma ordem específica?", "Quantas ordens estão no período?"], "dica": "Cruze com os cartões de situação: ordens abertas de fornecedores com prazo longo merecem cobrança primeiro."}]}, {"nome": "Compras x Vendas", "objetivo": "Compara o que entrou com o que saiu para saber se as compras estão alinhadas às vendas: margem, giro e risco de ruptura ou de estoque parado por produto.", "widgets": [{"titulo": "Cartões do topo: Total Compras, Total Vendas (Líquido), Lucro Bruto, Markup Médio e Giro Cobertura", "tipo": "KPI", "mostra": "Total Compras: compra líquida do período. Total Vendas (Líquido): vendas finalizadas de operações de venda. Lucro Bruto: vendas líquidas menos o custo das mercadorias vendidas. Markup Médio: lucro bruto dividido pelo custo das vendas. Giro Cobertura: quantidade vendida dividida pela quantidade comprada.", "como_ler": "Compras bem abaixo das vendas e Giro Cobertura acima de 100% indicam que se vende mais do que se compra no período, usando estoque anterior. Giro baixo indica que se compra mais do que se vende. Markup positivo significa venda acima do custo.", "perguntas": ["Estou ganhando em cima do que compro?", "Compro mais do que vendo, ou o contrário?", "Qual o lucro bruto do período?"], "dica": "Se o giro estiver baixo ou o markup caindo, desça para a tabela de produtos e ache onde está o problema."}, {"titulo": "Performance por Produto & Risco: aba Produtos", "tipo": "Tabela", "mostra": "Até 20 produtos, ordenados pelo valor vendido: curva ABC, quantidade comprada, quantidade vendida, valor vendido, markup, giro (vendido ÷ comprado, com barrinha) e status de risco. Há busca por nome de produto.", "como_ler": "Curva A (verde): produtos que somam os primeiros 70% das vendas; B (azul): até 90%; C (cinza): o restante. Giro acima de 90% (barra vermelha) é Risco de Ruptura: quase tudo que comprou já vendeu. Giro abaixo de 30% (barra laranja) é Estoque Parado: comprou muito e vendeu pouco. Entre os dois, Ok. Markup verde é positivo; vermelho é prejuízo; traço significa sem custo no período.", "perguntas": ["Quais produtos podem faltar por vender mais do que compro?", "Quais produtos comprei demais e não vendi?", "Meus produtos curva A estão com bom markup?", "Quais produtos têm markup negativo?"], "dica": "Pesquise o produto pelo nome e depois confira, no painel Nota Fiscal de Entrada, de qual fornecedor e a que custo ele foi comprado."}, {"titulo": "Performance por Produto & Risco: aba Gráfico de Fluxo", "tipo": "Barras+Linha", "mostra": "Para os 10 produtos que mais venderam em valor: colunas com o Valor de Compra e o Valor de Venda e uma linha com o Giro/Cobertura em %.", "como_ler": "Venda maior que compra com giro alto sinaliza reposição necessária. Compra bem maior que venda com giro baixo mostra capital parado. Veja a linha para perceber onde o giro foge do padrão.", "perguntas": ["Nos meus principais produtos, compra e venda estão equilibradas?", "Em quais deles o giro está muito alto ou muito baixo?"], "dica": "Alterne entre as duas abas: o gráfico dá a visão geral e a tabela mostra o detalhe de cada produto."}]}], "roteiros": [{"titulo": "Estou comprando acima da meta de 70% do faturamento?", "passos": ["No painel Nota Fiscal de Entrada, abra a Análise Mensal e veja se a linha da % Participação está acima da meta tracejada.", "Veja no cartão da meta quantos pontos percentuais você está acima e quanto de compras ficaria na meta.", "Ajuste o filtro de data para o mês em que o desvio começou.", "Confira os gráficos de Nf Entrada Fornecedor e Item Nota Fiscal para achar quem e o quê puxou o valor."]}, {"titulo": "Quais compras estão paradas ou vão faltar?", "passos": ["No painel Compras x Vendas, veja o cartão Giro Cobertura para ter o quadro geral.", "Na aba Produtos, procure status Parado (giro abaixo de 30%) e Ruptura (giro acima de 90%).", "Para os parados, evite novos pedidos; para os de ruptura, programe reposição.", "Confira no painel Ordem Compra se já existe pedido em aberto desses produtos."]}, {"titulo": "O fornecedor reajustou o preço?", "passos": ["Na Auditoria Histórica de Custo, pesquise o produto.", "Leia a tabela de oscilação para ver quando e quanto o custo médio mudou.", "No gráfico Nf Entrada Fornecedor, confira o peso do fornecedor nas suas compras.", "Use a Frequência de Compras por Fornecedor para saber quando é o próximo pedido e negociar antes."]}, {"titulo": "Quem entrega no prazo?", "passos": ["No painel Ordem Compra, veja os cartões para saber quantas ordens estão em aberto, recebidas em parte ou canceladas.", "Na tabela Resumo Nota Fiscal, compare os dias de entrega entre fornecedores.", "Cruze com a Frequência e Histórico de Compras por Fornecedor para ver se atrasos afetam a recompra."]}]}, {"appId": 41138, "app": "Estoque", "resumo": "Mostra o que você tem em estoque, produto a produto e lote a lote, com o custo parado, o que está vencido ou perto de vencer e quanto saiu no período. Serve ao time de estoque, compras e financeiro para achar risco de perda e decidir o que comprar, vender ou ajustar.", "regras": ["O período padrão é o mês atual completo. Ele vale para as saídas e para a lista de movimentações; ajuste no filtro de data do topo.", "O custo de cada lote é o saldo do lote multiplicado pelo custo médio do produto. O custo médio é o custo total das entradas dividido pela quantidade das entradas, somando todo o histórico até o fim do período escolhido. Saídas não alteram esse custo médio.", "A saída de um produto é a soma das movimentações de saída dele dentro do período do filtro.", "Produto sem saldo e sem saída no período não aparece na visão geral, mas aparece se você pesquisar o nome ou o código.", "Lote com saldo menor que zero é tratado como saldo negativo; lote com saldo zero é tratado como zerado, mesmo que a validade esteja ok."], "glossario": [{"termo": "Lote", "significado": "Um grupo de unidades de um mesmo produto que entrou junto no estoque, com sua própria data de entrada e validade."}, {"termo": "Saldo físico", "significado": "Quantidade que existe em estoque agora, na unidade do produto (UN, KG etc.)."}, {"termo": "Custo alocado", "significado": "Dinheiro parado em estoque: saldo do lote vezes o custo médio do produto."}, {"termo": "Custo médio", "significado": "Custo das entradas dividido pela quantidade das entradas, acumulado desde o início do histórico. As saídas não mudam esse valor."}, {"termo": "Perda/Risco consolidado", "significado": "Soma do custo dos lotes vencidos, a vencer em menos de 30 dias ou com saldo negativo."}, {"termo": "Dias parado", "significado": "Dias desde a última movimentação do lote."}, {"termo": "Saída no período", "significado": "Quantidade que saiu do produto nas movimentações de estoque dentro do período do filtro."}, {"termo": "Indicadores do app", "significado": "O app também tem números prontos para usar em alertas e relatórios: custo das saídas de venda (CMV), entradas e saídas no período, saldo em estoque, quantidade de lotes em estoque, itens com saldo negativo e itens parados há mais de 90 dias."}], "dashboards": [{"nome": "Estoque/Lote", "objetivo": "Visão única de todos os produtos e lotes: quanto há em estoque, quanto isso custa, o que está vencendo ou negativo e como cada produto girou no período. Clicando em um produto, você abre o detalhe dos lotes e o histórico de entradas e saídas.", "widgets": [{"titulo": "Estoque/Rotatividade Consolidado: cartões do topo (Custo Visível e Perda/Risco Consolidado)", "tipo": "KPI", "mostra": "Dois valores em reais no cabeçalho. Custo Visível é o custo alocado de tudo que está listado na tela agora (respeita a busca e o filtro de status). Perda/Risco Consolidado é o custo dos lotes vencidos, com menos de 30 dias para vencer ou com saldo negativo, entre os produtos listados.", "como_ler": "O Custo Visível mostra o tamanho do dinheiro parado. O Risco, em vermelho, mostra quanto desse dinheiro está ameaçado. Quanto maior a fatia do risco sobre o custo, mais urgente é agir.", "perguntas": ["Quanto dinheiro tenho parado em estoque?", "Quanto desse valor está vencido, a vencer ou com saldo negativo?", "Quanto vale o estoque de um produto ou grupo específico que pesquisei?"], "dica": "Pesquise um produto ou troque para Com Risco ou Vencidos: os dois cartões recalculam para o que está na tela."}, {"titulo": "Estoque/Rotatividade Consolidado: lista de produtos", "tipo": "Tabela", "mostra": "Uma linha por produto, ordenada do maior para o menor custo alocado. Cada linha traz o nome com um selo de situação, a saída no período, o saldo físico com uma barra comparando com o maior saldo da lista, e o custo alocado.", "como_ler": "Selo verde: estoque saudável. Amarelo: algum lote vence em menos de 30 dias. Vermelho: há lote vencido. Roxo: há saldo negativo (saldo e custo aparecem em roxo). Cinza: estoque zerado. Saída em laranja indica que o produto vendeu ou saiu no período; em cinza claro, não saiu nada. Produto com saldo alto e saída zero é candidato a estoque parado.", "perguntas": ["Quais produtos concentram mais dinheiro em estoque?", "Quais produtos têm estoque alto e saída baixa ou nenhuma?", "Quais produtos têm lote vencido ou saldo negativo?", "Quanto saiu de cada produto no mês?"], "dica": "Use os botões Todos Status, Com Risco e Vencidos para focar no problema. Com Risco mostra lotes a vencer em menos de 30 dias ou negativos; Vencidos mostra só os vencidos, e o saldo e o custo passam a contar só esses lotes. O botão Excel exporta a lista como está na tela."}, {"titulo": "Detalhe do produto: aba Controle de Lote", "tipo": "Painel interativo", "mostra": "Janela que abre ao clicar em um produto. Lista cada lote com data de entrada, dias parado, vencimento, saldo físico, custo e situação, e soma o custo dos lotes exibidos no rodapé.", "como_ler": "A situação de cada lote usa as mesmas cores da lista: verde saudável, amarelo atenção, vermelho vencido, roxo negativo, cinza zerado. Muitos dias parado com vencimento próximo é sinal de perda em formação.", "perguntas": ["Quais lotes de um produto estão vencidos ou perto de vencer?", "Há quanto tempo cada lote está parado?", "Quanto custa o estoque de cada lote?"], "dica": "Marque ou desmarque Saldos Positivos, Zerados e Negativos para limpar a lista. Clicar em um lote leva direto às movimentações dele."}, {"titulo": "Detalhe do produto: aba Movimentações", "tipo": "Tabela", "mostra": "Histórico de entradas e saídas do produto dentro do período do filtro de data: data e hora, tipo, código e descrição da origem do movimento, lote e quantidade, com o total de entradas e de saídas no rodapé.", "como_ler": "Entradas aparecem em verde com sinal de mais; saídas em laranja com sinal de menos. Compare o total de entradas com o de saídas para ver se o estoque está crescendo ou diminuindo.", "perguntas": ["De onde veio e para onde foi cada movimento deste produto?", "Um saldo negativo ou estranho vem de qual movimento?", "Quanto entrou e quanto saiu de um lote específico?"], "dica": "Filtre por Entradas ou Saídas e por lote, e use Excel para exportar. Se vier vazio, amplie o filtro de data no topo, pois só aparecem movimentos do período."}]}], "roteiros": [{"titulo": "Onde está o dinheiro parado e em risco no estoque?", "passos": ["Veja os cartões do topo: compare o Custo Visível com a Perda/Risco Consolidado para dimensionar o problema.", "Clique em Com Risco na lista de produtos; os produtos já vêm ordenados pelo maior custo.", "Abra os três primeiros produtos e confira os lotes: data de entrada, dias parado e vencimento.", "Decida a ação por lote: promoção, devolução ao fornecedor, transferência ou baixa."]}, {"titulo": "Quais produtos estão encalhados?", "passos": ["Na lista com Todos Status, ordene o olhar por custo alocado alto.", "Procure produtos com saída zerada (cinza) ou muito menor que o saldo.", "Abra o produto e veja a aba Controle de Lote para saber há quantos dias cada lote está parado.", "Na aba Movimentações, confirme a última saída e as entradas recentes antes de comprar mais."]}, {"titulo": "Por que um produto está com saldo negativo?", "passos": ["Pesquise o produto na caixa de busca; o selo roxo indica saldo negativo.", "Abra o detalhe e marque Saldos Negativos na aba Controle de Lote para ver quais lotes estão negativos.", "Clique no lote para ir às Movimentações dele e procure saídas maiores que as entradas, ou entradas não lançadas.", "Ajuste o filtro de data no topo se precisar enxergar movimentos mais antigos e peça a correção do lançamento."]}]}, {"appId": 41141, "app": "Contas a Receber", "resumo": "Acompanha o dinheiro que a empresa tem a receber de clientes: o que vence hoje, na semana e no mês, o que já foi recebido e o que está atrasado. É usado pelo financeiro e pela cobrança para prever o caixa, achar quem está devendo e priorizar a cobrança por cliente, rede ou representante.", "regras": ["O período padrão do app é o ano atual. Esse recorte vale para os gráficos que não têm período próprio.", "Os cartões de hoje, semana, mês, mês passado e ano têm período próprio e não mudam com o filtro de data do topo.", "Valor do título é o valor original da ordem de recebimento. Saldo é o que ainda falta receber desse título.", "Título em aberto é o que ainda tem saldo a receber. Vencido é o título em aberto com vencimento antes de hoje. A vencer vence hoje ou depois.", "Valor recebido soma liquidação, juros e multa. Desconto e tarifa bancária não entram, para bater com o relatório de títulos liquidados do ERP.", "O dia do recebimento é a data de crédito do dinheiro, não a data da baixa no sistema.", "As faixas de atraso e de prazo são: até 30 dias, 31 a 60, 61 a 90 e acima de 90 dias.", "Os filtros do topo (cliente, representante, tipo de cobrança etc.) valem para todos os gráficos. Clicar em um cliente, rede, representante ou título em alguns painéis também aplica filtro nos demais."], "glossario": [{"termo": "Ordem de recebimento (OR)", "significado": "O título a receber de um cliente: tem número, valor, vencimento e tipo de cobrança."}, {"termo": "Valor OR", "significado": "Valor original do título, antes de qualquer recebimento."}, {"termo": "Saldo", "significado": "Quanto do título ainda não foi recebido."}, {"termo": "Recebido (valor movimentado)", "significado": "Dinheiro efetivamente recebido: liquidação, juros e multa, na data de crédito."}, {"termo": "Vencido", "significado": "Saldo em aberto de títulos com vencimento anterior a hoje."}, {"termo": "A vencer", "significado": "Saldo em aberto de títulos que vencem hoje ou no futuro."}, {"termo": "Inadimplente", "significado": "Cliente ou título com saldo em aberto depois do vencimento."}, {"termo": "Tipo de cobrança", "significado": "Forma de pagamento do título, como boleto, PIX, cartão ou DOC/TED."}, {"termo": "Portador", "significado": "Banco ou carteira responsável por cobrar o título."}, {"termo": "Rede de clientes", "significado": "Grupo de clientes da mesma rede ou bandeira. Quem não tem rede aparece como Sem Rede."}, {"termo": "Centro de custo e elemento de custo", "significado": "Classificações internas do lançamento, usadas para ver de onde vem o atraso."}], "dashboards": [{"nome": "Visão Geral Recebimentos", "objetivo": "Resumo do que entra e do que está para entrar: hoje, na semana e no mês, com quem deve, onde estão os clientes, qual a forma de cobrança e por qual conta o dinheiro passa.", "widgets": [{"titulo": "Cartões do topo: À Receber e Recebido (hoje, semana e mês)", "tipo": "KPI", "mostra": "Seis números lado a lado. À Receber hoje, À Receber Semana e À Receber Mês: saldo em aberto dos títulos com vencimento naquele dia, na semana atual e no mês atual inteiro. Recebido Hoje, Recebido Semana e Recebido Mês: dinheiro creditado no dia, na semana e no mês.", "como_ler": "Compare cada par. Se o Recebido do mês está bem abaixo do À Receber do mês, há dinheiro previsto que ainda não entrou. Os cartões não mudam com o filtro de data do topo.", "perguntas": ["Quanto vence hoje e quanto já entrou?", "A semana está dentro do previsto?", "O mês vai fechar o que esperávamos receber?"], "dica": "Use os filtros do topo (cliente, representante, tipo de cobrança) para ver o mesmo par só de uma carteira."}, {"titulo": "Top 10 Clientes Inadimplentes", "tipo": "Barras", "mostra": "Os 10 clientes com maior valor de títulos, em barras horizontais. A conta usa o valor original dos títulos com vencimento até 21/09/2026, uma data fixa definida no gráfico.", "como_ler": "Barra maior significa mais valor concentrado naquele cliente. Como usa o valor do título e não o saldo, confirme o quanto falta pagar na tela À Receber ou em Vencidos - Vencer.", "perguntas": ["Quais clientes concentram a maior parte dos títulos com vencimento já passado?", "A carteira está concentrada em poucos nomes?"], "dica": "Anote os primeiros nomes e abra Vencidos - Vencer para ver quanto de cada um está vencido e há quantos dias."}, {"titulo": "Valor por UF", "tipo": "Pizza/Donut", "mostra": "Participação de cada estado no valor dos títulos. Mostra os 5 maiores estados e agrupa o resto em Outros.", "como_ler": "Cada fatia traz o percentual do total. Fatia grande é estado que pesa mais na carteira.", "perguntas": ["Em quais estados está a maior parte do valor a receber?", "Há dependência de uma região?"], "dica": "Filtre por um estado no topo para ver clientes e representantes só daquela região."}, {"titulo": "Valor à Receber por Tipo de Cobrança", "tipo": "Barras", "mostra": "Saldo em aberto mês a mês, dividido por tipo de cobrança (boleto, PIX, cartão, cheque etc.). Cada tipo tem uma cor própria.", "como_ler": "A altura da barra é o saldo do mês. As cores mostram quanto vem de cada forma de cobrança. Meses com barra alta são os de maior entrada prevista.", "perguntas": ["Em que meses se concentra o que falta receber?", "Qual forma de cobrança domina cada mês?", "Há muito saldo em formas de recebimento mais lentas, como cheque?"], "dica": "Use a legenda para ligar e desligar tipos e comparar só duas formas de cobrança."}, {"titulo": "Valor por Tipo de Cobrança", "tipo": "Pizza/Donut", "mostra": "Participação de cada tipo de cobrança no valor dos títulos. Mostra os 4 maiores e agrupa o resto em Outros.", "como_ler": "Fatias maiores são as formas de cobrança mais usadas. O percentual aparece ao lado de cada fatia.", "perguntas": ["Qual forma de cobrança mais usamos?", "Quanto da carteira depende de boleto?"], "dica": "Cruze com o gráfico de saldo por tipo de cobrança para ver se a forma mais usada também é a que mais atrasa."}, {"titulo": "Top 10 Dias com maior valor Movimentado", "tipo": "Barras (área)", "mostra": "Os períodos em que mais dinheiro foi recebido, do maior para o menor. Usa só os recebimentos (liquidação, juros e multa) e mostra até 15 pontos.", "como_ler": "Os picos são os dias ou meses de maior entrada. Valores muito acima dos demais podem ser recebimentos grandes e pontuais.", "perguntas": ["Quando o caixa recebeu mais?", "Os picos coincidem com vencimentos grandes ou com campanhas de cobrança?"], "dica": "Compare os picos com o calendário de calor logo abaixo para ver em quais dias do mês eles se repetem."}, {"titulo": "Clientes Transacionando", "tipo": "KPI", "mostra": "Quantidade de clientes diferentes que têm títulos no período filtrado.", "como_ler": "É uma contagem de clientes, não um valor. Muda com os filtros do topo.", "perguntas": ["Quantos clientes estão gerando títulos?", "A base de clientes ativa cresceu ou encolheu?"], "dica": "Divida o valor a receber por esse número para ter uma ideia do valor médio por cliente."}, {"titulo": "Emitido x Realizado - Ano anterior", "tipo": "Barras", "mostra": "Mês a mês, duas barras: o valor dos títulos emitidos (preto) e o valor realmente recebido (laranja). O período vai do início do ano passado até o mesmo dia de hoje no ano passado.", "como_ler": "Barra preta bem maior que a laranja indica mês com muito título emitido e pouco recebimento. Barras próximas indicam carteira se convertendo em caixa.", "perguntas": ["Quanto do que foi emitido virou dinheiro?", "Quais meses do ano passado tiveram a pior conversão?"], "dica": "Use como referência para avaliar o desempenho do ano atual nos mesmos meses."}, {"titulo": "Recebimentos por representantes", "tipo": "Barras", "mostra": "Os 10 representantes com maior valor recebido (liquidação, juros e multa).", "como_ler": "Barras maiores são quem mais gerou entrada de caixa. Não mostra atraso, só o que já entrou.", "perguntas": ["Quais representantes trazem mais recebimento?", "Há representantes com carteira grande e pouco recebido?"], "dica": "Compare com o ranking de saldo por representante na tela À Receber para achar quem recebe pouco para o tamanho da carteira."}, {"titulo": "Valor Movimentado por Dia", "tipo": "Calendário de calor", "mostra": "Calendário em que cada dia é colorido pelo valor recebido nele. O período é do início do ano passado até hoje, um ano atrás.", "como_ler": "Quanto mais forte a cor, maior o recebimento do dia. Dias claros ou vazios tiveram pouca entrada.", "perguntas": ["Em quais dias do mês o dinheiro costuma entrar?", "Há dias da semana com entrada fraca?"], "dica": "Passe o mouse sobre um dia para ver o valor e planeje o fluxo de caixa pelos dias fortes."}, {"titulo": "Valor movimentado x Saldo x Valor OR por Conta Bancária", "tipo": "Barras + área", "mostra": "Para cada conta bancária, três medidas: valor recebido (amarelo), valor original dos títulos (preto) e saldo ainda em aberto (laranja, em área).", "como_ler": "Dentro de cada conta, compare o recebido com o valor dos títulos. Saldo alto em relação ao valor indica conta com muita cobrança pendente.", "perguntas": ["Por qual conta o dinheiro está entrando?", "Qual conta concentra mais saldo a receber?"], "dica": "Use para conferir com a conciliação bancária e achar contas com recebimento abaixo do esperado."}]}, {"nome": "À Receber", "objetivo": "Detalhar o saldo que ainda falta receber: por prazo, forma de cobrança, cliente, representante e estado, além de listar os títulos que vencem hoje, na semana e no mês.", "widgets": [{"titulo": "Cartões do topo: À Receber Hoje, Semana, Mês, Ano, Total Aberto e Total Inadimplente", "tipo": "KPI", "mostra": "Seis cartões de saldo a receber. À Receber Hoje: saldo em aberto que vence hoje, com a quantidade de títulos. À Receber Semana e À Receber Mês: saldo com vencimento na semana e no mês atuais. À Receber Ano: saldo em aberto com vencimento no ano atual, com quantidade. Total Aberto: todo o saldo em aberto, com quantidade de títulos. Total Inadimplente (em vermelho): saldo de títulos com vencimento até 07/10/2026, uma data fixa definida no cartão.", "como_ler": "Os cartões laranja são valores a receber. O vermelho chama atenção para atraso. O valor menor ao lado (Qtd.) é o número de títulos.", "perguntas": ["Quanto temos em aberto no total?", "Quanto vence hoje, na semana e no mês?", "Qual o tamanho da inadimplência?"], "dica": "Compare Total Aberto com Total Inadimplente para ver que parte da carteira já passou do vencimento."}, {"titulo": "Saldo à receber por Tipo de Cobrança", "tipo": "Pizza/Donut", "mostra": "Participação de cada tipo de cobrança no saldo em aberto. Mostra os 3 maiores e agrupa o resto em Outros.", "como_ler": "Fatia maior é a forma de cobrança com mais dinheiro pendente.", "perguntas": ["Em qual forma de cobrança está o maior saldo?", "O que falta receber depende mais de boleto ou de PIX?"], "dica": "Filtre um tipo de cobrança no topo para ver clientes e prazos só dele."}, {"titulo": "Saldo à receber por Cliente", "tipo": "Ranking (barras)", "mostra": "Os 15 clientes com maior saldo em aberto.", "como_ler": "Barra maior significa mais dinheiro pendente daquele cliente. Só entram clientes com saldo maior que zero.", "perguntas": ["Quem mais nos deve hoje?", "A carteira em aberto está concentrada em poucos clientes?"], "dica": "Abra Vencidos - Vencer para ver quanto desse saldo já está vencido e em qual faixa de atraso."}, {"titulo": "Saldo à receber por Representante", "tipo": "Ranking (barras)", "mostra": "Os 10 representantes com maior saldo em aberto na sua carteira.", "como_ler": "Barra maior é carteira com mais dinheiro pendente.", "perguntas": ["Qual representante tem mais dinheiro na rua?", "Quem deve ser acionado para ajudar na cobrança?"], "dica": "Cruze com Recebimentos por representantes (Visão Geral) para comparar o que cada um recebeu com o que ainda falta."}, {"titulo": "Saldo à receber por UF", "tipo": "Pizza/Donut", "mostra": "Participação de cada estado no saldo em aberto. Mostra os 5 maiores e agrupa o resto em Outros.", "como_ler": "Fatias grandes são estados com mais saldo pendente.", "perguntas": ["Qual região concentra o saldo a receber?", "Há estado com cobrança mais fraca?"], "dica": "Clique em um estado para filtrar o painel e achar os clientes daquela região."}, {"titulo": "Saldo pendente por Data de Vencimento", "tipo": "Calendário de calor", "mostra": "Calendário em que cada dia é colorido pelo saldo em aberto dos títulos que vencem nele.", "como_ler": "Cor mais forte é dia com muito dinheiro a vencer. Serve para enxergar os dias de pico do fluxo de caixa.", "perguntas": ["Em quais dias vence a maior parte do saldo?", "Há semanas mais carregadas que outras?"], "dica": "Se o dia tem cor forte, filtre pela data e veja a lista de títulos no painel de títulos agrupados."}, {"titulo": "Saldo à Receber por mês", "tipo": "Barras", "mostra": "Saldo em aberto somado por mês de vencimento, em ordem de calendário.", "como_ler": "Cada barra é um mês. Meses passados com barra alta são atraso. Meses futuros mostram o que está previsto entrar.", "perguntas": ["Em que meses se acumula o saldo?", "Qual a previsão de entrada para os próximos meses?"], "dica": "Compare com o total recebido por mês na tela Recebidos para avaliar se a entrada acompanha a previsão."}, {"titulo": "Saldo x Valor OR", "tipo": "Barras + linha", "mostra": "Para os 15 títulos com maior saldo: o saldo em aberto (linha preta) e o valor original do título (barra laranja). Títulos sem saldo ficam de fora.", "como_ler": "Quando a linha chega ao topo da barra, nada foi pago. Linha bem abaixo da barra indica título pago em parte.", "perguntas": ["Quais são os maiores títulos em aberto?", "Algum deles já foi pago em parte?"], "dica": "Anote o número do título e use o painel de títulos agrupados para ver cliente e vencimento."}, {"titulo": "Títulos à receber agrupados", "tipo": "Painel interativo", "mostra": "Lista os títulos com vencimento no mês atual, com número, cliente, vencimento e valor. Três abas dividem a lista em Hoje, Semana e Mês, e cada aba mostra a quantidade de títulos.", "como_ler": "Na aba Hoje a data aparece em laranja. O valor é o valor total do título.", "perguntas": ["Quais títulos vencem hoje?", "Quais clientes vão pagar esta semana?", "Quantos títulos temos para o mês?"], "dica": "Clique em uma linha para filtrar todo o dashboard por aquele título. Clique de novo para tirar o filtro."}, {"titulo": "Saldo/Pago Clientes", "tipo": "Tabela", "mostra": "Por cliente: o valor já pago (verde) e o saldo em aberto. A lista traz clientes com saldo maior que zero, ordenados do maior saldo para o menor.", "como_ler": "Valor pago alto e saldo baixo indica bom pagador. Saldo alto com pouco pago indica cliente para cobrar.", "perguntas": ["Quanto cada cliente já pagou e quanto ainda deve?", "Quais clientes têm o maior saldo?"], "dica": "Use o tamanho do Valor Pago em relação ao saldo para decidir quem cobrar primeiro."}]}, {"nome": "Recebidos", "objetivo": "Mostrar o dinheiro que já entrou: por período, forma de cobrança, cliente, representante e estado.", "widgets": [{"titulo": "Cartões do topo: Recebido Hoje, Semana, Mês Atual, Mês Passado, Ano Atual e Total até Hoje", "tipo": "KPI", "mostra": "Seis valores recebidos (liquidação, juros e multa): hoje, na semana atual, no mês atual, no mês passado, no ano atual e o total desde 12/01/2024 até 07/10/2026 (datas fixas do cartão).", "como_ler": "Compare Mês Atual com Mês Passado para ver o ritmo. Os cartões não mudam com o filtro de data do topo.", "perguntas": ["Quanto recebemos hoje, na semana e no mês?", "O mês atual está acima ou abaixo do passado?", "Qual o total recebido no ano?"], "dica": "Filtre um cliente ou representante no topo para ver o recebido só dele."}, {"titulo": "Valor Recebido por Tipo de Cobrança", "tipo": "Pizza/Donut", "mostra": "Participação de cada forma de cobrança no valor recebido. Mostra as 5 maiores e agrupa o resto em Outros.", "como_ler": "Fatia maior é a forma pela qual mais dinheiro entrou.", "perguntas": ["Por qual forma de cobrança recebemos mais?", "O PIX já ganhou espaço sobre o boleto?"], "dica": "Clique em uma fatia para filtrar o dashboard por aquela forma de cobrança."}, {"titulo": "Valor Recebido por Cliente", "tipo": "Ranking (barras)", "mostra": "Os 15 clientes de quem mais recebemos no período.", "como_ler": "Barra maior é cliente que mais pagou. Não indica quem está devendo.", "perguntas": ["Quem são os melhores pagadores?", "Quanto da entrada vem dos maiores clientes?"], "dica": "Cruze com Saldo à receber por Cliente para ver clientes que pagam muito e também devem muito."}, {"titulo": "Valor Recebido por Representante", "tipo": "Ranking (barras)", "mostra": "Os 15 representantes com maior valor recebido da sua carteira.", "como_ler": "Barras maiores são carteiras que mais geraram caixa.", "perguntas": ["Qual carteira de representante mais gerou caixa?", "Quem está abaixo do esperado?"], "dica": "Use junto com o saldo por representante (tela À Receber) para comparar recebido e pendente."}, {"titulo": "Valor Recebido por UF", "tipo": "Pizza/Donut", "mostra": "Participação de cada estado no valor recebido. Mostra os 5 maiores e agrupa o resto em Outros.", "como_ler": "Fatia maior é o estado de onde veio mais dinheiro.", "perguntas": ["De quais estados vem a maior parte do recebimento?"], "dica": "Compare com o saldo a receber por UF para ver se a região que mais paga é também a que mais deve."}, {"titulo": "Valor Recebido por Dia", "tipo": "Calendário de calor", "mostra": "Calendário em que cada dia é colorido pelo valor recebido nele.", "como_ler": "Cor mais forte é dia de maior entrada. Dias em branco não tiveram recebimento.", "perguntas": ["Em quais dias entra mais dinheiro?", "Há buracos de recebimento no mês?"], "dica": "Passe o mouse no dia para ver o valor exato."}, {"titulo": "Valor Recebido por mês", "tipo": "Barras", "mostra": "Valor recebido somado por mês, em ordem de calendário.", "como_ler": "Cada barra é um mês. Compare meses seguidos para ver se o recebimento sobe ou cai.", "perguntas": ["O recebimento está crescendo ao longo do ano?", "Quais meses foram os mais fracos?"], "dica": "Compare com Saldo à Receber por mês para ver se o recebido acompanha a previsão."}, {"titulo": "Valor Recebido x Valor OR", "tipo": "Barras + linha", "mostra": "Por título que ainda tem saldo: o valor recebido (barra laranja) e o valor original do título (linha preta). Ordena do maior saldo para o menor.", "como_ler": "Barra perto da linha significa título quase pago. Barra baixa em relação à linha significa pagamento parcial.", "perguntas": ["Quais títulos foram pagos só em parte?", "Quanto falta para fechar os maiores títulos parciais?"], "dica": "Anote os títulos com maior diferença e procure o cliente na tela Vencidos - Vencer."}, {"titulo": "Títulos Recebidos Agrupados", "tipo": "Painel interativo", "mostra": "Lista os recebimentos creditados no mês atual, com número do título, cliente, data de crédito e valor recebido. Abas Hoje, Semana e Mês mostram a quantidade em cada uma.", "como_ler": "Na aba Hoje, a data aparece em laranja. O valor é o que entrou, não o valor total do título.", "perguntas": ["Quais clientes pagaram hoje?", "Quanto entrou esta semana e por quem?"], "dica": "Clique em uma linha para filtrar o dashboard por aquele título e clique de novo para tirar o filtro."}]}, {"nome": "Vencidos - Vencer", "objetivo": "Separar o saldo em aberto entre vencido e a vencer, por faixa de dias, e mostrar quem são os maiores devedores por cliente, rede e representante.", "widgets": [{"titulo": "Resumo por Faixa", "tipo": "Painel interativo", "mostra": "Três totais no topo: Total Geral Aberto, Total Vencido e Total a Vencer. Abaixo, dois blocos de quatro cartões: Risco de Inadimplência (vencido por faixa) e Projeção de Entrada (a vencer por faixa). As faixas são até 30 dias, 31 a 60, 61 a 90 e acima de 90 dias, contados a partir de hoje.", "como_ler": "Cartões vermelhos são dinheiro atrasado: quanto mais à direita, mais antigo e mais difícil de recuperar. Cartões verdes são entradas previstas. Títulos que vencem hoje entram em Até 30 dias, a vencer.", "perguntas": ["Quanto está vencido e há quanto tempo?", "Quanto vai entrar nos próximos 30, 60 e 90 dias?", "Qual a parte da carteira em risco?"], "dica": "Clique em um cartão de faixa para abrir a lista de títulos (vencimento, número, cliente e saldo), do maior para o menor. Use o botão Voltar aos Totais para sair."}, {"titulo": "Cliente", "tipo": "Matriz", "mostra": "Uma linha por cliente com o saldo vencido em cada faixa (até 30, 31 a 60, 61 a 90 e acima de 90 dias), o Total Vencido, o saldo a vencer nas mesmas faixas, o Total a Vencer e o Total Geral. Ordenada do maior total para o menor.", "como_ler": "Valores vermelhos são atraso e verdes são a vencer. Valores apagados indicam faixa sem títulos. Procure clientes com valor alto nas faixas mais à direita do vencido.", "perguntas": ["Quais clientes têm mais dinheiro atrasado?", "O atraso é recente ou antigo?", "Quanto cada cliente ainda vai pagar?"], "dica": "Clique em um valor colorido para ver os títulos (documento, emissão, vencimento e saldo). Clique no nome do cliente para filtrar o dashboard inteiro por ele."}, {"titulo": "Rede Cliente", "tipo": "Matriz", "mostra": "A mesma visão da tabela de clientes, mas somada por rede de clientes. Clientes sem rede ficam em Sem Rede.", "como_ler": "Mostra o risco por grupo: uma rede pode ter vários clientes pequenos que juntos somam um valor grande.", "perguntas": ["Qual rede tem mais saldo vencido?", "A dívida de uma rede está espalhada entre várias lojas?"], "dica": "Clique no valor em vermelho ou verde para ver os documentos em aberto. Clique no nome da rede para filtrar o dashboard por ela."}, {"titulo": "Representante", "tipo": "Matriz", "mostra": "A mesma visão, somada por representante: vencido e a vencer por faixa de dias, com totais.", "como_ler": "Mostra a carteira de cada representante e quanto dela está atrasado. Valores apagados indicam ausência de títulos na faixa.", "perguntas": ["Qual representante tem a pior carteira em atraso?", "Quem precisa ajudar na cobrança?"], "dica": "Clique em um valor para ver os títulos. Clique no nome do representante para filtrar o dashboard. Se a lista for grande, filtre por região ou supervisor no topo."}, {"titulo": "Cartões: Vencido Hoje, Vencido Semana Atual, Vencido Mês Atual, Recebido no Mês Atual e Total Vencido", "tipo": "KPI", "mostra": "Vencido Hoje: saldo em aberto com vencimento hoje. Vencido Semana Atual: saldo em aberto com vencimento do começo da semana até hoje. Vencido Mês Atual: saldo em aberto do começo do mês até hoje. Recebido no Mês Atual: dinheiro creditado no mês. Total Vencido: todo o saldo em aberto com vencimento anterior a hoje.", "como_ler": "Compare Vencido Mês Atual com Recebido no Mês Atual para ver se a cobrança está recuperando o que venceu. Total Vencido é a dívida acumulada.", "perguntas": ["Quanto venceu hoje e nesta semana sem ser pago?", "O recebido do mês cobre o que venceu?", "Qual o total de atraso?"], "dica": "Filtre um representante ou tipo de cobrança no topo para ver o mesmo conjunto de cartões para ele."}, {"titulo": "Cliente (Total Vencido)", "tipo": "Ranking (barras)", "mostra": "Os 10 clientes com maior saldo vencido.", "como_ler": "Barra maior é cliente com maior atraso em valor.", "perguntas": ["Quem lidera a inadimplência?"], "dica": "Procure o cliente na matriz de clientes para ver as faixas de atraso e abrir os títulos."}, {"titulo": "Representante (Total Vencido)", "tipo": "Ranking (barras)", "mostra": "Os 10 representantes com maior saldo vencido na carteira.", "como_ler": "Barra maior é carteira com mais atraso em valor.", "perguntas": ["Qual carteira de representante tem mais atraso?"], "dica": "Use para direcionar a conversa de cobrança com cada representante."}, {"titulo": "Centro de Custo (Total Vencido)", "tipo": "Ranking (barras)", "mostra": "Saldo vencido somado por centro de custo, do maior para o menor.", "como_ler": "Barra maior é a área ou origem do lançamento com mais atraso.", "perguntas": ["De qual centro de custo vem a maior parte do atraso?"], "dica": "Cruze com Elemento de Custo para apontar a origem do atraso."}, {"titulo": "Elemento de Custo (Total Vencido)", "tipo": "Ranking (barras)", "mostra": "Saldo vencido somado por elemento de custo.", "como_ler": "Barra maior é a classificação com mais atraso.", "perguntas": ["Que tipo de receita está mais atrasada?"], "dica": "Combine com o filtro do topo para olhar um elemento de custo por vez."}, {"titulo": "Portador (Total Vencido)", "tipo": "Ranking (barras)", "mostra": "Saldo vencido somado por portador (banco ou carteira de cobrança).", "como_ler": "Barra maior é o portador com mais títulos vencidos.", "perguntas": ["Qual banco ou carteira concentra o atraso?"], "dica": "Útil para cobrar o banco ou revisar a carteira de cobrança com mais atraso."}, {"titulo": "Tipo de Cobrança (Total Vencido)", "tipo": "Ranking (barras)", "mostra": "Saldo vencido somado por tipo de cobrança.", "como_ler": "Barra maior é a forma de cobrança com mais atraso.", "perguntas": ["Qual forma de cobrança tem mais inadimplência?"], "dica": "Compare com o peso de cada forma em Saldo à receber por Tipo de Cobrança para ver se ela atrasa mais que a média."}]}, {"nome": "Calendario", "objetivo": "Visão de calendário mensal do que foi recebido, do que vence e do saldo acumulado a receber dia a dia.", "widgets": [{"titulo": "Calendário de Recebimentos", "tipo": "Painel interativo", "mostra": "Calendário do mês com, em cada dia, o valor recebido (Rec, verde), o valor que vence (Venc, âmbar) e o A Receber acumulado até aquele dia (valor dos vencimentos menos o recebido, somados). À direita, um painel com o Valor à Receber Atual, o total recebido e o total que venceu no período, e a evolução mês a mês (recebido, vencimento e A Receber no fim do mês).", "como_ler": "O dia de hoje tem contorno laranja. Dias vazios estão sem movimento. O A Receber acumulado sobe quando vence mais do que entra e desce quando entra mais do que vence.", "perguntas": ["Quanto vence e quanto entrou em cada dia?", "O saldo acumulado a receber está subindo ou caindo?", "Quais meses tiveram mais vencimento do que recebimento?"], "dica": "Use Anterior e Próximo para navegar nos meses, ou clique em um mês da lista da direita. Clique em um dia com valor para ver os títulos que vencem nele, com documento, cliente, valor e saldo em aberto."}]}], "roteiros": [{"titulo": "Quem está nos devendo e há quanto tempo?", "passos": ["Em Vencidos - Vencer, veja o Resumo por Faixa: o Total Vencido e a divisão em até 30, 31 a 60, 61 a 90 e acima de 90 dias.", "Role até a matriz de Cliente e procure os maiores totais vencidos, olhando as faixas mais à direita (atrasos mais antigos).", "Clique no valor vermelho do cliente para abrir os títulos, com emissão, vencimento e saldo, e defina a cobrança.", "Clique no nome do cliente para filtrar o dashboard e conferir o histórico em Recebidos (Valor Recebido por Cliente)."]}, {"titulo": "O caixa do mês vai fechar o que esperamos?", "passos": ["Em Visão Geral Recebimentos, compare À Receber Mês com Recebido Mês nos cartões do topo.", "Em À Receber, veja Saldo pendente por Data de Vencimento para ver os dias que ainda concentram vencimentos.", "Abra Títulos à receber agrupados na aba Semana para listar quem deve pagar nos próximos dias.", "Em Vencidos - Vencer, confira o Vencido Mês Atual: é o que já venceu no mês e ainda não entrou."]}, {"titulo": "Qual carteira de representante merece atenção na cobrança?", "passos": ["Em À Receber, veja Saldo à receber por Representante para achar as maiores carteiras em aberto.", "Em Vencidos - Vencer, abra a matriz de Representante e veja quanto da carteira está vencido e em qual faixa.", "Compare com Recebimentos por representantes (Visão Geral) para ver se a carteira grande também recebe bem.", "Clique no nome do representante para filtrar o app e listar os clientes que mais atrasam."]}, {"titulo": "A forma de cobrança está influenciando o atraso?", "passos": ["Em Visão Geral Recebimentos, veja o gráfico Valor por Tipo de Cobrança para saber o peso de cada forma.", "Em Vencidos - Vencer, veja Tipo de Cobrança (Total Vencido) para ver qual forma acumula mais atraso.", "Compare os dois: uma forma com peso pequeno na carteira e atraso grande merece revisão.", "Em Recebidos, veja o Valor Recebido por Tipo de Cobrança para ver por qual forma o dinheiro realmente entra."]}]}, {"appId": 41140, "app": "Contas a Pagar", "resumo": "Mostra o que a empresa tem a pagar a fornecedores e o que já foi pago. Reúne títulos em aberto, vencidos e a vencer, pagamentos por fornecedor, empresa e forma de cobrança, e um calendário de pagamentos. Serve ao financeiro e à gestão para planejar o caixa e cobrar o fim dos atrasos.", "regras": ["O período padrão do painel é o ano atual. Os filtros do topo valem para todos os dashboards.", "\"Em aberto\" significa título com saldo ainda a pagar. O saldo é o que falta pagar da ordem de pagamento.", "\"Valor\" é o valor total da ordem de pagamento. \"Saldo\" é o que ainda não foi pago dela.", "\"Pago\" soma só os movimentos de liquidação, juros e multa. Descontos e tarifas não entram.", "O dia de um pagamento é a data do movimento (data de crédito). O dia de um título a pagar é a data de vencimento.", "Vencido é o título em aberto com vencimento antes de hoje. A vencer é o que vence hoje ou depois.", "Alguns cartões e gráficos têm período próprio (hoje, semana, mês, ano) e não seguem o período do topo. Isso está indicado em cada um."], "glossario": [{"termo": "Ordem de pagamento (OP)", "significado": "O título que a empresa deve a um fornecedor. Tem número, vencimento e valor."}, {"termo": "Valor da OP", "significado": "Valor total da ordem de pagamento, pago ou não."}, {"termo": "Saldo", "significado": "Quanto ainda falta pagar de uma ordem de pagamento."}, {"termo": "Valor pago (movimentado)", "significado": "Soma dos pagamentos efetivos: liquidação, juros e multa. Não inclui desconto nem tarifa."}, {"termo": "À pagar", "significado": "Saldo em aberto com vencimento no período indicado (hoje, semana, mês ou ano)."}, {"termo": "Vencido", "significado": "Saldo em aberto cujo vencimento já passou."}, {"termo": "A vencer", "significado": "Saldo em aberto que vence hoje ou nos próximos dias."}, {"termo": "Faixa de prazo", "significado": "Grupo de dias de atraso ou de espera: até 30 dias, 31 a 60, 61 a 90 e acima de 90."}, {"termo": "Tipo de cobrança", "significado": "Forma como o fornecedor cobra: boleto, PIX, DOC/TED, cartão, cheque, entre outras."}, {"termo": "Portador", "significado": "Quem ou onde o título está ligado para o pagamento, como o banco ou a carteira."}, {"termo": "Centro de custo / Elemento de custo", "significado": "Classificações que dizem em qual área e em qual tipo de gasto a despesa foi lançada."}, {"termo": "Grupo de fornecedor", "significado": "Agrupamento dos fornecedores. Nos gráficos de pizza o grupo aparece por sigla, como SP, RS e MG."}], "dashboards": [{"nome": "Visão Geral Pagamentos", "objetivo": "Resumo do que vence e do que foi pago hoje, na semana e no mês, com os principais fornecedores, empresas e formas de cobrança.", "widgets": [{"titulo": "À Pagar Hoje / Semana / Mês", "tipo": "KPI", "mostra": "Três cartões com o saldo em aberto que vence hoje, na semana atual e no mês atual (mês inteiro). Só entram títulos com saldo maior que zero.", "como_ler": "Número maior significa mais dinheiro a sair no período. Compare hoje com a semana e o mês para ver como o pagamento se distribui.", "perguntas": ["Quanto preciso ter em caixa hoje?", "Quanto vence nesta semana?", "Quanto falta pagar até o fim do mês?"], "dica": "Compare cada cartão com o Pago do mesmo período, logo ao lado, para ver quanto já foi feito."}, {"titulo": "Pago Hoje / Semana / Mês", "tipo": "KPI", "mostra": "Três cartões com o valor efetivamente pago hoje, na semana atual e no mês atual. Soma liquidação, juros e multa, pela data do pagamento.", "como_ler": "Mostra o ritmo de pagamento. Se o pago do mês está bem abaixo do À Pagar Mês, ainda há muito a quitar.", "perguntas": ["Quanto já saiu do caixa hoje?", "O ritmo de pagamento da semana está em linha com o que vence?", "Quanto já paguei neste mês?"], "dica": "Use junto com os cartões À Pagar para montar a leitura: o que vence, o que já foi pago e o que resta."}, {"titulo": "Top 10 Fornecedores em Atraso", "tipo": "Barras", "mostra": "Os 10 fornecedores com maior valor de ordens de pagamento, em barras deitadas. A soma é do valor total das ordens com vencimento até 21/09/2026 (período fixo deste gráfico).", "como_ler": "Barra mais longa é o fornecedor com mais valor nesse recorte. O gráfico soma o valor da ordem, não só o saldo em aberto.", "perguntas": ["Com quais fornecedores concentro mais valor?", "Quem eu devo priorizar na negociação?"], "dica": "Para ver o que ?", "Os picos de pagamento estão previstos no fluxo de caixa?"], "dica": "Cruze com o Calendário de pagamentos para ver os dias e os títulos por trás de cada pico."}, {"titulo": "Fornecedores Transacionando", "tipo": "KPI", "mostra": "Quantidade de fornecedores diferentes que têm ordens de pagamento no período do filtro.", "como_ler": "Número maior significa base de fornecedores mais ampla. Muda conforme os filtros do topo.", "perguntas": ["Com quantos fornecedores a empresa trabalha no período?"], "dica": "Filtre uma empresa ou um período e veja como o número muda."}, {"titulo": "Emitido x Realizado - Ano anterior", "tipo": "Barras", "mostra": "Por mês, duas barras do ano anterior até a mesma data de hoje: o valor emitido (valor das ordens de pagamento) e o valor realizado (pago).", "como_ler": "Barra preta é o emitido e barra laranja é o pago. Quando a laranja é menor, parte do emitido ficou sem pagar naquele mês.", "perguntas": ["No ano anterior, quanto do emitido foi pago?", "Em que meses a diferença foi maior?"], "dica": "Use como referência para comparar com o ritmo de pagamento deste ano."}, {"titulo": "Pagamentos por Empresa", "tipo": "Barras", "mostra": "Valor pago por empresa, em barras deitadas, para as 10 empresas que mais pagaram.", "como_ler": "Barra maior é a empresa com mais pagamentos efetivos.", "perguntas": ["Qual empresa do grupo mais paga?", "Os pagamentos estão distribuídos como esperado?"], "dica": "Compare com Saldo à pagar por Empresa no dashboard À Pagar."}, {"titulo": "Valor Movimentado por Dia", "tipo": "Calendário de calor", "mostra": "Calendário em que cada dia é colorido conforme o valor pago nele. Considera pagamentos efetivos, do mesmo período do ano anterior até hoje.", "como_ler": "Cor mais forte é dia de mais pagamento. Dias vazios ou claros tiveram pouco ou nenhum pagamento.", "perguntas": ["Em quais dias do mês concentro pagamentos?", "Há dias que sempre pesam mais?"], "dica": "Procure um padrão (início, meio ou fim de mês) para melhorar o planejamento de caixa."}, {"titulo": "Valor movimentado x Saldo x Valor OP por Conta Bancária", "tipo": "Barras+Linha", "mostra": "Para cada conta bancária, três números lado a lado: valor pago (amarelo), valor das ordens de pagamento (preto) e saldo ainda em aberto (área laranja).", "como_ler": "Compare as três medidas na mesma conta. Se o saldo é grande perto do valor da OP, pouca coisa foi paga por essa conta.", "perguntas": ["Por qual conta saem mais pagamentos?", "Em qual conta há mais saldo a pagar?"], "dica": "Use para prever quanto cada conta precisa ter de saldo nas próximas datas."}]}, {"nome": "À Pagar", "objetivo": "Mostrar o saldo em aberto: quanto é, quando vence e a quem se deve, por fornecedor, empresa, grupo e forma de cobrança.", "widgets": [{"titulo": "Cartões de saldo (À Pagar Hoje, Semana, Mês, Ano, Total Aberto e Total em Atraso)", "tipo": "KPI", "mostra": "Seis cartões com o saldo a pagar e a quantidade de títulos: hoje, na semana, no mês, no ano (títulos em aberto), o total em aberto e o total em atraso. O Total Aberto usa um período amplo, de 2000 a 2040. O Total em Atraso considera vencimentos de 2013 até 07/10/2026 (período fixo do cartão).", "como_ler": "O cartão vermelho é o de atraso. Os demais, em laranja, mostram o que ainda vai vencer. \"Qtd.\" é o número de títulos.", "perguntas": ["Quanto temos a pagar em cada período?", "Quanto já está vencido?", "Quantos títulos estão por trás de cada valor?"], "dica": "Parta do Total Aberto e veja quanto está atrasado. Para saber quem, use o dashboard Vencidos - Vencer."}, {"titulo": "Saldo à pagar por Tipo de Cobrança", "tipo": "Pizza/Donut", "mostra": "Participação de cada forma de cobrança no saldo em aberto. Mostra as 3 maiores e agrupa o resto em \"-Outros-\".", "como_ler": "Fatia maior concentra mais saldo a pagar naquela forma.", "perguntas": ["Quanto do que devo é boleto e quanto é PIX?", "Qual forma de pagamento exige mais atenção?"], "dica": ""}, {"titulo": "Saldo à pagar p é calculado e o percentual aplicado. Aparecem ao abrir os itens de uma nota."}], "dashboards": [{"nome": "Monitor Fiscal", "objetivo": "Mostrar o saldo de impostos do período e permitir auditar de onde vem cada valor, por imposto, nota e produto.", "widgets": [{"titulo": "Monitor Fiscal com Auditoria", "tipo": "Painel interativo", "mostra": "Ao abrir, você escolhe uma visão: Visão Geral, ICMS, PIS, COFINS ou IPI. Cada visão mostra três cartões: Total Débito (saídas), Total Crédito (entradas) e Saldo Líquido do Período (débito menos crédito), com selo DEVEDOR ou CREDOR. Na Visão Geral aparecem ainda quatro cartões pequenos, um por imposto, com saldo, débito (D) e crédito (C). Abaixo fica a Auditoria: lista das notas que compõem o valor (número, emissão, cliente ou fornecedor, valor bruto, valor líquido e o imposto), com a opção de alternar entre Débitos (notas de saída) e Créditos (notas de entrada), e uma coluna lateral Por produto com os 10 produtos de maior imposto e o restante agrupado em Demais.", "como_ler": "Vermelho é débito e saldo devedor; verde é crédito e saldo credor. Quando o saldo de um imposto fica credor, o painel mostra uma animação de confirmação. Abaixo da lista, o Total da lista é comparado com o cartão: o selo verde Confere com o card indica que as notas listadas fecham com o número do cartão; o selo laranja mostra a diferença. As barras de Por produto mostram o peso de cada produto no imposto.", "perguntas": ["Estou com imposto a pagar ou a compensar neste mês?", "Qual imposto pesa mais no saldo: ICMS, PIS, COFINS ou IPI?", "Quais notas de venda geraram mais débito?", "Quais compras estão dando mais crédito?", "Quais produtos concentram o imposto?"], "dica": "Clique num dos quatro cartões de imposto da Visão Geral para abrir a visão dele. Na lista, clique numa nota para ver os itens, com base de cálculo e alíquota. O ícone de Excel exporta a lista atual."}]}], "roteiros": [{"titulo": "O saldo de impostos está devedor. De onde vem?", "passos": [ ento", "Faturamento", "Faturamento Mensal x Metas"], "carga": "meta"}, {"app": "Faturamento", "metrica": "Positivação de produto", "formula": "Clientes que compraram o produto no dia ÷ clientes atendidos no dia", "detalhe": "Indica em que parte da carteira ativa o produto está presente.", "onde": ["Faturamento", "Clientes", "Positivação de produtos"], "carga": "nf"}, {"app": "Faturamento", "metrica": "Dias sem comprar (churn)", "formula": "Hoje − data da última nota de venda válida do cliente", "detalhe": "Usa o histórico completo do cliente, não só o período filtrado. A tabela de última compra é recalculada uma vez por dia, de madrugada.", "onde": ["Faturamento", "Clientes", "Carteira de clientes"], "carga": "diaria"}, {"app": "Faturamento", "metrica": "Mesmo período do ano anterior", "formula": "Mesma soma, com o período do filtro deslocado 1 ano para trás", "detalhe": "Acompanha o período escolhido no topo: se o filtro é março/2026, compara com março/2025.", "onde": ["Faturamento", "Faturamento", "Faturamento Mensal x Metas"], "carga": "nf"}, {"app": "Vendas", "metrica": "Pedidos totais", "formula": "Σ valor líquido dos itens de pedido", "detalhe": "Todos os pedidos do período, em todas as etapas. Os cartões de etapa (Faturados, Expedição, Carteira, Análise, Cancelado) dividem esse total.", "onde": ["Vendas", "Controle de Pedido", "Pedidos Totais"], "carga": "pedido"}, {"app": "Vendas", "metrica": "Ticket médio de pedido", "formula": "Valor líquido dos pedidos ÷ nº de pedidos distintos", "detalhe": "Valor médio por pedido no período.", "onde": ["Vendas", "Controle de Pedido", "Ticket Médio"], "carga": "pedido"}, {"app": "Vendas", "metrica": "% da meta de vendas", "formula": "Pedidos válidos ÷ meta do responsável × 100", "detalhe": "Pedido válido = não cancelado, não agrupado, finalizado, e com tipo de operação que participa dos indicadores. Meta vem do cadastro Meta de Vendas por Agrupamento.", "onde": ["Vendas", "Controle de Pedido", "Vendas Mensal x Metas"], "carga": "meta"}, {"app": "Vendas", "metrica": "Faturamento x Vendas", "formula": "Valor líquido faturado lado a lado com o valor líquido pedido, mês a mês", "detalhe": "A distância entre as barras mostra pedido que ainda não virou nota.", "onde": ["Vendas", "Controle de Pedido", "Faturamento x Vendas (Valor Líq.)"], "carga": "pedido"}, {"app": "Vendas", "metrica": "Curva ABC", "formula": "Produtos ordenados pelo valor vendido; A até 80% do acumulado, B até 95%, C o restante", "detalhe": "Mostra os poucos itens que concentram a maior parte das vendas.", "onde": ["Vendas", "Curva ABC", "Curva ABC de Pedidos de Venda"], "carga": "pedido"}, {"app": "Devoluções", "metrica": "Devoluções (R$)", "formula": "Σ valor bruto dos itens de entrada que devolvem uma nota de venda", "detalhe": "Datadas pela emissão da nota de venda original, como no relatório FAT072. A nota de devolução emitida no faturamento não é somada de novo.", "onde": ["Devoluções", "Devolução", "Devoluções (R$)"], "carga": "nf"}, {"app": "Devoluções", "metrica": "% de devolução", "formula": "Devoluções (bruto) ÷ faturamento bruto do mesmo recorte", "detalhe": "Com o mesmo filtro de cliente, representante ou UF nos dois lados.", "onde": ["Devoluções", "Devolução", "% Devolução"], "carga": "nf"}, {"app": "Devoluções", "metrica": "Faturamento − devoluções", "formula": "Faturamento bruto − devoluções (bruto)", "detalhe": "Corresponde à coluna Diferença do FAT072.", "onde": ["Devoluções", "Devolução", "Faturamento − Devoluções"], "carga": "nf"}, {"app": "Devoluções", "metrica": "Clientes com devolução", "formula": "Nº de clientes distintos com ao menos um item devolvido", "detalhe": "Conta cada cliente uma vez no período.", "onde": ["Devoluções", "Devolução", "Clientes com Devolução"], "carga": "nf"}, {"app": "Compras", "metrica": "Total de compras", "formula": "Σ valor bruto dos itens de NF de entrada + Σ valor dos conhecimentos de transporte (CT-e)", "detalhe": "Inclui o frete pago na compra.", "onde": ["Compras", "Compras x Vendas", "Total Compras"], "carga": "nf"}, {"app": "Compras", "metrica": "Lucro bruto", "formula": "Vendas líquidas (operações que participam) − CMV", "detalhe": "CMV = custo das saídas de venda gravado na movimentação de estoque.", "onde": ["Compras", "Compras x Vendas", "Lucro Bruto"], "carga": "nf"}, {"app": "Compras", "metrica": "Markup médio", "formula": "(Vendas líquidas − CMV) ÷ CMV", "detalhe": "Quanto, em média, o preço de venda está acima do custo.", "onde": ["Compras", "Compras x Vendas", "Markup Médio"], "carga": "nf"}, {"app": "Compras", "metrica": "Giro / cobertura", "formula": "Quantidade vendida ÷ quantidade comprada", "detalhe": "Perto de 100%: quase tudo que entrou já saiu. Bem abaixo de 100%: estoque acumulando.", "onde": ["Compras", "Compras x Vendas", "Giro Cobertura"], "carga": "nf"}, {"app": "Compras", "metrica": "Ticket médio de compra", "formula": "Valor bruto das entradas ÷ nº de notas de entrada", "detalhe": "Valor médio de cada nota de compra.", "onde": ["Compras", "Nota Fiscal de Entrada", "Variação compras"], "carga": "nf"}, {"app": "Estoque", "metrica": "Saldo em estoque", "formula": "Σ (saldo de cada lote × custo médio do produto)", "detalhe": "Dinheiro parado em estoque agora; não depende do filtro de período.", "onde": ["Estoque", "Estoque/Lote", "Cartões do topo"], "carga": "nf"}, {"app": "Estoque", "metrica": "Itens parados (+90 dias)", "formula": "Nº de produtos com saldo e sem saída há mais de 90 dias", "detalhe": "Candidatos a promoção, transferência ou revisão de compra.", "onde": ["Estoque", "Estoque/Lote", "Lista de produtos"], "carga": "nf"}, {"app": "Estoque", "metrica": "Entradas e saídas", "formula": "Σ quantidade movimentada por tipo (entrada / saída)", "detalhe": "Vem da movimentação de estoque do ERP, no período do filtro.", "onde": ["Estoque", "Estoque/Lote", "Detalhe do produto › Movimentações"], "carga": "nf"}, {"app": "Contas a Receber", "metrica": "À receber (hoje / semana / mês)", "formula": "Σ saldo dos títulos em aberto com vencimento na janela", "detalhe": "Janela calculada a partir de hoje: hoje; de hoje até o fim da semana; de hoje até o fim do mês.", "onde": ["Contas a Receber", "À Receber", "Cartões do topo"], "carga": "fin"}, {"app": "Contas a Receber", "metrica": "Total vencido (inadimplência)", "formula": "Σ saldo dos títulos em aberto com vencimento até ontem", "detalhe": "Título vencido hoje ainda não conta como atrasado.", "onde": ["Contas a Receber", "Vencidos - Vencer", "Total Vencido"], "carga": "fin"}, {"app": "Contas a Receber", "metrica": "Recebido", "formula": "Σ valor dos títulos baixados, pela data da movimentação", "detalhe": "Usa a data em que o dinheiro entrou, não o vencimento.", "onde": ["Contas a Receber", "Recebidos", "Cartões do topo"], "carga": "fin"}, {"app": "Contas a Receber", "metrica": "Faixas de atraso", "formula": "Saldo vencido agrupado por dias de atraso", "detalhe": "Quanto mais à direita, mais difícil a recuperação.", "onde": ["Contas a Receber", "Vencidos - Vencer", "Resumo por Faixa"], "carga": "fin"}, {"app": "Contas a Pagar", "metrica": "À pagar (hoje / semana / mês)", "formula": "Σ saldo das ordens de pagamento em aberto com vencimento na janela", "detalhe": "Mesma lógica de janela do Contas a Receber.", "onde": ["Contas a Pagar", "À Pagar", "Cartões de saldo"], "carga": "fin"}, {"app": "Contas a Pagar", "metrica": "Total em atraso", "formula": "Σ saldo em aberto com vencimento até ontem", "detalhe": "Compromissos já vencidos e não pagos.", "onde": ["Contas a Pagar", "Vencidos - Vencer", "Total Vencido"], "carga": "fin"}, {"app": "Contas a Pagar", "metrica": "Pago", "formula": "Σ valor das ordens com status Pago, pela data da movimentação", "detalhe": "Data em que o pagamento saiu da conta.", "onde": ["Contas a Pagar", "Pagos", "Cartões do topo"], "carga": "fin"}, {"app": "Monitor Fiscal", "metrica": "Imposto a recolher (por tributo)", "formula": "Débito nas saídas − crédito nas entradas (ICMS, PIS, COFINS, IPI)", "detalhe": "Débito vem das notas de venda válidas; crédito, das notas de entrada do mesmo período.", "onde": ["Monitor Fiscal", "Monitor Fiscal", "Monitor Fiscal com Auditoria"], "carga": "nf"}, {"app": "Monitor Fiscal", "metrica": "Carga tributária", "formula": "Total de impostos das saídas ÷ faturamento bruto", "detalhe": "Quanto do faturamento vai para tributos.", "onde": ["Monitor Fiscal", "Monitor Fiscal", "Monitor Fiscal com Auditoria"], "carga": "nf"}], "sincronizacao": {"fuso": "America/Sao_Paulo", "cargas": [{"id": "nf", "nome": "Atualização contínua", "quando": "A cada 30 minutos, das 07:00 às 19:00", "duracao": "5 a 8 min", "o_que": "Notas de saída e entrada, itens, devoluções, pedidos, ordens de compra, contas a pagar e a receber, movimentação de estoque, saldo por lote, clientes, produtos e demais cadastros. Traz o que mudou desde a última carga.", "inicio": "07:00", "fim": "19:00", "passo_min": 30}, {"id": "integridade", "nome": "Conferência de integridade", "quando": "A cada 2 horas, das 08:30 às 16:30", "duracao": "6 a 9 min", "o_que": "Relê por completo notas, pedidos, financeiro e estoque, para corrigir alterações e exclusões feitas no ERP depois da carga contínua.", "inicio": "08:30", "fim": "16:30", "passo_min": 120}, {"id": "diaria", "nome": "Recálculo diário", "quando": "Uma vez por dia, por volta da meia-noite", "duracao": "menos de 1 min", "o_que": "Atividade diária e última compra de cada cliente, usadas no painel Clientes (churn).", "inicio": "00:00", "fim": "00:00", "passo_min": 0}, {"id": "mensal", "nome": "Recarga completa", "quando": "Dia 1 de cada mês, às 04:00", "duracao": "cerca de 10 min", "o_que": "Recarrega todas as 43 tabelas do zero, como garantia geral.", "inicio": "04:00", "fim": "04:00", "passo_min": 0}], "metas": "Metas de faturamento e de vendas vêm dos cadastros do próprio BI. Alterou o cadastro, o painel já mostra o valor novo."}, "tutoriais": [{"id": "metas", "titulo": "Cadastrar, editar ou excluir uma meta", "resumo": "As metas ficam em Cadastros que você preenche na própria plataforma. Salvou, o painel de metas mostra o valor novo em segundos.", "icone": "target", "aviso": {"tipo": "acesso", "titulo": "Não vê o menu Cadastros ou o botão de editar?", "texto": "Peça acesso ao administrador do Horus BI da sua empresa. Ele libera, em HEC > Usuários ou Grupos, as permissões do Cadastro de metas: Ler (ver), Criar (nova meta), Atualizar (editar) e Excluir. Sem a permissão, o menu ou o botão simplesmente não aparecem."}, "blocos": [{"titulo": "Onde ficam as metas do Bacco", "tipo": "lista", "itens": ["Meta de Faturamento por Agrupamento: usada no app Faturamento, no gráfico Faturamento Mensal x Metas.", "Meta de Vendas por Agrupamento: usada no app Vendas, nos gráficos Vendas Mensal x Metas e Vendas Faturadas x Meta (painel Apresentação).", "As duas ficam no menu Cadastros do DataViz, agrupadas pela mesa em que foram publicadas."]}, {"titulo": "Cadastrar uma meta", "tipo": "passos", "itens": ["Abra o menu Cadastros e clique em Meta de Faturamento por Agrupamento (ou Meta de Vendas por Agrupamento).", "Crie um registro novo pela grade (funciona como planilha: Enter confirma, Esc cancela) ou pelo formulário, que abre num painel lateral com as seções Identificação e Meta.", "Competência: escolha o mês da meta. Um mês por registro.", "Tipo de Agrupamento: Geral (meta da empresa), Cliente, Produto, Grupo de Produto, Representante ou Responsável.", "Preencha só a chave que combina com o tipo: Representante para tipo Representante, Cliente para tipo Cliente, e assim por diante. Busque pelo nome, não pelo código. Na meta Geral, deixe as chaves vazias.", "Meta (R$): digite o valor do mês.", "Salve. Competência, Tipo de Agrupamento e Meta são obrigatórios."]}, {"titulo": "Editar ou excluir", "tipo": "passos", "itens": ["Editar: clique na célula da grade, altere e pressione Enter. Ou abra o registro no formulário, altere e salve.", "Copiar a meta para o mês seguinte: no formulário, use Clonar e troque só a Competência e o valor.", "Excluir: abra o registro no formulário, clique nos três pontinhos (⋯) e escolha excluir.", "Ver quem mudou: os três pontinhos (⋯) também abrem o histórico do registro."]}, {"titulo": "Fazer a meta aparecer no app", "tipo": "passos", "itens": ["Abra o app Faturamento (ou Vendas) e vá ao gráfico de metas.", "Deixe o filtro de data do topo no mês da meta. O gráfico compara realizado e meta mês a mês.", "Use o seletor do gráfico para escolher o tipo (Geral, Representante, Responsável...). Ele soma as metas daquele tipo.", "Se o valor ainda não mudou, aguarde alguns segundos e atualize a página. O Cadastro chega ao BI quase na hora, sem esperar a carga do ERP."]}, {"titulo": "Cuidados", "tipo": "lista", "itens": ["Só existe uma meta por mês + tipo + item. Cadastrar de novo a mesma combinação é recusado: edite a que já existe.", "Para carregar muitas metas de uma vez: Cadastro > Ações > Importar (arquivo XLSX). A importação é tudo ou nada: uma linha com erro barra o arquivo inteiro.", "Se a meta não aparecer depois de salva, você tem acesso ao Cadastro mas o gráfico continua zerado: acione o suporte WebMais, porque o Cadastro precisa estar ligado ao app."]}], "fontes": ["https://docs.horusbi.com.br/dataviz/04-features/cadastros", "https://docs.horusbi.com.br/dw/tables/cadastros/dados", "https://docs.horusbi.com.br/hec/resources/cadastros-permissoes", "https://docs.horusbi.com.br/dataviz/04-features/cadastros/no-bi"], "videos": [{"url": "https://claude.ai/artifact/2GVpJBuayfm8ZFLzr4yi3u", "titulo": "Cadastrar e consultar metas", "duracao": "49 s", "resumo": "Do menu Cadastros ao gráfico de metas no app Faturamento, nas telas reais do Horus.", "arquivo": "videos/cadastrar-e-consultar-metas.mp4"}]}, {"id": "relatorios-alertas", "titulo": "Criar relatórios e alertas, configurar e publicar", "resumo": "O relatório é montado no Explorer, em cima das tabelas ligadas do app. O mesmo relatório vira alerta pelo sino, com horário, condição e canal.", "icone": "report", "motion": "tabelas", "blocos": [{"titulo": "Como as tabelas se ligam", "tipo": "lista", "itens": ["A tabela de fato guarda os números (no Faturamento: cada item de nota, com valor e quantidade).", "As dimensões descrevem esses números: Calendário (quando), Clientes e Representante (quem), Produtos (o quê), Tipo de operação (como).", "Toda ligação é de 1 para muitos: um cliente tem muitas notas, uma nota tem muitos itens. Por isso um filtro em Clientes chega aos itens.", "Dois fatos (ex.: vendas e metas) não se ligam direto. Os dois se ligam às mesmas dimensões, como Calendário e Representante. Num relatório de meta x realizado, use as colunas dessas dimensões, não a data de um dos fatos."]}, {"titulo": "Métricas disponíveis", "tipo": "lista", "itens": ["Qualquer coluna de número, com Soma, Média, Mínimo, Máximo, Contagem ou Contagem Distinta.", "Agrupar transforma a coluna em linha do relatório (ex.: por cliente, por mês).", "Datas podem ser agrupadas por Dia, Mês, Ano/Mês, Ano, Semana do Ano, Dia da Semana e outras.", "Expressões são métricas prontas do app, como Ticket médio, Margem % e CMV, com o mesmo cálculo dos painéis. Se não achar um campo, procure nas Expressões."]}, {"titulo": "Criar um relatório", "tipo": "passos", "itens": ["Abra o app (ex.: Faturamento) e clique na aba Explorer, no topo.", "Na caixa de busca, digite a coluna que você quer (ex.: emissão) e tecle Enter para escolher. Repita para cada coluna: Número Nota, Razão Social, Valor Líquido Item.", "Clique fora da caixa: o relatório aparece, com o total no rodapé.", "Para trocar a agregação de um campo (soma, média, contagem), use Funções na lista de sugestões.", "Ordene, quebre e compare períodos pelo painel Estrutura, à esquerda (Ordenação, Quebras, Eixo matriz, Cenários)."]}, {"titulo": "Salvar e publicar o relatório", "tipo": "passos", "itens": ["Clique em Salvar relatório, digite o nome (ex.: Faturamento Total) e clique em Salvar. Ele aparece em Pessoais, à esquerda.", "Para o time ver: nos três pontos (Ações) ao lado do relatório, clique em Publicar e escolha publicar para o app.", "Para exportar, clique no ícone de Excel ou de PDF na barra do topo. A tela mostra até 500 linhas; a exportação leva todas.", "Para enviar a alguém, use o ícone de compartilhar: o link leva colunas, filtros e ordenação."]}, {"titulo": "Criar um alerta (plano Ultra)", "tipo": "passos", "itens": ["No menu lateral, clique no megafone (Alertas) e depois em Criar alerta, no canto superior direito.", "Em Dados gerais, digite o Nome do alerta.", "Em Quando enviar, escolha Agendado (Diário ou Mensal, com horário e dias da semana) ou Condicional (os filtros viram a regra de disparo).", "Em Usuários/Grupos, clique em Adicionar e escolha quem recebe.", "Em Canais de Envio do Alerta, ligue E-mail e WhatsApp (ou Telegram). WhatsApp exige o telefone no seu perfil.", "Clique em Salvar e abra a aba Conteúdo.", "Adicione o que vai na mensagem: Gráfico, Texto, Análise com IA, Relatório ou Dashboard. A Análise com IA rende mais em envios menos frequentes, como uma vez por mês.", "Clique em Pré-visualizar para conferir e, se estiver certo, em Salvar. Pronto: o alerta está criado.", "Acompanhe as entregas em Histórico de alertas, no topo da tela Alertas."]}, {"titulo": "Para ter acesso", "tipo": "lista", "itens": ["Criar alerta depende da permissão Alerta (Criar, Ler, Editar, Excluir) no seu grupo. Peça ao administrador se o sino não aparecer.", "Alertas nascem privados. Para enviar a outras pessoas, o administrador liga Permitir usuários não administradores de compartilhar alertas.", "Quem recebe vê o conteúdo mesmo sem acesso ao app: ele é gerado com o acesso de quem criou. Escolha os destinatários com cuidado."]}], "fontes": ["https://docs.horusbi.com.br/dataviz/02-apps/explorer", "https://docs.horusbi.com.br/dataviz/02-apps/data-modeling", "https://docs.horusbi.com.br/dataviz/04-features/alerts", "https://docs.horusbi.com.br/dataviz/04-features/alerts/conditions", "https://docs.horusbi.com.br/dataviz/04-features/alerts/channels", "https://docs.horusbi.com.br/dataviz/04-features/alerts/permissions"], "videos": [{"url": "https://claude.ai/artifact/5vN6VBCQLfoEUyuXL5ZYtu", "titulo": "Criar um relatório", "duracao": "48 s", "resumo": "Abrir o Explorer, digitar as colunas, salvar, publicar e exportar, nas telas reais do Horus.", "arquivo": "videos/criar-um-relatorio.mp4"}, {"url": "https://claude.ai/artifact/JsaiCVXdf9ZMV13YEJ8iDg", "titulo": "Criar um alerta", "duracao": "51 s", "resumo": "Do menu Alertas ao alerta salvo, com e-mail e WhatsApp, nas telas reais do Horus.", "arquivo": "videos/criar-um-alerta.mp4"}]}, {"id": "filtros", "titulo": "Explorar filtros no app, nos relatórios e nos alertas", "resumo": "Filtro é a forma de perguntar ao painel. Ele começa nos filtros do topo, continua no clique dos gráficos e vale também dentro de relatórios e alertas.", "icone": "filter", "blocos": [{"titulo": "No app: a barra do topo", "tipo": "passos", "itens": ["Os filtros são de cada app: o que você filtra no Faturamento não muda o Vendas.", "Para começar do zero, clique em Limpar tudo (a borracha ao lado de Adicionar Filtro).", "Clique em Adicionar Filtro, escolha o campo (ex.: Grupo de Produto) e marque os valores.", "Mudou um filtro, todos os gráficos da tela acompanham. Para tirar um filtro, clique no X dele.", "Quanto mais filtros, menos dados entram: filtrar um grupo de produto tira do faturamento tudo o que foi vendido de outros grupos."]}, {"titulo": "Filtros que o app do Bacco já traz", "tipo": "lista", "itens": ["Data (Calendário): começa em Mês Atual na maioria dos apps e em Ano Atual no Contas a Pagar, no Contas a Receber e no Devoluções.", "Participa Indicadores = Participa (Faturamento, Vendas, Monitor Fiscal e Devoluções): só entram tipos de operação de saída marcados como venda no ERP.", "Status NF = Finalizado (Faturamento, Monitor Fiscal e Devoluções): notas canceladas não entram.", "Esses filtros você pode trocar na tela. Filtros de segurança (o que cada usuário pode ver) não aparecem para remoção."]}, {"titulo": "Período e datas", "tipo": "lista", "itens": ["Use sempre a Data do Calendário: ela chega a todos os gráficos ligados ao Calendário.", "Períodos relativos se atualizam sozinhos: Hoje, Ontem, Esta semana, Este mês, Mês passado, Este ano, Últimos X dias/meses.", "Para um intervalo fixo, use Entre e escolha início e fim.", "Mudou a data e um número não mexeu? Esse gráfico tem um filtro próprio (ex.: sempre o ano atual). Não é erro de dado."]}, {"titulo": "Clicar no gráfico para filtrar", "tipo": "lista", "itens": ["Clicar numa barra, fatia ou ponto vira filtro e atualiza o resto da tela. Tire pelo X na barra do topo.", "Gráficos com detalhamento abrem o nível de baixo (ano → meses). Alguns mostram botões para trocar o eixo.", "Ir para o Relatório abre a tabela por trás do gráfico, já com os filtros da tela."]}, {"titulo": "Nos relatórios (Explorer)", "tipo": "lista", "itens": ["Funil na barra: novo critério com os operadores =, !=, >, <, >=, <=, Entre, Contém, Não Contém e Relativo.", "Clique num valor da tabela > Filtrar por Coluna, ou clique direito > Filtrar por esta linha para detalhar uma linha.", "Os filtros ficam salvos junto com a visão (Favoritos > Salvar visão atual)."]}, {"titulo": "Nos alertas", "tipo": "lista", "itens": ["No alerta condicional, os filtros são a regra de disparo. Se a consulta voltar vazia, nada é enviado.", "Variáveis de texto e blocos de relatório têm filtros próprios (ex.: Data entre Ontem e Ontem).", "O bloco de gráfico usa os filtros salvos no dashboard ou no widget. Para outra versão, salve uma visão com os filtros e use-a."]}], "fontes": ["https://docs.horusbi.com.br/dataviz/01-getting-started", "https://docs.horusbi.com.br/dataviz/02-apps/general", "https://docs.horusbi.com.br/guia/receitas/calendario-filtros", "https://docs.horusbi.com.br/dataviz/03-widgets", "https://docs.horusbi.com.br/dataviz/02-apps/explorer"], "videos": [{"url": "https://claude.ai/artifact/WbcgZV9SFdfRjhU7rgAAWr", "titulo": "Filtrar e salvar filtros", "duracao": "44 s", "resumo": "Limpar tudo, adicionar um filtro, ver o efeito e salvar como padrão, nas telas reais do Horus.", "arquivo": "videos/filtrar-e-salvar-filtros.mp4"}]}, {"id": "visao-pessoal", "titulo": "Criar e salvar uma visualização pessoal", "resumo": "Guarde seus filtros preferidos numa visão salva, ou monte sua própria aba de dashboard. E, para que um tipo de operação conte como venda, marque-o no ERP.", "icone": "bookmark", "blocos": [{"titulo": "Salvar os seus filtros (filtro padrão)", "tipo": "passos", "itens": ["Deixe o app com os filtros que você quer (ex.: o seu grupo de produto, o ano atual).", "Clique na estrela (Favoritos), no canto superior direito.", "Clique em Salvar filtros atuais e digite um nome.", "Marque Abrir o dashboard com estes filtros para o app já abrir assim, e clique em Salvar.", "Você pode salvar vários filtros, mas só um abre o dashboard como padrão. Para usar outro, abra a estrela e escolha."]}, {"titulo": "Criar seu próprio dashboard", "tipo": "passos", "itens": ["No app publicado, clique no + na barra de abas de dashboards.", "Escolha Criar do Zero ou Clonar Existente, dê um nome e clique em Criar.", "Clique em Editar (lápis), adicione os gráficos com as colunas e expressões do app e clique em Salvar.", "Clique direito na aba para Renomear, Compartilhar ou Excluir.", "Se o + não aparecer, peça ao administrador para liberar dashboards pessoais (HEC > Tenants > Avançado)."]}, {"titulo": "Filtros padrão: o que muda e o que não muda", "tipo": "lista", "itens": ["Os filtros de inicialização (Data e Participa Indicadores) vêm com valor e voltam toda vez que o app abre. Sua visão salva como padrão abre por cima deles.", "Participa Indicadores = Participa não é decidido no BI. Ele vem da caixa Participa Relat. Gerenc. no cadastro do tipo de operação de saída no ERP.", "Para um tipo de operação passar a contar em faturamento, vendas e metas, marque-o no ERP. Veja o passo a passo no vídeo do topo da página.", "A mudança chega ao BI na próxima atualização contínua, em até 30 minutos (das 07:00 às 19:00)."]}, {"titulo": "Marcar um tipo de operação como Participa", "tipo": "passos", "itens": ["No ERP, abra Cadastros Gerais > Tipo de Operação de Saída e clique no tipo na lista.", "Clique na sub-aba COMERCIAL.", "Marque Participa Relat. Gerenc.", "Clique em CONFIRMAR."]}], "fontes": ["https://docs.horusbi.com.br/dataviz/02-apps", "https://docs.horusbi.com.br/dataviz/04-features/personal-dashboards", "https://docs.horusbi.com.br/dataviz/02-apps/general"], "videos": [{"url": "https://claude.ai/artifact/VARnvPeVmNRQS1Wt84UALG", "titulo": "Participa Indicadores no ERP", "duracao": "30 s", "resumo": "Tipo de operação, sub-aba Comercial, Participa Relat. Gerenc. e Confirmar, nas telas reais do ERP.", "arquivo": "videos/participa-indicadores-no-erp.mp4"}, {"url": "https://claude.ai/artifact/WbcgZV9SFdfRjhU7rgAAWr", "titulo": "Filtrar e salvar filtros", "duracao": "44 s", "resumo": "Limpar tudo, adicionar um filtro, ver o efeito e salvar como padrão, nas telas reais do Horus.", "arquivo": "videos/filtrar-e-salvar-filtros.mp4"}]}, {"id": "lumia", "titulo": "Perguntar à Lumia sobre as métricas da empresa", "resumo": "A Lumia responde em português consultando os dados reais. Quanto mais precisa a pergunta, mais certa a resposta.", "icone": "chat", "blocos": [{"titulo": "Onde fica", "tipo": "lista", "itens": ["Na home ou em qualquer tela, clique na estrela do menu lateral (Lumia). O chat abre à direita, com sugestões de perguntas.", "Na janela flutuante, para perguntas rápidas, inclusive enquanto você navega num dashboard.", "Pelo WhatsApp, conforme o seu plano. O Bacco está no Ultra, que inclui a Lumia no WhatsApp."]}, {"titulo": "Como perguntar", "tipo": "passos", "itens": ["Escolha o modo, abaixo do campo de mensagem: Rápido para perguntas diretas; Aprofundado para análises de causa (mais lento e consome mais IA).", "Diga a métrica: valor líquido, valor bruto, quantidade, ticket médio, margem.", "Diga o objeto e a situação: pedidos faturados, notas finalizadas, títulos vencidos.", "Diga qual data vale: emissão, vencimento, pagamento.", "Diga o período e o recorte: esse mês, março de 2026, por representante.", "Continue na mesma conversa (\"e no mês passado?\"): a Lumia lembra o contexto. Para outro assunto, use Nova Conversa."]}, {"titulo": "Exemplos", "tipo": "comparar", "itens": [["Como estão as vendas esse mês?", "Qual o valor líquido de pedidos faturados emitidos esse mês?"], ["Quanto falta receber?", "Qual o saldo em aberto de títulos a receber com vencimento até o fim deste mês?"], ["Os clientes estão comprando?", "Quantos clientes distintos tiveram nota finalizada em outubro de 2026, por representante?"], ["Como está a margem?", "Qual a margem de contribuição em % sobre a ROL no mês atual, por grupo de produto?"]]}, {"titulo": "Boas práticas", "tipo": "lista", "itens": ["Cite o app quando o termo existe em mais de um (ex.: \"no app Vendas\" ou \"no app Faturamento\").", "Pode usar nomes aproximados de cliente ou produto: a Lumia procura o nome certo.", "Para ver a lista linha a linha, use o Explorer. A Lumia entrega a resposta e o porquê.", "Antes de uma decisão importante, confira o número no painel. O rodapé do chat avisa que a IA pode errar a interpretação."]}], "fontes": ["https://docs.horusbi.com.br/ia/chat", "https://docs.horusbi.com.br/ia/chat/como-funciona", "https://docs.horusbi.com.br/dataviz/04-features/indicadores"], "videos": [{"url": "https://claude.ai/artifact/9jWkgw5wjRhDcVi9Xk1zJp", "titulo": "Perguntar à Lumia", "duracao": "34 s", "resumo": "Da estrela no menu até a pergunta enviada, e como montar uma pergunta precisa.", "arquivo": "videos/perguntar-a-lumia.mp4"}]}]}</script>
