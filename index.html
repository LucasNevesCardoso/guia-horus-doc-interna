<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia dos Painéis Bacco</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Central Horus BI. Layout de documentação técnica: listas com divisórias e tabelas, sem cards,
   cantos suaves (8px), laranja só para ação e estado. IBM Plex Sans + Plex Mono para números e fórmulas. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --soft: #f7f7f7;
  --fg: #2f2f2f;
  --text: #4a4a4a;
  --muted: #5f5f5f;
  --line: #e6e6e6;
  --line-2: #d4d4d4;
  --brand: #f97316;
  --brand-hot: #ff5a2c;
  --brand-strong: #c2410c;
  --brand-tint: #fff7ed;
  --ink: #000000;
  --link: #c2410c;
  --ok: #15803d;
  --ok-tint: #f0fdf4;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 8px;
  --r-sm: 6px;
  --shadow: none;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161616; --surface: #1e1e1e; --soft: #232323; --fg: #f2f2f2; --text: #d6d6d6; --muted: #a8a8a8; --line: #333333; --line-2: #444444;
    --brand-strong: #fb923c; --brand-tint: rgba(249, 115, 22, .12); --link: #fb923c; --ok: #4ade80; --ok-tint: rgba(74, 222, 128, .1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161616; --surface: #1e1e1e; --soft: #232323; --fg: #f2f2f2; --text: #d6d6d6; --muted: #a8a8a8; --line: #333333; --line-2: #444444;
  --brand-strong: #fb923c; --brand-tint: rgba(249, 115, 22, .12); --link: #fb923c; --ok: #4ade80; --ok-tint: rgba(74, 222, 128, .1); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; touch-action: manipulation; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { color: var(--fg); margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--fg); color: var(--bg); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 16px; }
.num, .tab { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 12.5px; font-weight: 500; color: var(--muted); }

/* ---------- topo ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 56px; }
.logo { display: flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 600; font-size: 15px; white-space: nowrap; }
.logo:hover { text-decoration: none; }
.logo svg { color: var(--brand); flex: none; }
.logo small { font-weight: 400; color: var(--muted); font-size: 14px; padding-left: 8px; border-left: 1px solid var(--line); }
.menu { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
.menu::-webkit-scrollbar { display: none; }
.menu a { display: flex; align-items: center; color: var(--muted); padding: 0 12px; font-size: 14px; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
.menu a:hover { color: var(--fg); text-decoration: none; }
.menu a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--brand); }
.search { position: relative; margin-left: auto; width: 280px; flex: none; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); color: var(--fg); font: 400 14px var(--font); padding: 0 10px 0 34px; transition: border-color .15s; }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--brand); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.pill { border: 1px solid var(--line-2); background: var(--bg); border-radius: var(--r); padding: 0 10px; min-height: 32px; font-size: 13.5px; font-weight: 500; color: var(--text); transition: border-color .15s, color .15s; }
.pill:hover { border-color: var(--fg); color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.sugest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* ---------- linha de estado (início) ---------- */
.state { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13.5px; color: var(--muted); padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.state b { color: var(--fg); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.state b i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.state.off b i { background: var(--muted); }

/* ---------- blocos ---------- */
main { padding-block: 32px 64px; }
.block + .block { margin-top: 48px; }
.page-top { margin-bottom: 24px; }
.page-top .lead { color: var(--muted); margin-top: 4px; }
.more { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); }
.more a { display: grid; gap: 2px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; transition: border-color .15s, background .15s; }
.more a:hover { border-color: var(--brand); background: var(--brand-tint); }
.more b { color: var(--fg); font-weight: 600; font-size: 15px; }
.more span { color: var(--muted); font-size: 13.5px; }
@media (max-width: 760px) { .more { grid-template-columns: minmax(0, 1fr); } }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.block-head h2 { font-size: 17px; font-weight: 600; }
.block-head p { color: var(--muted); font-size: 13.5px; }
.block-head > a { font-size: 13.5px; font-weight: 500; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; margin-top: 32px; }

/* listas de linhas (substituem os cards) */
.rows { border-top: 1px solid var(--line-2); }
.row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--text); }
.row:hover { text-decoration: none; color: var(--fg); }
.row:hover .row-t { color: var(--brand-strong); }
.row svg { color: var(--muted); }
.row-t { color: var(--fg); font-weight: 500; font-size: 14.5px; }
.row-m { font-size: 12.5px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
.row.hot .row-t { color: var(--brand-strong); }
.row.hot svg { color: var(--brand); }

/* tabela de métricas */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.mtable { border-top: 1px solid var(--line-2); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr) minmax(0, 1.3fr) 130px; gap: 20px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.mrow.head { padding-block: 8px; }
.mrow .name { color: var(--fg); font-weight: 500; }
.mrow .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.formula { font: 400 12.5px/1.6 var(--mono); color: var(--fg); display: block; overflow-wrap: anywhere; }
.mrow .why { font-size: 13px; color: var(--muted); margin-top: 4px; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13.5px; }
.crumb span { color: var(--text); }
.crumb b { color: var(--fg); font-weight: 500; }
.crumb svg { color: var(--muted); flex: none; }
.freq { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
.freq i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex: none; }
.freq.f-meta i { background: var(--ok); }
.freq.f-diaria i { background: var(--muted); }

/* agenda */
.status { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 14px; padding: 12px 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.status.off .dot { background: var(--muted); }
.status strong { color: var(--fg); font-weight: 500; }
.status p { color: var(--muted); font-size: 13.5px; }
.status a { display: none; }
.day { padding: 16px 0; border-bottom: 1px solid var(--line); }
.day-scroll { overflow-x: auto; }
.day svg { display: block; min-width: 640px; width: 100%; height: auto; }
.day text { fill: var(--muted); font: 400 11px var(--mono); }
.day .lane-name { fill: var(--fg); font: 500 12px var(--font); }
.loads { display: grid; }
.load { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 200px) minmax(0, 1fr); gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.load h3 { font-size: 14px; font-weight: 500; display: flex; gap: 8px; align-items: center; }
.load h3 i { width: 8px; height: 8px; flex: none; }
.load .when { color: var(--fg); font-size: 13px; font-family: var(--mono); }
.load p { font-size: 13.5px; color: var(--muted); grid-column: 3; }
.load p + p { display: none; }
.note { margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--brand); color: var(--text); font-size: 13.5px; display: flex; gap: 8px; }
.note svg { display: none; }

/* plano: uma tabela */
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line-2); }
.tier { padding: 12px 16px 12px 0; display: grid; gap: 6px; align-content: start; border-bottom: 1px solid var(--line); }
.tier + .tier { padding-left: 16px; border-left: 1px solid var(--line); }
.tier.on { box-shadow: inset 0 2px 0 var(--brand); }
.tier .label { display: flex; gap: 8px; align-items: center; }
.tier .badge { color: var(--brand-strong); font-size: 12.5px; font-weight: 500; }
.tier h3 { font-size: 14.5px; font-weight: 600; }
.tier ul { margin: 0; padding-left: 16px; font-size: 13.5px; color: var(--muted); display: grid; gap: 2px; }

/* ---------- páginas internas ---------- */
.bread { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
.bread a { color: var(--muted); }
.bread a:hover { color: var(--fg); }
.app-title { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 40px; align-items: start; margin-bottom: 32px; }
.app-title h1, .page-h { font-size: clamp(24px, 3vw, 30px); font-weight: 600; letter-spacing: -.01em; }
.app-title .lead, .lead { margin-top: 8px; color: var(--muted); font-size: 15px; max-width: 64ch; }
.rules { border-left: 2px solid var(--line-2); padding-left: 16px; }
.rules h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.rules ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: 13.5px; }
.rules li::marker { color: var(--brand); }

.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; font-size: 13.5px; }
.toc .label { margin-bottom: 6px; }
.toc a { color: var(--muted); padding: 5px 0 5px 12px; border-left: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.toc a:hover { color: var(--fg); border-left-color: var(--brand); text-decoration: none; }
.toc a span { font-family: var(--mono); font-size: 12px; }

.sec { scroll-margin-top: 80px; }
.sec + .sec { margin-top: 40px; }
.sec > h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.sec > .sub { color: var(--muted); margin-bottom: 12px; font-size: 13.5px; max-width: 64ch; }

.acc { border-top: 1px solid var(--line-2); }
.item { border-bottom: 1px solid var(--line); }
.item > button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 0; display: grid; grid-template-columns: 20px minmax(0, 1fr) 16px; gap: 12px; align-items: center; min-height: 48px; }
.item > button:hover h3 { color: var(--brand-strong); }
.item .ti { color: var(--muted); display: grid; place-items: center; }
.item h3 { font-size: 14.5px; font-weight: 500; }
.item .one { font-size: 13.5px; color: var(--muted); display: block; }
.item .chev { color: var(--muted); transition: transform .15s; }
.item[data-open="true"] .chev { transform: rotate(180deg); }
.panel { padding: 0 0 16px 32px; display: grid; gap: 10px; font-size: 14px; }
.panel .k { display: block; margin-bottom: 2px; }
.panel ul { margin: 0; padding-left: 16px; display: grid; gap: 2px; }
.panel .tip { border-left: 2px solid var(--brand); padding-left: 12px; color: var(--fg); }
.tagtype { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); font-family: var(--mono); }

.steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.step h3 { font-size: 14.5px; margin-bottom: 8px; }
.step ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.step li::marker { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }

dl.gloss { margin: 0; border-top: 1px solid var(--line-2); }
dl.gloss div { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--line); }
dl.gloss dt { color: var(--fg); font-weight: 500; font-size: 14px; }
dl.gloss dd { margin: 0; color: var(--muted); font-size: 14px; }

.empty { padding: 40px 0; display: grid; gap: 12px; justify-items: center; text-align: center; border-top: 1px solid var(--line-2); }
.empty h2 { font-size: 17px; }
.empty p { color: var(--muted); }

.help { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.help h2 { font-size: 14px; font-weight: 500; }
.help p { color: var(--muted); }
.help .btn { background: transparent; color: var(--link); padding: 0; min-height: 0; font-weight: 500; }
.help .btn:hover { background: transparent; color: var(--link); text-decoration: underline; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--r); background: var(--fg); color: var(--bg); font-weight: 500; font-size: 14px; transition: background .15s; }
.btn:hover { background: var(--brand-strong); color: #fff; text-decoration: none; }
.btn.go { background: var(--brand); color: #000; }
.btn.go:hover { background: var(--brand-hot); color: #000; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
footer .wrap { padding-block: 16px; }

/* ---------- como fazer ---------- */
.callout { display: flex; gap: 10px; border-left: 2px solid var(--brand); padding: 2px 0 2px 12px; color: var(--fg); margin-bottom: 24px; font-size: 14px; }
.callout svg { display: none; }
.callout b { font-weight: 500; }
.callout p { color: var(--text); }
.tut-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tut-list li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.tut-list.num { counter-reset: n; }
.tut-list.num li { counter-increment: n; }
.tut-list.num li::before { content: counter(n); font: 500 13px/1.65 var(--mono); color: var(--brand-strong); }
.tut-list.dot li::before { content: "–"; color: var(--muted); text-align: center; }
.tut-card { border-top: 1px solid var(--line-2); padding-top: 12px; }
.cmp { display: grid; gap: 0; border-top: 1px solid var(--line-2); }
.cmp-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; border-bottom: 1px solid var(--line); }
.cmp-row > div { padding: 10px 0; font-size: 14px; display: flex; gap: 8px; align-items: start; }
.cmp-row .bad { color: var(--muted); }
.cmp-row .good { color: var(--fg); }
.cmp-row svg { flex: none; margin-top: 3px; }
.cmp-row .bad svg { color: #dc2626; }
.cmp-row .good svg { color: var(--ok); }
.cmp-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-bottom: 6px; }
.srcs { display: grid; gap: 4px; }
.srcs a { font: 400 12.5px var(--mono); overflow-wrap: anywhere; }
.next { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); }
.next a { display: grid; gap: 2px; max-width: 48%; font-weight: 500; }
.next small { color: var(--muted); font-size: 12px; font-weight: 400; }

.vcard { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; color: var(--text); border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); padding: 12px 0; margin-bottom: 24px; }
.vcard:hover { text-decoration: none; }
.vbox { margin: 0 0 28px; display: grid; gap: 10px; }
.vbox video { width: 100%; aspect-ratio: 16 / 9; background: #000; display: block; }
.vplay { width: 40px; height: 40px; background: var(--brand); color: #000; display: grid; place-items: center; }
.vtxt { display: grid; gap: 0; min-width: 0; }
.vtxt b { color: var(--fg); font-size: 15px; font-weight: 500; }
.vtxt > span:last-child { font-size: 13.5px; color: var(--muted); }
.vgo { display: inline-flex; align-items: center; gap: 6px; color: var(--link); font-weight: 500; white-space: nowrap; font-size: 14px; }
@media (max-width: 720px) { .vcard { grid-template-columns: 40px minmax(0, 1fr); } .vgo { grid-column: 2; } }

/* ---------- player dos motions ---------- */
.mv { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; margin-bottom: 32px; box-shadow: var(--shadow); }
.mv-scroll { overflow-x: auto; }
.mv-stage { position: relative; overflow: hidden; aspect-ratio: 16 / 9; background: var(--soft); min-width: 640px; }
.mv[data-motion="erp"] .mv-stage { aspect-ratio: 1830 / 770; background: #ffffff; }
.mv-cap { padding: 12px 16px 4px; color: var(--fg); font-size: 15.5px; font-weight: 500; min-height: 2.6em; }
.mv-ctl { display: flex; align-items: center; gap: 10px; padding: 8px 12px 12px; }
.mv-ctl button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--fg); flex: none; transition: border-color .2s, color .2s; }
.mv-ctl button:hover { border-color: var(--brand); color: var(--brand-strong); }
.mv-bar { flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; }
.mv-bar::before { content: ""; position: absolute; }
.mv-bar span { position: relative; display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.mv-bar i { position: absolute; inset: 0; background: var(--brand); transform-origin: left; transform: scaleX(0); }
.mv-shot { position: absolute; left: 0; top: 0; width: 100%; display: block; }
.mv-cursor { position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.mv-ripple { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fe5f21; z-index: 5; pointer-events: none; }
.mv-ring { position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 3px #fe5f21, 0 0 0 9px rgba(254,95,33,.25); z-index: 4; }
.mv-row { position: absolute; background: rgba(254,95,33,.16); outline: 2px solid #fe5f21; z-index: 3; }
.mv-toast { position: absolute; right: 3%; bottom: 7%; max-width: 46%; background: #1f1f1f; color: #fff; padding: 12px 16px; border-radius: 8px; border-left: 4px solid #fe5f21; font-size: clamp(11px, 1.3vw, 15px); line-height: 1.45; z-index: 7; }
.mv-toast b { color: #ffb08f; }
.mv-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mv-edge { fill: none; stroke: var(--brand); stroke-width: .3; stroke-linecap: round; }
.mv-diag { position: absolute; inset: 0; transform-origin: 50% 50%; }

s dos descontos.", "como_ler": "Compare com o faturamento líquido: a distância entre os dois mostra o quanto foi dado de desconto.", "perguntas": ["Quanto vendemos a preço cheio?", "Qual o tamanho dos descontos concedidos?"], "dica": "Se a diferença para o líquido crescer de um mês para o outro, investigue descontos por representante."}, {"titulo": "Bonificação", "tipo": "KPI", "mostra": "Valor líquido das notas marcadas como bonificação, entre as notas finalizadas.", "como_ler": "Mostra quanto saiu como bonificação. Valor crescente em relação ao faturamento pede atenção.", "perguntas": ["Quanto estamos bonificando?", "Quais produtos e clientes mais recebem bonificação?"], "dica": "Clique no cartão para abrir a lista por representante, cliente, data, produto e nota."}, {"titulo": "Total de Notas Emitidas", "tipo": "KPI", "mostra": "Quantidade de notas fiscais de venda finalizadas no período.", "como_ler": "Mede o volume de vendas em número de notas. Junto com o ticket médio, explica se o faturamento mudou por quantidade ou por valor.", "perguntas": ["Quantas notas emitimos?", "O volume de vendas subiu ou caiu?"], "dica": "Clique para ver as notas por cliente."}, {"titulo": "Total de Clientes Atendidos", "tipo": "KPI", "mostra": "Quantidade de clientes diferentes que compraram no período.", "como_ler": "Mais clientes significa carteira mais ampla. Se o faturamento sobe com o mesmo número de clientes, a venda está concentrada.", "perguntas": ["Quantos clientes compraram neste mês?", "Estamos vendendo para mais gente ou vendendo mais para os mesmos?"], "dica": "Clique para ver a lista de clientes por representante."}, {"titulo": "Ticket Médio", "tipo": "KPI", "mostra": "Valor líquido faturado dividido pela quantidade de notas do período.", "como_ler": "Mostra quanto vale cada nota, em média. Ticket em queda com mais notas indica pedidos menores.", "perguntas": ["Quanto cada venda rende em média?", "Os pedidos estão menores ou maiores?"], "dica": "Cruze com Total de Notas Emitidas para saber se o faturamento mudou por volume ou por valor."}, {"titulo": "Margem", "tipo": "Ranking", "mostra": "Ranking da margem em reais, da maior para a menor, com o percentual de margem ao lado. Você escolhe o agrupamento (cliente, segmento, UF, cidade, representante, rede ou produto) e o tipo de margem: com impostos ou sem impostos. Lista todos os itens do período.", "como_ler": "A barra laranja mostra o tamanho da margem em reais. Barra vermelha é margem negativa, ou seja, prejuízo na venda. O percentual é sobre o valor líquido.", "perguntas": ["Quem mais dá lucro?", "Quais clientes ou produtos vendem mas dão pouca margem ou prejuízo?", "A margem muda muito quando considero os impostos?"], "dica": "Clique em um item para filtrar o painel todo por ele. Use o ícone do Excel para exportar a lista."}, {"titulo": "Faturamento (ranking)", "tipo": "Ranking", "mostra": "Ranking do valor líquido faturado, do maior para o menor, por cliente, segmento, UF, cidade, representante, rede ou produto.", "como_ler": "Quanto mais longa a barra, maior a venda. Os primeiros colocados concentram o resultado; observe quanto os 3 primeiros pesam no total.", "perguntas": ["Quem mais compra de nós?", "Qual representante, região ou segmento mais vende?", "O faturamento está concentrado em poucos?"], "dica": "Clique em um item para filtrar o painel. Depois olhe os outros rankings para ver a margem e o ticket desse mesmo item."}, {"titulo": "Quantidade", "tipo": "Ranking", "mostra": "Ranking da quantidade vendida (unidades dos itens das notas), por cliente, segmento, UF, cidade, representante, rede ou produto.", "como_ler": "Mostra volume físico, não dinheiro. Um item pode vender muita quantidade e pouco valor.", "perguntas": ["Quais produtos saem em maior volume?", "Quem compra mais unidades?"], "dica": "Compare com o ranking de Faturamento: posição alta em quantidade e baixa em valor indica produto de preço baixo."}, {"titulo": "Ticket Médio (ranking)", "tipo": "Ranking", "mostra": "Ranking do ticket médio (valor líquido por nota), do maior para o menor, por cliente, segmento, UF, cidade, representante, rede ou produto.", "como_ler": "Quanto maior, mais cada nota rende para aquele item. Ticket alto com poucas notas e ticket baixo com muitas notas pedem leituras diferentes.", "perguntas": ["Quais clientes fazem pedidos maiores?", "Qual representante vende pedidos de maior valor?"], "dica": "Cruze com o ranking de Faturamento: cliente com bom faturamento e ticket baixo compra com frequência, em pedidos pequenos."}, {"titulo": "Faturamento Mensal x Metas", "tipo": "Barras+Linha", "mostra": "Colunas mês a mês com o faturamento líquido de um ano (laranja) contra outro ano de comparação (preto), mais uma linha amarela com a meta. No topo, três comparativos: valor faturado contra o mesmo período do ano anterior, meta e atingimento contra o período anterior. Cartões de acompanhamento mostram o realizado contra a meta, resumido ou detalhado por responsável, representante ou grupo de produto.", "como_ler": "Coluna acima da linha amarela: meta batida. Atingimento verde é 100% ou mais. Abaixo disso aparece Perto da meta (80% a 99%) ou Abaixo da meta. Mês sem meta cadastrada aparece com meta zerada. Passe o mouse no mês para ver valores, variação entre os anos e atingimento.", "perguntas": ["Estamos batendo a meta?", "Este ano está melhor ou pior que o passado, mês a mês?", "Quais representantes ou grupos de produto estão abaixo da meta?"], "dica": "Escolha o agrupamento e pesquise um item para ver a meta dele. Clique na legenda Meta para esconder a linha. Abra o acompanhamento detalhado para achar quem puxa o resultado para baixo."}, {"titulo": "Performance de Vendas", "tipo": "Painel interativo", "mostra": "Gráfico de bolhas e lista de itens por segmento, produto, cliente, responsável ou representante. Horizontal: margem percentual. Vertical (escala logarítmica): faturamento. Tamanho da bolha: margem em reais. Mostra até 40 itens. Seletor entre margem com e sem impostos.", "como_ler": "Laranja: estrela (alto faturamento e alta margem). Preto: alto faturamento e margem baixa. Laranja claro: nicho rentável (vende pouco, margem boa). Cinza: baixa prioridade. Vermelho: prejuízo. A divisão entre alto e baixo é a mediana dos itens exibidos (linhas tracejadas).", "perguntas": ["Quais produtos ou clientes são estrelas?", "Onde vendemos muito mas ganhamos pouco?", "Quais itens dão prejuízo?"], "dica": "Clique em uma bolha para filtrar o painel. Na lista, clique em um item para ver a composição do lucro (bruto, líquido, CMV, impostos, comissão, frete e margens) e as notas dele. Use o ícone de interrogação para rever a regra de cálculo."}, {"titulo": "Mapa Faturamento", "tipo": "Mapa", "mostra": "Valor líquido faturado por estado e cidade do cliente, pintado em degradê de verde.", "como_ler": "Verde escuro: onde mais se vendeu. Verde claro: pouca venda. Cinza muito claro: sem venda no período.", "perguntas": ["Em quais regiões vendemos mais?", "Onde há cidades sem venda?"], "dica": "Compare o mapa com o ranking por UF ou cidade para decidir onde reforçar representantes."}, {"titulo": "Faturamento Item - CURVA ABC", "tipo": "Barras+Linha", "mostra": "Curva ABC dos produtos pelo valor bruto faturado (ou pela quantidade, no seletor). As colunas mostram os 15 maiores itens e a linha mostra o percentual acumulado. Abaixo vem o resumo de cada classe: quantos produtos e quanto pesam no total.", "como_ler": "Laranja é classe A (até 80% do faturamento), preto é classe B (de 80% a 95%) e cinza é classe C (o restante). Poucos produtos na classe A com grande peso é o normal; observe se a dependência de poucos itens é alta demais.", "perguntas": ["Quais produtos sustentam o faturamento?", "Quantos produtos fazem 80% das vendas?", "Quais itens têm pouco peso e podem ser revistos?"], "dica": "Clique em uma classe para ver só os produtos dela. Clique em uma coluna para filtrar o painel por aquele produto. A análise considera os 200 maiores itens."}, {"titulo": "Forecast", "tipo": "Previsão", "mostra": "Faturamento líquido dos últimos 12 meses (realizado, em laranja) e a previsão dos próximos 60 dias (em amarelo, marcada como previsto).", "como_ler": "A previsão continua a tendência do histórico. É uma estimativa, não uma meta: uma linha subindo indica tendência de crescimento, caindo indica queda.", "perguntas": ["Para onde caminha o faturamento nos próximos dois meses?", "A tendência recente é de alta ou de queda?"], "dica": "Use junto com o gráfico de metas: se a previsão ficar abaixo da meta, ainda há tempo de agir."}]}, {"nome": "Clientes", "objetivo": "Controlar o relacionamento com a carteira: quem compra no ritmo, quem está atrasado, quem foi perdido, quem é novo, e quais produtos cada comprador leva.", "widgets": [{"titulo": "Churn Cliente: resumo da carteira", "tipo": "KPI", "mostra": "Quatro números no topo da aba Relacionamento: clientes na carteira, taxa de recompra (clientes que compraram mais de uma vez), cadência típica (intervalo mediano entre compras, em dias, com o ticket médio por pedido) e próxima compra em jogo (valor de um ticket de cada cliente atrasado ou em risco, mais as recompras previstas para os próximos 30 dias).", "como_ler": "Taxa de recompra alta indica fidelidade. Cadência curta indica compra frequente. O valor em jogo é a venda que pode se perder se os clientes atrasados não forem contatados.", "perguntas": ["Quantos clientes temos e quantos voltam a comprar?", "De quanto em quanto tempo o cliente típico compra?", "Quanto dinheiro está em risco?"], "dica": "Os números seguem os filtros do topo (empresa, representante, período). A situação de cada cliente considera o histórico todo, contado até hoje."}, {"titulo": "Saúde do relacionamento", "tipo": "Painel interativo", "mostra": "Cinco cartões que agrupam os clientes pela situação, cada um com quantidade, percentual da carteira e quanto faturaram no recorte. Cada cliente é comparado com o próprio ritmo de compra.", "como_ler": "No ritmo (verde): comprou dentro da própria cadência. Atrasado (amarelo): passou da cadência, até 2 vezes o intervalo normal. Em risco (laranja): mais de 2 vezes o intervalo normal, até 180 dias. Compra única (azul): só uma compra, até 180 dias. Perdido (vermelho): mais de 180 dias sem comprar.", "perguntas": ["Quantos clientes estão saudáveis e quantos estão se afastando?", "Quanto faturamos com os clientes em risco?", "Estamos perdendo mais clientes do que ganhando?"], "dica": "Clique em um cartão para filtrar a carteira abaixo só com os clientes daquela situação."}, {"titulo": "Compradores por mês", "tipo": "Barras+Linha", "mostra": "Colunas empilhadas por mês com os clientes que compraram: recorrentes (laranja) e novos (azul, no mês da primeira compra). A linha preta mostra, em cada mês, quantos clientes hoje perdidos tiveram ali a última compra. Cobre até os últimos 24 meses.", "como_ler": "Colunas crescendo com mais azul indicam conquista de clientes. Linha preta subindo indica que estão saindo mais clientes. O número em cima da coluna é o total do mês.", "perguntas": ["Estamos trazendo clientes novos?", "A base de recorrentes está crescendo?", "Em que mês começamos a perder clientes?"], "dica": "Passe o mouse no mês para ver novos, recorrentes e perdidos. Se a linha preta subiu em um mês, investigue o que mudou naquele período."}, {"titulo": "Carteira de clientes", "tipo": "Tabela", "mostra": "Lista de clientes com cidade e UF, representante, responsável, data da primeira e da última nota (com dias sem comprar e valor da última), cadência e atraso, número de compras, ticket e faturamento. Tem busca por cliente, código, representante, responsável ou cidade, e páginas de 10 clientes.", "como_ler": "A barra de cadência vai até 3 vezes o intervalo normal. A marca preta é a cadência normal: barra antes da marca, cliente no ritmo; depois dela, atrasado. A cor da barra é a situação do cliente. A ordem padrão é por prioridade de contato (ticket do cliente multiplicado pelo atraso).", "perguntas": ["Quem eu preciso ligar primeiro?", "Qual cliente está há muito tempo sem comprar?", "Quais clientes de um representante estão em risco?"], "dica": "Filtre pelo cartão de situação, ordene por prioridade de contato ou maior faturamento e exporte para Excel para passar a lista à equipe."}, {"titulo": "Positivação de produtos", "tipo": "Painel interativo", "mostra": "Escolha um mês ou um dia no calendário. Para cada produto, mostra quantos dos clientes que compraram naquele período levaram o produto. No topo: compradores no período, produtos vendidos e penetração média.", "como_ler": "A barra mostra a penetração: percentual dos compradores que levaram o produto. Verde: 50% ou mais. Azul: de 20% a 50%. Âmbar: abaixo de 20%.", "perguntas": ["Quais produtos chegam a mais clientes?", "Qual produto vende bem mas só para poucos clientes?", "Quais produtos têm espaço para ampliar a venda?"], "dica": "Clique na barra de um produto para ver a lista de clientes que o compraram. Os filtros do topo continuam valendo."}]}, {"nome": "Formação De Preço", "objetivo": "Simular o preço de venda de um produto e conferir se a margem fecha, a partir do custo médio de estoque e das despesas que você informa.", "widgets": [{"titulo": "Formador de Preço e Simulador", "tipo": "Painel interativo", "mostra": "Você escolhe um produto na lista (com o custo médio das entradas de estoque) e digita preço de venda, quantidade, comissão, frete total, despesas adicionais, custo operacional e os percentuais de ICMS, PIS/COFINS e IPI. O simulador calcula o custo total por unidade, o lucro por unidade e total, a margem líquida e o markup. Todos os campos começam zerados.", "como_ler": "Lucro e margem positivos significam que o preço cobre custo, despesas e impostos informados. Margem negativa indica prejuízo naquele preço. Produto marcado como Sem Custo não tem entrada de estoque: o resultado dele não é confiável. Os impostos e despesas são estimativas digitadas por você.", "perguntas": ["Qual preço devo cobrar para ter uma margem desejada?", "Esta proposta de venda dá lucro?", "Quanto sobra por unidade e no pedido todo?"], "dica": "Teste vários preços para o mesmo produto até chegar na margem que a empresa precisa. Compare com a margem real do produto no gráfico Performance de Vendas."}]}], "roteiros": [{"titulo": "Por que o faturamento caiu este mês?", "passos": ["Veja o cartão Faturamento (Liq.) e o gráfico Faturamento Mensal x Metas para confirmar a queda contra o mesmo período do ano anterior e contra a meta.", "Olhe Total de Notas Emitidas e Ticket Médio: se as notas caíram, vendemos menos vezes; se o ticket caiu, os pedidos ficaram menores.", "No ranking de Faturamento, alterne entre Representante, Cliente e Produto para achar quem puxou a queda. Clique no item para filtrar o painel.", "No dashboard Clientes, confira em Saúde do relacionamento se há clientes importantes atrasados ou perdidos."]}, {"titulo": "Quais clientes e produtos dão lucro de verdade?", "passos": ["No gráfico Performance de Vendas, escolha Clientes e a margem com impostos.", "Procure as bolhas pretas (vendem muito, margem baixa) e as vermelhas (prejuízo).", "Clique em uma bolha para filtrar e abra o item na lista para ver onde o lucro se perde: desconto, imposto, frete, comissão ou custo.", "Troque para Produtos e repita. Confirme no ranking Margem se o percentual se mantém."]}, {"titulo": "Quem eu preciso contatar para não perder venda?", "passos": ["Abra o dashboard Clientes e veja os cartões de Saúde do relacionamento: Atrasado e Em risco.", "Clique em Em risco para filtrar a Carteira de clientes. Deixe a ordem em Prioridade de contato.", "Use a busca para separar por representante ou cidade e leve a lista à equipe (exportar para Excel).", "Acompanhe em Compradores por mês se a linha de clientes perdidos para de subir."]}, {"titulo": "Quais produtos merecem atenção e como definir o preço?", "passos": ["Na Curva ABC, veja quantos produtos formam a classe A e clique nela para ver quais são.", "Em Positivação de produtos (dashboard Clientes), confira se esses produtos chegam à maioria dos compradores.", "Para um produto com margem baixa em Performance de Vendas, abra o dashboard Formação De Preço, escolha o produto e teste preços até a margem fechar."]}]}, {"appId": 41136, "app": "Vendas", "resumo": "Acompanha os pedidos de venda do mês: quanto está em cada etapa (análise, carteira, expedição, faturado, cancelado), quem vende, o que vende e para onde. Também compara com metas e anos anteriores, classifica clientes e produtos em curva ABC e organiza as cargas de expedição. Usado por gestor comercial, vendas e logística.", "regras": ["Período padrão: mês atual (muda pelo filtro de Data no topo).", "Só entram operações que participam dos indicadores de venda; bonificações e similares ficam de fora.", "Pedidos válidos são os que não estão cancelados, agrupados nem não finalizados.", "Os rankings e o gráfico de produtos somam pedidos em carteira, análise comercial, expedição e faturados; análise financeira e cancelados ficam de fora deles.", "O pódio da aba Apresentação considera só pedidos faturados.", "O valor usado é o valor líquido dos itens do pedido.", "Os gráficos de meta mostram o ano inteiro, ignorando o filtro de data do topo, mas respeitam os demais filtros.", "Metas vêm do cadastro Meta de Vendas por Agrupamento (menu Cadastros)."], "glossario": [{"termo": "Valor líquido", "significado": "Valor dos itens do pedido já descontados os descontos."}, {"termo": "Carteira", "significado": "Pedidos aceitos que ainda não foram faturados."}, {"termo": "Expedição", "significado": "Pedidos separados, aguardando saída."}, {"termo": "Faturado", "significado": "Pedido que já virou nota fiscal."}, {"termo": "Análise Financeira / Comercial", "significado": "Pedido aguardando liberação de crédito ou aprovação comercial."}, {"termo": "Ticket médio", "significado": "Valor médio de cada pedido."}, {"termo": "Atingimento", "significado": "Quanto da meta foi vendido, em percentual."}, {"termo": "Orçado x Realizado", "significado": "Orçado é a meta cadastrada; realizado é o que foi vendido."}, {"termo": "Curva ABC", "significado": "Classificação que separa os itens que formam 80% do valor (A), os próximos 15% (B) e os 5% finais (C)."}, {"termo": "Carga / Romaneio", "significado": "Carga é a viagem de entrega com seus pedidos; romaneio é o relatório impresso para separação e expedição."}, {"termo": "Narrativa", "significado": "Nome ou descrição da rota da carga."}], "dashboards": [{"nome": "Controle de Pedido", "objetivo": "Acompanhar os pedidos do mês por etapa, ver quem, o quê e para onde se vende, e comparar com metas e com o ano anterior.", "widgets": [{"titulo": "Cartões de etapa do pedido: Faturados, Expedição, Carteira, Análise Financeira, Análise Comercial e Cancelado", "tipo": "KPI (seis cartões)", "mostra": "Seis cartões em linha, um por etapa do pedido. Cada um mostra o valor em reais dos pedidos naquela etapa e, ao lado (Qtd), quantos pedidos são. Faturados: já viraram nota. Expedição: separados, aguardando saída. Carteira: aceitos, ainda não faturados. Análise Financeira: aguardando liberação de crédito. Análise Comercial: aguardando aprovação comercial. Cancelado: pedidos cancelados. Período: o filtro do topo (padrão, mês atual). Faturados e Cancelado mostram também a comparação com o mês anterior.", "como_ler": "Leia da esquerda para a direita como um funil: o pedido entra em análise, vai para carteira, expedição e é faturado. Valor parado em análise ou expedição ainda não é faturamento. Em Cancelado, quanto menor, melhor.", "perguntas": ["Quanto já foi faturado neste mês e quantos pedidos?", "Quanto está parado esperando análise do financeiro ou do comercial?", "Quanto está na carteira, ou seja, venda ainda por faturar?", "Quanto perdemos em cancelamentos?"], "dica": "Clique em um cartão para abrir o detalhe dos pedidos (cliente, representante, código do pedido) e achar quem está travando a venda."}, {"titulo": "Pedidos Totais", "tipo": "KPI", "mostra": "Valor de todos os pedidos válidos do período: em análise comercial, análise financeira, carteira, expedição e faturados. Cancelados, agrupados e não finalizados não entram. Ao lado, a quantidade de pedidos válidos. Mostra a variação contra o mês anterior.", "como_ler": "A seta com percentual compara com o mês anterior: verde para cima, vermelho para baixo.", "perguntas": ["Quanto vendemos em pedidos neste mês?", "Estamos acima ou abaixo do mês passado?", "Quantos pedidos válidos temos?"], "dica": "Compare com os cartões de etapa para ver como o total se distribui entre faturado, carteira e análises."}, {"titulo": "Ticket Médio", "tipo": "KPI", "mostra": "Valor médio por pedido: valor dos pedidos dividido pela quantidade de pedidos (considera análise comercial, expedição, faturados e carteira). Mostra também quantos clientes diferentes compraram e a variação contra o mês anterior.", "como_ler": "Ticket subindo com menos pedidos indica vendas maiores. Ticket caindo com mais pedidos indica muitos pedidos pequenos.", "perguntas": ["Qual o valor médio de cada pedido?", "Quantos clientes compraram no período?", "O ticket subiu ou caiu em relação ao mês passado?"], "dica": "Clique para ver os clientes e seus tickets."}, {"titulo": "Valor Total Itens e Qtd. com Desconto", "tipo": "KPI", "mostra": "Soma dos descontos concedidos nos itens dos pedidos e a quantidade de pedidos envolvidos, com variação contra o mês anterior.", "como_ler": "Valor ou variação crescente indica que está sendo dado mais desconto nas vendas.", "perguntas": ["Quanto estamos dando de desconto?", "O desconto aumentou em relação ao mês passado?"], "dica": "Cruze com o Ranking de Representantes e com o Ticket Médio para ver se o desconto está trazendo mais volume."}, {"titulo": "Ranking Representantes", "tipo": "Barras (ranking)", "mostra": "Valor vendido por representante, do maior para o menor, mostrando até 15. Considera pedidos em carteira, análise comercial, expedição e faturados (fora análise financeira e cancelados), no período do filtro do topo.", "como_ler": "Barra maior = representante que mais vendeu. O valor aparece na ponta da barra.", "perguntas": ["Quem são os representantes que mais vendem?", "Há concentração da venda em poucos representantes?"], "dica": "Compare com o Ranking Responsáveis para ver se a venda depende de poucas pessoas."}, {"titulo": "Ranking Responsáveis", "tipo": "Barras (ranking)", "mostra": "Valor vendido por responsável pelo pedido, do maior para o menor, até 15, com a mesma regra de pedidos do ranking de representantes.", "como_ler": "Barra maior = responsável com mais venda no período.", "perguntas": ["Qual responsável mais vende?", "Como se distribui a venda entre a equipe?"], "dica": "Use junto com o pódio de Responsáveis da aba Apresentação, que mostra só pedidos faturados."}, {"titulo": "Ranking Clientes", "tipo": "Barras (ranking)", "mostra": "Valor vendido por cliente, do maior para o menor, até 15, com a mesma regra de pedidos dos rankings anteriores.", "como_ler": "Barra maior = cliente que mais comprou no período.", "perguntas": ["Quais clientes mais compram?", "Quanto da venda depende dos maiores clientes?"], "dica": "Para uma visão completa e classificada em A, B e C, abra a aba Curva ABC."}, {"titulo": "Ranking Grupo Produto", "tipo": "Barras (ranking)", "mostra": "Valor vendido por grupo de produto, do maior para o menor, com a mesma regra de pedidos.", "como_ler": "Barra maior = grupo que mais vende. Mostra onde está o peso da venda por linha de produto.", "perguntas": ["Quais grupos de produto mais vendem?", "Estamos dependentes de um grupo só?"], "dica": "Cruze com o gráfico de produtos logo abaixo para ver quais itens puxam cada grupo."}, {"titulo": "Valor e Quantidade de Produtos Vendidos", "tipo": "Barras (ranking)", "mostra": "Os 15 produtos que mais venderam em valor. Cada produto tem uma barra para o valor vendido e outra para a quantidade. Mesma regra de pedidos dos rankings (carteira, análise comercial, expedição e faturados).", "como_ler": "Produto com barra de valor alta e quantidade baixa é item de preço alto; o contrário é item de volume e preço baixo.", "perguntas": ["Quais produtos mais vendem em valor?", "Qual produto sai em maior quantidade?", "Há produto caro com pouco volume ou barato com muito volume?"], "dica": "Passe o mouse para ver os números exatos de cada produto."}, {"titulo": "Vendas Mensal x Metas", "tipo": "Painel interativo (barras + linha de meta)", "mostra": "Gráfico por mês (janeiro a dezembro) com as vendas do ano escolhido (barras laranja) contra o ano de comparação (barras escuras) e a linha amarela da meta do cadastro de metas. Soma pedidos válidos (sem cancelados, agrupados e não finalizados). No cabeçalho há três comparativos, com anterior e atual lado a lado: Valor vendido (contra o mesmo período do ano anterior), Meta (contra o período imediatamente anterior) e Atingimento, que é o valor vendido dividido pela meta (em pontos percentuais, contra o período anterior). Abaixo há o Acompanhamento, que abre no modo Resumido (uma barra com o realizado contra o orçado total) ou Detalhado (um cartão por responsável, representante ou grupo de produto, com orçado, realizado e percentual). Embaixo, seletores de ano, de agrupamento e uma busca por item.", "como_ler": "Barra acima da linha amarela = meta batida no mês. No cabeçalho, verde indica melhora e vermelho piora. No acompanhamento: 100% ou mais é meta batida (verde), de 80% a 100% perto da meta, abaixo de 80% fica abaixo da meta. Mês sem meta cadastrada aparece com a meta zerada, e um texto avisa. Ao passar o mouse nas barras, o balão mostra os valores, a variação entre os anos e o atingimento do mês.", "perguntas": ["Estamos atingindo a meta mês a mês?", "Estamos vendendo mais ou menos que no ano passado?", "Quem está acima ou abaixo da meta: responsável, representante ou grupo de produto?", "Qual item puxa o resultado para baixo?"], "dica": "Clique em um cartão do modo Detalhado para filtrar o painel inteiro por aquele item, e clique de novo para tirar o filtro. Clique em Meta na legenda para esconder ou mostrar a linha. O gráfico mostra o ano todo, mesmo que o filtro de data do topo esteja em um mês só. As metas ficam no menu Cadastros."}, {"titulo": "Faturamento x Vendas (Valor Líq.)", "tipo": "Barras empilhadas", "mostra": "Por mês, compara o valor faturado em notas fiscais finalizadas com o valor dos pedidos de venda (carteira, análise comercial, expedição e faturados). As duas séries ficam lado a lado em cada mês.", "como_ler": "Se o valor de pedidos é maior que o faturado, há venda ainda a faturar. Se o faturado se aproxima ou passa dos pedidos, a carteira anterior está sendo entregue.", "perguntas": ["O que vendemos em pedidos está virando nota?", "Em quais meses a diferença entre pedido e faturamento é maior?"], "dica": "Use com os cartões Carteira e Expedição para entender o que ainda falta faturar."}, {"titulo": "Vendas por dia", "tipo": "Calendário de calor", "mostra": "Calendário com o valor vendido em cada dia (pedidos válidos, sem cancelados, agrupados e não finalizados). Mostra também quantos pedidos foram feitos no dia.", "como_ler": "Quanto mais intenso o tom do dia, maior o valor vendido. Dias claros ou vazios indicam pouca ou nenhuma venda.", "perguntas": ["Em quais dias vendemos mais?", "Há dias da semana ou do mês fracos?", "Teve algum dia sem venda?"], "dica": "Passe o mouse no dia para ver o valor e a quantidade de pedidos."}, {"titulo": "Vendas por UF", "tipo": "Pizza", "mostra": "Participação de cada estado (UF) do cliente no valor vendido, considerando pedidos em análise comercial, expedição, faturados e carteira. Mostra o percentual e o valor de cada fatia.", "como_ler": "Fatia maior = estado com mais venda. Cada estado tem uma cor fixa, do tom claro ao escuro.", "perguntas": ["De quais estados vem a venda?", "Dependemos muito de um estado só?"], "dica": "Cruze com o Ranking Clientes para ver quais clientes formam os maiores estados."}]}, {"nome": "Curva ABC", "objetivo": "Descobrir quais produtos, clientes ou redes concentram a maior parte do valor dos pedidos.", "widgets": [{"titulo": "Curva ABC de Pedidos de Venda", "tipo": "Tabela interativa (Curva ABC)", "mostra": "Lista de produtos, clientes ou redes de clientes ordenada do maior valor de pedido para o menor, com quantidade, peso líquido, valor médio por quilo, valor do pedido, participação no total e a classe A, B ou C. A classe vem da soma acumulada: A são os itens que formam até 80% do valor, B os seguintes até 95%, C o restante. Há uma linha de totais no rodapé.", "como_ler": "Curva A (verde) é o que mais pesa nas vendas: poucos itens com grande parte do valor. Curva B (amarelo) é intermediária. Curva C (cinza) tem muitos itens com pouco valor cada. A coluna de participação mostra o peso de cada item no total.", "perguntas": ["Quais produtos ou clientes concentram 80% das vendas?", "Quantos itens estão em cada curva?", "Qual rede de clientes mais compra (agrupando as lojas)?", "Quais itens vendem pouco e podem ser revistos?"], "dica": "Troque entre Produto, Cliente e Rede de Cliente nos botões do topo. Clique em Curva A, B ou C para filtrar só aquela classe, e clique de novo para voltar. Os botões Excel e PDF exportam a lista. Respeita os filtros do topo."}]}, {"nome": "Formação de Carga", "objetivo": "Consultar as cargas de expedição, seus pedidos e itens, e imprimir o romaneio.", "widgets": [{"titulo": "Gestão de Cargas", "tipo": "Painel interativo (lista de cargas com romaneio)", "mostra": "Lista de cargas de expedição (viagens), com número da carga, empresa, data de emissão, narrativa (a rota), destino em cidade e UF, responsável e situação (Aberto, Finalizado ou Cancelado). Cada carga abre para mostrar seus pedidos e, em cada pedido, os produtos e quantidades. Acima da lista há filtros por data de emissão, situação, empresa e responsável, e uma busca por número ou narrativa.", "como_ler": "A situação aparece em etiqueta: verde para Finalizado, vermelho para Cancelado e cinza para Aberto. O botão + de cada linha abre os pedidos da carga, e o + do pedido abre seus itens.", "perguntas": ["Quais cargas estão abertas e para onde vão?", "Quais pedidos e produtos compõem cada carga?", "Quem é o responsável por cada viagem?"], "dica": "Marque as cargas desejadas e clique em Imprimir Romaneio: o relatório agrupa por rota (narrativa), lista os pedidos com cliente, bairro, cidade e cobrança, e traz o resumo consolidado de itens para a separação."}]}, {"nome": "Apresentação", "objetivo": "Tela para telão: pódio dos melhores representantes, clientes e responsáveis e o comparativo de vendas contra a meta.", "widgets": [{"titulo": "Ranking de Representantes", "tipo": "Ranking (pódio)", "mostra": "Pódio com os três maiores representantes, seguido da lista do 4º ao 15º lugar. O restante é somado em uma linha chamada Demais. Valor em reais de pedidos faturados no período do filtro do topo.", "como_ler": "O pedestal 1 (centro, mais alto) é o primeiro lugar; 2 e 3 ficam nas laterais. O valor aparece em cada pedestal e ao lado de cada nome da lista. A linha Demais fecha o total do período.", "perguntas": ["Quem foi o destaque de faturamento do período?", "Como o faturamento se distribui entre os demais?"], "dica": "Clique em um nome do pódio ou da lista para filtrar todo o dashboard por ele."}, {"titulo": "Ranking de Clientes", "tipo": "Ranking (pódio)", "mostra": "Pódio com os três maiores clientes, seguido da lista do 4º ao 15º lugar. O restante é somado em uma linha chamada Demais. Valor em reais de pedidos faturados no período do filtro do topo.", "como_ler": "O pedestal 1 (centro, mais alto) é o primeiro lugar; 2 e 3 ficam nas laterais. O valor aparece em cada pedestal e ao lado de cada nome da lista. A linha Demais fecha o total do período.", "perguntas": ["Quem foi o destaque de faturamento do período?", "Como o faturamento se distribui entre os demais?"], "dica": "Clique em um nome do pódio ou da lista para filtrar todo o dashboard por ele."}, {"titulo": "Ranking de Responsáveis", "tipo": "Ranking (pódio)", "mostra": "Pódio com os três maiores responsáveis pelos pedidos, seguido da lista do 4º ao 15º lugar. O restante é somado em uma linha chamada Demais. Valor em reais de pedidos faturados no período do filtro do topo.", "como_ler": "O pedestal 1 (centro, mais alto) é o primeiro lugar; 2 e 3 ficam nas laterais. O valor aparece em cada pedestal e ao lado de cada nome da lista. A linha Demais fecha o total do período.", "perguntas": ["Quem foi o destaque de faturamento do período?", "Como o faturamento se distribui entre os demais?"], "dica": "Clique em um nome do pódio ou da lista para filtrar todo o dashboard por ele."}, {"titulo": "Vendas Faturadas x Meta", "tipo": "Painel interativo (barras + linha de meta)", "mostra": "Gráfico por mês com as vendas do ano principal (laranja) contra o ano de comparação, e a linha amarela da meta do cadastro de metas. Considera pedidos válidos (sem cancelados, agrupados e não finalizados). Abaixo ficam os seletores de ano, de agrupamento (Geral, Cliente, Produto, Grupo de Produto, Representante, Responsável) e uma busca por item. O gráfico mostra o ano todo, mesmo com o filtro de data do topo em um mês.", "como_ler": "Barra acima da linha amarela = meta batida no mês. O balão ao passar o mouse mostra os valores e o atingimento, em verde (100% ou mais) ou vermelho (abaixo). Mês sem meta cadastrada aparece com a meta zerada. Meta por item existe para Responsável, Representante e Grupo de Produto; para Cliente e Produto não há meta por item.", "perguntas": ["Atingimos a meta em cada mês?", "Estamos acima do ano passado?", "Qual responsável, representante ou grupo está abaixo da meta?"], "dica": "Escolha o agrupamento e digite o nome para ver só aquele item. Para cadastrar ou alterar metas, use o menu Cadastros."}]}], "roteiros": [{"titulo": "Por que as vendas faturadas estão abaixo do esperado neste mês?", "passos": ["Veja o cartão Faturados e compare com o mês anterior.", "Olhe Carteira, Expedição e as duas análises: se há muito valor parado, o problema é andamento, não falta de venda.", "Clique no cartão da etapa travada e veja os clientes e pedidos.", "Confira Vendas Mensal x Metas para ver o atingimento contra a meta."]}, {"titulo": "Quem está puxando ou segurando o resultado de vendas?", "passos": ["Em Vendas Mensal x Metas, abra o Acompanhamento Detalhado e escolha Representante ou Responsável.", "Veja quem está abaixo de 80% da meta.", "Clique no cartão para filtrar o dashboard e conferir clientes e produtos daquele item nos rankings."]}, {"titulo": "Onde concentrar o esforço comercial?", "passos": ["Na aba Curva ABC, escolha Cliente e filtre Curva A.", "Troque para Produto e veja os itens A.", "Compare com Vendas por UF para ver as regiões que sustentam esses clientes."]}, {"titulo": "Estou vendendo mais com mais desconto?", "passos": ["Veja Valor Total Itens e Qtd. com Desconto e sua variação.", "Compare com Ticket Médio e Pedidos Totais.", "Se o desconto sobe sem aumento de pedidos ou de ticket, revise as condições praticadas, com ajuda do Ranking Representantes."]}, {"titulo": "Preparar a expedição do dia", "passos": ["Na aba Formação de Carga, filtre as cargas Abertas pela data.", "Abra cada carga para conferir pedidos e itens.", "Marque as cargas e clique em Imprimir Romaneio."]}]}, {"appId": 41623, "app": "Devoluções", "resumo": "Acompanha as devoluções de venda: quanto foi devolvido, de quem, em que produtos e em que períodos, e quanto isso pesa sobre o faturamento. Usado por gestão comercial, qualidade e financeiro para achar clientes, representantes e produtos com devolução fora do normal.", "regras": ["Devolução de venda é o item de nota de entrada que aponta para uma nota de venda. Ela é datada pela emissão da nota de venda original, igual ao relatório de Evolução de Faturamento com Devoluções do ERP.", "O período padrão é o ano atual. Mude o filtro de Data no topo para outro período.", "Só entram vendas finalizadas e de operações que participam de venda.", "Os valores são brutos, antes de descontos de impostos.", "Exceção: o Calendário de Devoluções usa a data em que a mercadoria voltou (entrada da devolução).", "Todos os gráficos respeitam os filtros do topo, e clicar num item dos rankings filtra o painel inteiro."], "glossario": [{"termo": "Devolução de venda", "significado": "Mercadoria que o cliente devolveu, registrada por nota de entrada ligada à nota de venda original."}, {"termo": "% Devolução", "significado": "Valor devolvido dividido pelo faturamento bruto do mesmo recorte."}, {"termo": "Faturamento − Devoluções", "significado": "Faturamento bruto menos o valor devolvido."}, {"termo": "Nota de venda original", "significado": "Nota em que o cliente comprou a mercadoria depois devolvida. A data dela define o mês da devolução."}, {"termo": "Valor bruto", "significado": "Valor do item antes de descontos de impostos."}, {"termo": "p.p. (ponto percentual)", "significado": "Diferença entre dois percentuais. De 2% para 3% são 1 p.p."}], "dashboards": [{"nome": "Devolução", "objetivo": "Mostrar quanto se devolve, quem devolve e como isso evolui, com o detalhe nota a nota quando precisar conferir.", "widgets": [{"titulo": "Devoluções (R$)", "tipo": "KPI", "mostra": "Valor bruto das mercadorias devolvidas por clientes no período do filtro. Cada devolução é datada pela emissão da nota de venda original, não pela data em que a mercadoria voltou.", "como_ler": "Quanto menor, melhor. Compare sempre com o faturamento ao lado.", "perguntas": ["Quanto foi devolvido no período?", "Quais representantes e clientes mais devolveram?"], "dica": "Clique no cartão para abrir o detalhe por representante e cliente."}, {"titulo": "Faturamento (Brut.)", "tipo": "KPI", "mostra": "Valor bruto das vendas do mesmo recorte (notas finalizadas e operações que participam de venda).", "como_ler": "É a base de comparação das devoluções: devolução só faz sentido olhada contra o que foi vendido.", "perguntas": ["Quanto vendi no período?"], "dica": ""}, {"titulo": "Faturamento − Devoluções", "tipo": "KPI", "mostra": "Faturamento bruto menos as devoluções de venda. É a coluna Diferença do relatório de faturamento com devoluções.", "como_ler": "É a venda que realmente ficou. Quanto mais perto do faturamento bruto, menos devolução.", "perguntas": ["Quanto da venda sobrou depois das devoluções?"], "dica": ""}, {"titulo": "% Devolução", "tipo": "KPI", "mostra": "Devoluções divididas pelo faturamento bruto do mesmo recorte.", "como_ler": "Quanto menor, melhor. Use para comparar clientes, representantes e períodos de tamanhos diferentes.", "perguntas": ["A devolução está alta em relação ao que vendo?", "Ela subiu ou caiu?"], "dica": ""}, {"titulo": "Notas Devolvidas", "tipo": "KPI", "mostra": "Quantidade de notas de devolução diferentes no período.", "como_ler": "Muitas notas com valor baixo indicam devoluções pequenas e frequentes; poucas notas com valor alto indicam casos pontuais.", "perguntas": ["Quantas notas de devolução recebi?"], "dica": ""}, {"titulo": "Clientes com Devolução", "tipo": "KPI", "mostra": "Quantidade de clientes diferentes que devolveram ao menos uma mercadoria no período.", "como_ler": "Compare com o total de clientes atendidos para saber se o problema é espalhado ou concentrado.", "perguntas": ["Quantos clientes devolveram?"], "dica": ""}, {"titulo": "Ranking Devoluções", "tipo": "Ranking", "mostra": "Ranking pelo valor devolvido (bruto). Mostra os 10 primeiros e permite agrupar por Cliente, Segmento Comercial, UF, Cidade, Representante, Responsável, Rede Cliente ou Produto. Só entra quem teve devolução.", "como_ler": "A barra laranja é proporcional ao maior valor da lista. A posição 1 é quem mais devolveu em dinheiro.", "perguntas": ["Quem concentra as devoluções em valor?", "Qual produto ou segmento mais volta?"], "dica": "Troque o agrupamento na caixa Agrupar por. Clique numa linha para filtrar todo o painel por aquele item. O ícone de Excel exporta o ranking."}, {"titulo": "Ranking % Devolução", "tipo": "Ranking", "mostra": "Ranking pelo percentual de devolução sobre o faturamento bruto, com o valor devolvido ao lado. Mostra os 10 primeiros e permite agrupar por Cliente, Segmento Comercial, UF, Cidade, Representante, Responsável, Rede Cliente ou Produto. Só entra quem teve devolução.", "como_ler": "Percentual alto com valor pequeno pode ser só pouca venda; olhe os dois números juntos.", "perguntas": ["Quem devolve mais proporcionalmente ao que compra?", "Há cliente ou representante fora do padrão?"], "dica": "Troque o agrupamento na caixa Agrupar por. Clique numa linha para filtrar todo o painel por aquele item. O ícone de Excel exporta o ranking."}, {"titulo": "Ranking Quantidade Devolvida", "tipo": "Ranking", "mostra": "Ranking pela quantidade de unidades devolvidas. Mostra os 10 primeiros e permite agrupar por Cliente, Segmento Comercial, UF, Cidade, Representante, Responsável, Rede Cliente ou Produto. Só entra quem teve devolução.", "como_ler": "Mostra volume físico, que pode ser diferente do valor: produtos baratos aparecem mais aqui do que no ranking em reais.", "perguntas": ["Quais produtos voltam em maior quantidade?", "Onde a devolução pesa na operação, mesmo com valor baixo?"], "dica": "Troque o agrupamento na caixa Agrupar por. Clique numa linha para filtrar todo o painel por aquele item. O ícone de Excel exporta o ranking."}, {"titulo": "Ranking Notas de Devolução", "tipo": "Ranking", "mostra": "Ranking pela quantidade de notas de devolução. Mostra os 10 primeiros e permite agrupar por Cliente, Segmento Comercial, UF, Cidade, Representante, Responsável, Rede Cliente ou Produto. Só entra quem teve devolução.", "como_ler": "Muitas notas para o mesmo item indicam devolução repetida.", "perguntas": ["Quem devolve com mais frequência?"], "dica": "Troque o agrupamento na caixa Agrupar por. Clique numa linha para filtrar todo o painel por aquele item. O ícone de Excel exporta o ranking."}, {"titulo": "Devoluções Mensais", "tipo": "Barras+Linha", "mostra": "Colunas com o valor devolvido em cada mês do período do filtro (laranja) lado a lado com o mesmo mês do ano anterior (cinza escuro, ou claro no tema escuro). A linha amarela é o percentual de devolução do período atual, lido no eixo da direita. No topo, três blocos comparam os dois períodos: Devoluções, Faturamento Bruto e % Devolução, cada um com a variação. O período atual é cortado em hoje, e o ano anterior usa as mesmas datas.", "como_ler": "Nos blocos do topo, o selo vermelho é ruim e o verde é bom: devolução ou percentual subindo fica vermelho; faturamento subindo fica verde. A variação do percentual é em pontos percentuais (p.p.). Passe o mouse num mês para ver os valores.", "perguntas": ["As devoluções estão maiores ou menores que no ano passado?", "Em que meses o percentual de devolução disparou?", "O aumento de devolução acompanha o aumento de vendas?"], "dica": "Se o filtro de Data do topo for o mês atual, o gráfico tem uma só coluna. Amplie o período para ver a evolução."}, {"titulo": "Calendário de Devoluções", "tipo": "Calendário de calor", "mostra": "Calendário do mês com o valor devolvido em cada dia. À esquerda, um painel laranja destaca o dia escolhido: valor devolvido, número de notas e de clientes. Atenção: aqui o dia é a data em que a mercadoria voltou (entrada da devolução), e não a emissão da venda original como nos demais gráficos.", "como_ler": "Quanto mais forte o laranja, maior o valor devolvido naquele dia em relação ao dia mais alto do mês. Dia sem cor não teve devolução. Passe o mouse num dia para ver valor, notas e clientes.", "perguntas": ["Em que dias as devoluções chegam?", "Há picos concentrados em poucos dias?", "O que voltou em um dia específico?"], "dica": "Clique num dia e depois em Ver auditoria para ver cliente, nota de devolução, nota de venda, produto, quantidade e valor. Use as setas para trocar de mês e o Excel para exportar. Como a data difere da dos outros gráficos, os totais podem não coincidir mês a mês."}, {"titulo": "Mapa Devoluções", "tipo": "Mapa", "mostra": "Mapa do Brasil com o valor devolvido por estado e cidade do cliente.", "como_ler": "Cores mais escuras de verde indicam mais devolução; cinza claro, nenhuma. Compare regiões com o volume de vendas delas.", "perguntas": ["Em quais regiões as devoluções se concentram?", "Há cidades com devolução fora do esperado?"], "dica": "Confirme no ranking agrupado por UF ou Cidade antes de agir."}, {"titulo": "Valor por UF", "tipo": "Pizza/Donut", "mostra": "Participação de cada estado no valor devolvido: os 5 maiores estados e o restante agrupado em Outros.", "como_ler": "Os rótulos mostram o percentual de cada fatia. Fatia grande é onde está a maior parte das devoluções.", "perguntas": ["Que estados respondem pela maior parte das devoluções?"], "dica": "Cruze com o Mapa Devoluções e com o Ranking Devoluções agrupado por UF."}, {"titulo": "Devolução acumulada no período", "tipo": "Linha", "mostra": "Área que soma, mês a mês, o valor devolvido ao longo do período do filtro.", "como_ler": "A linha só sobe. Quanto mais inclinada, mais devolução no mês. Trechos quase planos indicam meses calmos.", "perguntas": ["Quanto já devolvi no ano?", "Em que meses a devolução acelerou?"], "dica": "Compare a inclinação com a de Devoluções Mensais para localizar o mês do pico."}, {"titulo": "Valor por Representante", "tipo": "Pizza/Donut", "mostra": "Participação de cada representante no valor devolvido: os 3 maiores e o restante agrupado em Outros.", "como_ler": "Fatia grande indica concentração em poucos representantes. Lembre que quem vende mais tende a ter mais devolução em valor.", "perguntas": ["Que representantes concentram as devoluções?"], "dica": "Confira o percentual de cada representante no Ranking % Devolução agrupado por Representante."}, {"titulo": "Notas e clientes com devolução por mês", "tipo": "Linha", "mostra": "Duas linhas por mês: quantidade de notas de devolução (laranja) e de clientes com devolução (cinza), com o número escrito em cada ponto. Os meses seguem a emissão da nota de venda original.", "como_ler": "Se as duas linhas sobem juntas, a devolução está espalhada entre muitos clientes. Se só as notas sobem, poucos clientes estão devolvendo várias vezes.", "perguntas": ["O número de clientes devolvendo está crescendo?", "Há clientes que devolvem várias notas no mesmo mês?"], "dica": "Clique num mês para abrir a auditoria dele, item a item (cliente, nota de devolução, data da devolução, nota de venda, produto, quantidade e valor), com exportação para Excel."}]}], "roteiros": [{"titulo": "O percentual de devolução subiu. Quem está puxando?", "passos": ["Veja o cartão % Devolução e confirme a alta em Devoluções Mensais, comparando com o ano anterior.", "Abra o Ranking % Devolução e agrupe por Cliente, depois por Representante.", "Clique no nome que mais se destaca para filtrar o painel e ver o que mudou nos outros gráficos.", "Troque o ranking de Devoluções para Produto e veja o que mais volta."]}, {"titulo": "Onde as devoluções se concentram geograficamente?", "passos": ["Olhe o Mapa Devoluções e o gráfico Valor por UF.", "No Ranking Devoluções, agrupe por UF e depois por Cidade.", "Clique na UF principal e veja Clientes com Devolução e Notas Devolvidas."]}, {"titulo": "Conferir uma devolução nota a nota", "passos": ["Em Notas e clientes com devolução por mês, clique no mês desejado.", "Na auditoria, localize o cliente, a nota de devolução e a nota de venda original.", "Exporte para Excel se precisar enviar à área de qualidade ou ao representante."]}, {"titulo": "Em que dias as mercadorias voltam?", "passos": ["Abra o Calendário de Devoluções e navegue até o mês.", "Clique no dia mais forte e use Ver auditoria.", "Lembre que esse calendário usa a data de entrada da devolução, diferente do mês dos outros gráficos."]}]}, {"appId": 41139, "app": "Compras", "resumo": "Acompanha o que a empresa compra: valor comprado, fornecedores, produtos e operações, e como as compras se comparam ao faturamento e às vendas. Serve ao time de compras e ao financeiro para negociar, controlar a meta de compras e cobrar prazo de entrega.", "regras": ["O período padrão é o mês atual completo; mude no filtro de data do topo e todos os painéis acompanham.", "O app já traz alguns filtros fixos de configuração aplicados a todos os painéis do topo. Eles não aparecem como escolha para o usuário.", "Compras em reais usam o valor líquido dos itens das notas fiscais de entrada, salvo onde o título diz Bruto.", "Faturamento e vendas contam só notas de saída finalizadas e de operações que participam de venda.", "O custo das vendas (CMV) vem da movimentação de estoque das saídas de venda.", "Quando o painel compara com o mês anterior ou com o ano anterior, ele usa o mesmo período do filtro, deslocado para trás."], "glossario": [{"termo": "Compra líquida", "significado": "Valor dos itens comprados nas notas de entrada, já descontados os descontos da nota."}, {"termo": "Compra bruta", "significado": "Valor dos itens comprados antes dos descontos."}, {"termo": "% Participação (Compras ÷ Faturamento)", "significado": "Quanto as compras representam do faturamento. Quanto menor, mais folga de margem; a meta usada no painel Análise Mensal é 70%."}, {"termo": "CMV", "significado": "Custo das mercadorias vendidas: o custo, registrado no estoque, dos produtos que saíram em vendas."}, {"termo": "Lucro bruto", "significado": "Vendas líquidas menos o CMV."}, {"termo": "Markup", "significado": "Lucro bruto dividido pelo CMV. Mostra quanto se ganha por real de custo."}, {"termo": "Giro / Cobertura", "significado": "Quantidade vendida dividida pela quantidade comprada no período. Perto de 100% significa que quase tudo que entrou já saiu."}, {"termo": "Curva ABC", "significado": "Classificação dos produtos pelo valor vendido: A são os que somam os primeiros 70% das vendas, B os próximos 20%, C o restante."}, {"termo": "Custo médio", "significado": "Custo das entradas dividido pela quantidade das entradas de um produto, acumulado desde o início do histórico."}, {"termo": "Ordem de compra", "significado": "Pedido feito ao fornecedor, com situação: Aberta, Finalizada, Recebida, Recebida parcial ou Cancelada."}], "dashboards": [{"nome": "Nota Fiscal de Entrada", "objetivo": "Painel principal de compras: quanto foi comprado, de quem, de quais produtos e em que tipo de operação, com comparação ao faturamento e ao mês anterior, e acompanhamento do custo médio e da frequência de cada fornecedor.", "widgets": [{"titulo": "Cartões de compras: Compra (Líq), Fornecedores Ativos e Total NF Entrada", "tipo": "KPI", "mostra": "Três números do período: o valor líquido comprado, a quantidade de fornecedores com situação Ativo e a quantidade de notas fiscais de entrada.", "como_ler": "O valor comprado dividido pelas notas dá uma ideia do tamanho médio de cada compra. Mais notas com o mesmo valor indicam compras mais fracionadas.", "perguntas": ["Quanto comprei no período?", "Em quantas notas essa compra foi dividida?", "Quantos fornecedores ativos eu tenho?"], "dica": "Clique no cartão de Compra (Líq) para abrir o detalhe por data de entrada."}, {"titulo": "Cartões de vendas: Faturamento (Líquido), Fornecedores Inativos e Total NF Saída", "tipo": "KPI", "mostra": "O faturamento líquido do período (só notas finalizadas e operações de venda), a quantidade de fornecedores com situação Inativo e a quantidade de notas de saída.", "como_ler": "Compare o faturamento com a compra líquida do primeiro grupo de cartões para sentir o equilíbrio entre comprar e vender. Fornecedores inativos que ainda aparecem no cadastro podem indicar limpeza a fazer.", "perguntas": ["Quanto faturei no mesmo período em que comprei?", "Quantos fornecedores estão inativos?", "Quantas notas de venda emiti?"], "dica": "Olhe junto com o cartão de variação ao lado para ver se o faturamento acompanha as compras."}, {"titulo": "Variação compras", "tipo": "KPI", "mostra": "A compra líquida do período, com a variação em relação ao mês anterior (em %) e o percentual das compras sobre o faturamento.", "como_ler": "A variação usa seta e cor: verde para cima e vermelho para baixo, sem julgar se é bom para o negócio. Compra subindo mais que o faturamento faz a participação subir; confira com a meta de 70% da Análise Mensal.", "perguntas": ["As compras subiram ou caíram em relação ao mês anterior?", "Quanto as compras pesam sobre o faturamento?"], "dica": "Se a participação subiu, vá para a Análise Mensal e veja em qual mês o desvio começou."}, {"titulo": "Nf Entrada Fornecedor", "tipo": "Barras", "mostra": "Valor bruto comprado por fornecedor no período, do maior para o menor, em barras deitadas. O gráfico tem opção de trocar o valor mostrado para a compra líquida.", "como_ler": "Barras longas indicam fornecedores que concentram suas compras. Poucos fornecedores dominando o gráfico significam dependência.", "perguntas": ["Quais fornecedores concentram mais compras?", "Estou dependente de poucos fornecedores?", "Com quem vale renegociar preço ou prazo?"], "dica": "Clique em um fornecedor para filtrar o painel inteiro e ver os produtos e operações dele nos outros gráficos."}, {"titulo": "Item Nota Fiscal", "tipo": "Barras", "mostra": "Valor bruto comprado por produto (código e descrição) no período, em barras deitadas, do maior para o menor. Dá para trocar para a compra líquida ou para agrupar por grupo de produto.", "como_ler": "Os produtos do topo são os que mais pesam no caixa de compras. Compare a posição deles com a das vendas no painel Compras x Vendas.", "perguntas": ["Quais produtos mais compro em valor?", "Qual grupo de produto pesa mais nas compras?"], "dica": "Clique em um produto para ver, no gráfico de fornecedores, de quem ele é comprado."}, {"titulo": "Valor por Tipo Operação Entrada", "tipo": "Barras", "mostra": "Valor bruto das notas de entrada por tipo de operação (compra, devolução, bonificação etc., conforme o cadastro), em barras deitadas. Também pode mostrar o líquido.", "como_ler": "Mostra de que natureza são as entradas. Se uma operação que não é compra pesa demais, o total de entradas pode estar inflado.", "perguntas": ["Que parte das entradas é compra de fato?", "Quais tipos de operação mais movimentam valor?"], "dica": "Clique em um tipo de operação para ver quais fornecedores e produtos estão nele."}, {"titulo": "Análise Mensal", "tipo": "Barras+Linha", "mostra": "Para cada mês, duas colunas (Faturamento bruto e Compras líquidas) e uma linha com a % Participação (compras divididas pelo faturamento), com uma linha tracejada na meta de 70%. Quatro cartões acima resumem faturamento, compras, participação e a meta, com a diferença em pontos percentuais e o valor de compras que ficaria na meta.", "como_ler": "Linha abaixo da meta tracejada: compras controladas. Linha acima: as compras estão pesando mais do que o planejado sobre as vendas. O cartão da meta mostra quantos pontos você está acima ou abaixo. Passe o mouse no mês para ver os valores completos.", "perguntas": ["Estou comprando mais do que o faturamento sustenta?", "Em quais meses a participação passou da meta?", "Quanto eu poderia ter comprado para ficar na meta?"], "dica": "Quando um mês passa da meta, use os gráficos de fornecedor e produto, com o filtro de data naquele mês, para achar quem puxou a compra."}, {"titulo": "Frequência e Histórico de Compras por Fornecedor", "tipo": "Tabela", "mostra": "Uma linha por fornecedor: data da última compra, valor da última compra, volume total no período e a frequência média, calculada como o intervalo médio, em dias, entre uma compra e a seguinte.", "como_ler": "Frequência de poucos dias indica fornecedor recorrente. Sem Recorrência significa que houve compra em um só dia no período. A lista vai do maior para o menor volume.", "perguntas": ["Com que frequência compro de cada fornecedor?", "Quando foi a última compra de cada um?", "Quais fornecedores só compram de forma esporádica?"], "dica": "Use a frequência para planejar pedidos: se um fornecedor vende a cada 15 dias e passou muito disso, confira se falta reposição."}, {"titulo": "Auditoria Histórica de Custo", "tipo": "Painel interativo", "mostra": "Busca por produto e, ao escolher um, um gráfico de linha da evolução do custo médio a cada dia de entrada, mais uma tabela com a data, o custo médio, a oscilação em reais e a oscilação em %. O primeiro ponto é o custo vigente no início do período.", "como_ler": "Linha subindo: o produto está entrando mais caro. Oscilações em % mostram o tamanho de cada reajuste. Só entram produtos que tiveram entrada de estoque (compra, inventário, ajuste ou produção).", "perguntas": ["O custo de um produto subiu quanto desde a última compra?", "Quando o fornecedor reajustou o preço?", "O custo médio é coerente com o preço que eu negociei?"], "dica": "Pesquise o produto, veja a variação e leve o número para a negociação com o fornecedor. Use o botão de voltar para pesquisar outro."}]}, {"nome": "Ordem Compra", "objetivo": "Acompanha os pedidos feitos aos fornecedores por situação e lista o prazo de entrega de cada ordem.", "widgets": [{"titulo": "Situação das ordens de compra: Em Aberto, Finalizado, Recebido, Recebido Parcial e Cancelado", "tipo": "KPI", "mostra": "Cinco cartões com a quantidade de ordens de compra em cada situação: Aberta, Finalizada, Recebida, Recebida Parcial e Cancelada.", "como_ler": "Muitas ordens em aberto ou parcialmente recebidas indicam entrega pendente. Cancelamentos altos pedem uma conversa sobre falha de pedido ou de fornecedor.", "perguntas": ["Quantas ordens ainda estão em aberto?", "Quantas foram recebidas só em parte?", "Quantas foram canceladas?"], "dica": "Use junto com a tabela abaixo para ver quais fornecedores concentram as ordens pendentes."}, {"titulo": "Res
