<title>Guia Horus BI Ultra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Central Horus BI. Layout de documentação técnica: listas com divisórias e tabelas, sem cards,
   cantos suaves (8px), laranja só para ação e estado. IBM Plex Sans + Plex Mono para números e fórmulas. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --soft: #f7f7f7;
  --fg: #2f2f2f;
  --text: #4a4a4a;
  --muted: #5f5f5f;
  --line: #e6e6e6;
  --line-2: #d4d4d4;
  --brand: #f97316;
  --brand-hot: #ff5a2c;
  --brand-strong: #c2410c;
  --brand-tint: #fff7ed;
  --ink: #000000;
  --link: #c2410c;
  --ok: #15803d;
  --ok-tint: #f0fdf4;
  --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r: 8px;
  --r-sm: 6px;
  --shadow: none;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161616; --surface: #1e1e1e; --soft: #232323; --fg: #f2f2f2; --text: #d6d6d6; --muted: #a8a8a8; --line: #333333; --line-2: #444444;
    --brand-strong: #fb923c; --brand-tint: rgba(249, 115, 22, .12); --link: #fb923c; --ok: #4ade80; --ok-tint: rgba(74, 222, 128, .1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161616; --surface: #1e1e1e; --soft: #232323; --fg: #f2f2f2; --text: #d6d6d6; --muted: #a8a8a8; --line: #333333; --line-2: #444444;
  --brand-strong: #fb923c; --brand-tint: rgba(249, 115, 22, .12); --link: #fb923c; --ok: #4ade80; --ok-tint: rgba(74, 222, 128, .1); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 400 15px/1.6 var(--font); -webkit-font-smoothing: antialiased; touch-action: manipulation; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { color: var(--fg); margin: 0; font-weight: 600; line-height: 1.25; }
p { margin: 0; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--fg); color: var(--bg); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 16px; }
.num, .tab { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 12.5px; font-weight: 500; color: var(--muted); }

/* ---------- topo ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; min-height: 56px; }
.logo { display: flex; align-items: center; gap: 8px; color: var(--fg); font-weight: 600; font-size: 15px; white-space: nowrap; }
.logo:hover { text-decoration: none; }
.logo svg { color: var(--brand); flex: none; }
.logo small { font-weight: 400; color: var(--muted); font-size: 14px; padding-left: 8px; border-left: 1px solid var(--line); }
.menu { display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; align-self: stretch; }
.menu::-webkit-scrollbar { display: none; }
.menu a { display: flex; align-items: center; color: var(--muted); padding: 0 12px; font-size: 14px; font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
.menu a:hover { color: var(--fg); text-decoration: none; }
.menu a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--brand); }
.search { position: relative; margin-left: auto; width: 280px; flex: none; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--bg); color: var(--fg); font: 400 14px var(--font); padding: 0 10px 0 34px; transition: border-color .15s; }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; border-color: var(--brand); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.pill { border: 1px solid var(--line-2); background: var(--bg); border-radius: var(--r); padding: 0 10px; min-height: 32px; font-size: 13.5px; font-weight: 500; color: var(--text); transition: border-color .15s, color .15s; }
.pill:hover { border-color: var(--fg); color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.sugest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* ---------- linha de estado (início) ---------- */
.state { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 13.5px; color: var(--muted); padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.state b { color: var(--fg); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.state b i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.state.off b i { background: var(--muted); }

/* ---------- blocos ---------- */
main { padding-block: 32px 64px; }
.block + .block { margin-top: 48px; }
.page-top { margin-bottom: 24px; }
.page-top .lead { color: var(--muted); margin-top: 4px; }
.more { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--line); }
.more a { display: grid; gap: 2px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; transition: border-color .15s, background .15s; }
.more a:hover { border-color: var(--brand); background: var(--brand-tint); }
.more b { color: var(--fg); font-weight: 600; font-size: 15px; }
.more span { color: var(--muted); font-size: 13.5px; }
@media (max-width: 760px) { .more { grid-template-columns: minmax(0, 1fr); } }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.block-head h2 { font-size: 17px; font-weight: 600; }
.block-head p { color: var(--muted); font-size: 13.5px; }
.block-head > a { font-size: 13.5px; font-weight: 500; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; margin-top: 32px; }

/* listas de linhas (substituem os cards) */
.rows { border-top: 1px solid var(--line-2); }
.row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--text); }
.row:hover { text-decoration: none; color: var(--fg); }
.row:hover .row-t { color: var(--brand-strong); }
.row svg { color: var(--muted); }
.row-t { color: var(--fg); font-weight: 500; font-size: 14.5px; }
.row-m { font-size: 12.5px; color: var(--muted); font-family: var(--mono); white-space: nowrap; }
.row.hot .row-t { color: var(--brand-strong); }
.row.hot svg { color: var(--brand); }

/* tabela de métricas */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.mtable { border-top: 1px solid var(--line-2); }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr) minmax(0, 1.3fr) 130px; gap: 20px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.mrow.head { padding-block: 8px; }
.mrow .name { color: var(--fg); font-weight: 500; }
.mrow .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.formula { font: 400 12.5px/1.6 var(--mono); color: var(--fg); display: block; overflow-wrap: anywhere; }
.mrow .why { font-size: 13px; color: var(--muted); margin-top: 4px; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 13.5px; }
.crumb span { color: var(--text); }
.crumb b { color: var(--fg); font-weight: 500; }
.crumb svg { color: var(--muted); flex: none; }
.freq { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
.freq i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); flex: none; }
.freq.f-meta i { background: var(--ok); }
.freq.f-diaria i { background: var(--muted); }

/* agenda */
.status { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 14px; padding: 12px 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.status.off .dot { background: var(--muted); }
.status strong { color: var(--fg); font-weight: 500; }
.status p { color: var(--muted); font-size: 13.5px; }
.status a { display: none; }
.day { padding: 16px 0; border-bottom: 1px solid var(--line); }
.day-scroll { overflow-x: auto; }
.day svg { display: block; min-width: 640px; width: 100%; height: auto; }
.day text { fill: var(--muted); font: 400 11px var(--mono); }
.day .lane-name { fill: var(--fg); font: 500 12px var(--font); }
.loads { display: grid; }
.load { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 200px) minmax(0, 1fr); gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.load h3 { font-size: 14px; font-weight: 500; display: flex; gap: 8px; align-items: center; }
.load h3 i { width: 8px; height: 8px; flex: none; }
.load .when { color: var(--fg); font-size: 13px; font-family: var(--mono); }
.load p { font-size: 13.5px; color: var(--muted); grid-column: 3; }
.load p + p { display: none; }
.note { margin-top: 12px; padding-left: 12px; border-left: 2px solid var(--brand); color: var(--text); font-size: 13.5px; display: flex; gap: 8px; }
.note svg { display: none; }

/* plano: uma tabela */
.tiers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line-2); }
.tier { padding: 12px 16px 12px 0; display: grid; gap: 6px; align-content: start; border-bottom: 1px solid var(--line); }
.tier + .tier { padding-left: 16px; border-left: 1px solid var(--line); }
.tier.on { box-shadow: inset 0 2px 0 var(--brand); }
.tier .label { display: flex; gap: 8px; align-items: center; }
.tier .badge { color: var(--brand-strong); font-size: 12.5px; font-weight: 500; }
.tier h3 { font-size: 14.5px; font-weight: 600; }
.tier ul { margin: 0; padding-left: 16px; font-size: 13.5px; color: var(--muted); display: grid; gap: 2px; }

/* ---------- páginas internas ---------- */
.bread { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
.bread a { color: var(--muted); }
.bread a:hover { color: var(--fg); }
.app-title { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 40px; align-items: start; margin-bottom: 32px; }
.app-title h1, .page-h { font-size: clamp(24px, 3vw, 30px); font-weight: 600; letter-spacing: -.01em; }
.app-title .lead, .lead { margin-top: 8px; color: var(--muted); font-size: 15px; max-width: 64ch; }
.rules { border-left: 2px solid var(--line-2); padding-left: 16px; }
.rules h2 { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
.rules ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: 13.5px; }
.rules li::marker { color: var(--brand); }

.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: grid; font-size: 13.5px; }
.toc .label { margin-bottom: 6px; }
.toc a { color: var(--muted); padding: 5px 0 5px 12px; border-left: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.toc a:hover { color: var(--fg); border-left-color: var(--brand); text-decoration: none; }
.toc a span { font-family: var(--mono); font-size: 12px; }

.sec { scroll-margin-top: 80px; }
.sec + .sec { margin-top: 40px; }
.sec > h2 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.sec > .sub { color: var(--muted); margin-bottom: 12px; font-size: 13.5px; max-width: 64ch; }

.acc { border-top: 1px solid var(--line-2); }
.item { border-bottom: 1px solid var(--line); }
.item > button { width: 100%; text-align: left; background: none; border: 0; padding: 10px 0; display: grid; grid-template-columns: 20px minmax(0, 1fr) 16px; gap: 12px; align-items: center; min-height: 48px; }
.item > button:hover h3 { color: var(--brand-strong); }
.item .ti { color: var(--muted); display: grid; place-items: center; }
.item h3 { font-size: 14.5px; font-weight: 500; }
.item .one { font-size: 13.5px; color: var(--muted); display: block; }
.item .chev { color: var(--muted); transition: transform .15s; }
.item[data-open="true"] .chev { transform: rotate(180deg); }
.panel { padding: 0 0 16px 32px; display: grid; gap: 10px; font-size: 14px; }
.panel .k { display: block; margin-bottom: 2px; }
.panel ul { margin: 0; padding-left: 16px; display: grid; gap: 2px; }
.panel .tip { border-left: 2px solid var(--brand); padding-left: 12px; color: var(--fg); }
.tagtype { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); font-family: var(--mono); }

.steps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; }
.step h3 { font-size: 14.5px; margin-bottom: 8px; }
.step ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.step li::marker { color: var(--muted); font-family: var(--mono); font-size: 12.5px; }

dl.gloss { margin: 0; border-top: 1px solid var(--line-2); }
dl.gloss div { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 20px; padding: 10px 0; border-bottom: 1px solid var(--line); }
dl.gloss dt { color: var(--fg); font-weight: 500; font-size: 14px; }
dl.gloss dd { margin: 0; color: var(--muted); font-size: 14px; }

.empty { padding: 40px 0; display: grid; gap: 12px; justify-items: center; text-align: center; border-top: 1px solid var(--line-2); }
.empty h2 { font-size: 17px; }
.empty p { color: var(--muted); }

.help { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.help h2 { font-size: 14px; font-weight: 500; }
.help p { color: var(--muted); }
.help .btn { background: transparent; color: var(--link); padding: 0; min-height: 0; font-weight: 500; }
.help .btn:hover { background: transparent; color: var(--link); text-decoration: underline; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--r); background: var(--fg); color: var(--bg); font-weight: 500; font-size: 14px; transition: background .15s; }
.btn:hover { background: var(--brand-strong); color: #fff; text-decoration: none; }
.btn.go { background: var(--brand); color: #000; }
.btn.go:hover { background: var(--brand-hot); color: #000; }
body > .wrap, body > header, body > footer { width: 100%; }
footer { position: sticky; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; }
footer .wrap { padding-block: 10px; }

/* ---------- como fazer ---------- */
.callout { display: flex; gap: 10px; border-left: 2px solid var(--brand); padding: 2px 0 2px 12px; color: var(--fg); margin-bottom: 24px; font-size: 14px; }
.callout svg { display: none; }
.callout b { font-weight: 500; }
.callout p { color: var(--text); }
.tut-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.tut-list li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.tut-list.num { counter-reset: n; }
.tut-list.num li { counter-increment: n; }
.tut-list.num li::before { content: counter(n); font: 500 13px/1.65 var(--mono); color: var(--brand-strong); }
.tut-list.dot li::before { content: "–"; color: var(--muted); text-align: center; }
.tut-card { border-top: 1px solid var(--line-2); padding-top: 12px; }
.cmp { display: grid; gap: 0; border-top: 1px solid var(--line-2); }
.cmp-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; border-bottom: 1px solid var(--line); }
.cmp-row > div { padding: 10px 0; font-size: 14px; display: flex; gap: 8px; align-items: start; }
.cmp-row .bad { color: var(--muted); }
.cmp-row .good { color: var(--fg); }
.cmp-row svg { flex: none; margin-top: 3px; }
.cmp-row .bad svg { color: #dc2626; }
.cmp-row .good svg { color: var(--ok); }
.cmp-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-bottom: 6px; }
.srcs { display: grid; gap: 4px; }
.srcs a { font: 400 12.5px var(--mono); overflow-wrap: anywhere; }
.next { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); }
.next a { display: grid; gap: 2px; max-width: 48%; font-weight: 500; }
.next small { color: var(--muted); font-size: 12px; font-weight: 400; }

.vcard { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; color: var(--text); border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); padding: 12px 0; margin-bottom: 24px; }
.vcard:hover { text-decoration: none; }
.vbox { margin: 0 0 28px; display: grid; gap: 10px; }
.vbox video { width: 100%; aspect-ratio: 16 / 9; background: #000; display: block; }
.vplay { width: 40px; height: 40px; background: var(--brand); color: #000; display: grid; place-items: center; }
.vtxt { display: grid; gap: 0; min-width: 0; }
.vtxt b { color: var(--fg); font-size: 15px; font-weight: 500; }
.vtxt > span:last-child { font-size: 13.5px; color: var(--muted); }
.vgo { display: inline-flex; align-items: center; gap: 6px; color: var(--link); font-weight: 500; white-space: nowrap; font-size: 14px; }
@media (max-width: 720px) { .vcard { grid-template-columns: 40px minmax(0, 1fr); } .vgo { grid-column: 2; } }

/* ---------- player dos motions ---------- */
.mv { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; margin-bottom: 32px; box-shadow: var(--shadow); }
.mv-scroll { overflow-x: auto; }
.mv-stage { position: relative; overflow: hidden; aspect-ratio: 16 / 9; background: var(--soft); min-width: 640px; }
.mv[data-motion="erp"] .mv-stage { aspect-ratio: 1830 / 770; background: #ffffff; }
.mv-cap { padding: 12px 16px 4px; color: var(--fg); font-size: 15.5px; font-weight: 500; min-height: 2.6em; }
.mv-ctl { display: flex; align-items: center; gap: 10px; padding: 8px 12px 12px; }
.mv-ctl button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--fg); flex: none; transition: border-color .2s, color .2s; }
.mv-ctl button:hover { border-color: var(--brand); color: var(--brand-strong); }
.mv-bar { flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; }
.mv-bar::before { content: ""; position: absolute; }
.mv-bar span { position: relative; display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.mv-bar i { position: absolute; inset: 0; background: var(--brand); transform-origin: left; transform: scaleX(0); }
.mv-shot { position: absolute; left: 0; top: 0; width: 100%; display: block; }
.mv-cursor { position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
.mv-ripple { position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fe5f21; z-index: 5; pointer-events: none; }
.mv-ring { position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 3px #fe5f21, 0 0 0 9px rgba(254,95,33,.25); z-index: 4; }
.mv-row { position: absolute; background: rgba(254,95,33,.16); outline: 2px solid #fe5f21; z-index: 3; }
.mv-toast { position: absolute; right: 3%; bottom: 7%; max-width: 46%; background: #1f1f1f; color: #fff; padding: 12px 16px; border-radius: 8px; border-left: 4px solid #fe5f21; font-size: clamp(11px, 1.3vw, 15px); line-height: 1.45; z-index: 7; }
.mv-toast b { color: #ffb08f; }
.mv-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.mv-edge { fill: none; stroke: var(--brand); stroke-width: .3; stroke-linecap: round; }

  }
  const APP_ICON = { 'Faturamento': 'money', 'Vendas': 'cart', 'Devoluções': 'back', 'Compras': 'inbox', 'Estoque': 'box', 'Contas a Receber': 'down', 'Contas a Pagar': 'up', 'Monitor Fiscal': 'tax' };

  function agoraBRT() {

  function daySvg() {
    const W = 760, L = 150, R = 16, top = 24, lane = 34;

    const lanes = [
      { n: 'Contínua (30 min)', c: 'var(--brand)', ticks: Array.from({ length: 25 }, (_, i) => 420 + i * 30) },

    const H = top + lanes.length * lane + 24;
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Agenda do dia: atualização contínua a cada 30 minutos das 7h às 19h, conferência a cada 2 horas das 8h30 às 16h30, recálculo diário à meia-noite e recarga mensal às 4h do dia 1.">`;
    s += `<rect x="${x(420)}" y="${top - 8}" width="${x(1140) - x(420)}" height="${lanes.length * lane}" fill="var(--brand-tint)" rx="4"/>`;

      ln.ticks.forEach((t) => { s += `<rect x="${x(t) - 2}" y="${y - 8}" width="4" height="16" rx="2" fill="${ln.c}"/>`; });
    });
    return s + '</svg>';

  /* ---------- planilha de metas ----------
     O cliente entra pelo OAuth do próprio Horus (a senha nunca passa por esta página) e a página lê,
     só para leitura, pelo MCP do Horus: os cadastros de meta dos apps, as ligações de cada agrupamento
     (Representante, Cliente...) e os IDs e nomes da dimensão. A planilha sai no formato da importação
     do Cadastro (Ações > Importar). O token fica só na memória da aba. */
  const HORUS = 'https://dataviz.horusbi.com.br';
  const PM_ROTA = 'planilha-metas';
  const VOLTA = location.origin + location.pathname;
  const guarda = (s) => ({
    get: (k) => { try { return s().getItem(k); } catch (_) { return null; } },
    set: (k, v) => { try { s().setItem(k, v); } catch (_) {} },
    del: (k) => { try { s().removeItem(k); } catch (_) {} }
  });
  const ss = guarda(() => sessionStorage), ls = guarda(() => localStorage);
  /* nomes que a importação aceita no cabeçalho: o nome técnico do campo com espaço no lugar do "_" */
  const PM_FIXOS = { competencia: 'COMPETENCIA', tipo: 'TIPO AGRUPAMENTO', meta: 'META VALOR' };
  const PM_TIPOS = ['Geral', 'Cliente', 'Produto', 'Grupo de Produto', 'Representante', 'Responsável'];
  const semAcento = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
  const aliasDe = (rotulo) => semAcento(rotulo).toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
  const mesTxt = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const hoje = new Date();
  const pmIni = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 1);
  const PM = { token: null, exp: 0, sessao: null, etapa: 'fora', erro: '', aviso: '', cadastros: [], cad: 0, agrup: '',
    ini: mesTxt(pmIni), fim: mesTxt(new Date(pmIni.getFullYear(), 11, 1)), soAtivos: true, filtro: '', progresso: '', feito: null };

  const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const aleatorio = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
  const naPlanilha = () => atual === PM_ROTA;
  const redesenha = () => { if (naPlanilha()) { const y = window.scrollY; render(); window.scrollTo({ top: y }); } };

  async function pmEntrar() {
    PM.erro = '';
    const chave = 'pm_cliente:' + VOLTA;
    let cid = ls.get(chave);
    if (!cid) {
      const r = await fetch(HORUS + '/oauth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_name: 'Guia Horus BI · Planilha de metas', redirect_uris: [VOLTA],
          grant_types: ['authorization_code', 'refresh_token'], response_types: ['code'], token_endpoint_auth_method: 'none' }) });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || !j.client_id) throw new Error(`O Horus não liberou o acesso desta página (HTTP ${r.status}).`);
      cid = j.client_id;
      ls.set(chave, cid);
    }
    const verifier = aleatorio(), state = aleatorio();
    const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
    ss.set('pm_oauth', JSON.stringify({ verifier, state, cid }));
    const u = new URL(HORUS + '/oauth/authorize');
    Object.entries({ response_type: 'code', client_id: cid, redirect_uri: VOLTA, code_challenge: challenge,
      code_challenge_method: 'S256', state, scope: 'mcp:read', resource: HORUS + '/mcp' }).forEach(([k, v]) => u.searchParams.set(k, v));
    location.href = u.toString();
  }

  /* volta do Horus com ?code=... (roda antes do primeiro desenho) */
  function pmRetorno() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return;
    try { history.replaceState(null, '', VOLTA + '#' + PM_ROTA); } catch (_) {}
    atual = PM_ROTA;
    const est = JSON.parse(ss.get('pm_oauth') || 'null');
    ss.del('pm_oauth');
    if (q.has('error')) {
      if (est) ls.del('pm_cliente:' + VOLTA);
      PM.erro = q.get('error') === 'access_denied' ? 'O acesso não foi autorizado na tela do Horus.' : 'O Horus não concluiu a entrada. Tente de novo.';
      return;
    }
    if (!est || est.state !== q.get('state')) { PM.erro = 'A entrada expirou ou veio de outra aba. Tente de novo.'; return; }
    PM.etapa = 'carregando';
    PM.progresso = 'Confirmando o acesso com o Horus...';
    (async () => {
      const r = await fetch(HORUS + '/oauth/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: VOLTA,
          client_id: est.cid, code_verifier: est.verifier, resource: HORUS + '/mcp' }) });
      const j = await r.json().catch(() => null);
      if (!r.ok || !j || !j.access_token) throw new Error('O Horus não confirmou o acesso. Tente entrar de novo.');
      PM.token = j.access_token;
      PM.exp = Date.now() + (Number(j.expires_in) || 3600) * 1000;
      await pmCarregar();
    })().catch((e) => { PM.token = null; PM.etapa = 'fora'; PM.erro = e.message; redesenha(); });
  }

  async function mcpPost(corpo) {
    if (!PM.token || Date.now() > PM.exp - 30000) { PM.token = null; throw new Error('O acesso ao Horus expirou. Entre de novo.'); }
    const h = { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream', Authorization: 'Bearer ' + PM.token, 'MCP-Protocol-Version': '2025-06-18' };
    if (PM.sessao) h['Mcp-Session-Id'] = PM.sessao;
    const r = await fetch(HORUS + '/mcp', { method: 'POST', headers: h, body: JSON.stringify(corpo) });
    if (r.status === 401) { PM.token = null; throw new Error('O acesso ao Horus expirou. Entre de novo.'); }
    const s = r.headers.get('mcp-session-id');
    if (s) PM.sessao = s;
    const t = await r.text();
    try { return JSON.parse(t); } catch (_) {}
    const m = t.match(/^data: (.*)$/m);
    try { return m ? JSON.parse(m[1]) : null; } catch (_) { return null; }
  }
  let mcpId = 10;
  async function ferramenta(nome, args) {
    const j = await mcpPost({ jsonrpc: '2.0', id: mcpId++, method: 'tools/call', params: { name: nome, arguments: args } });
    if (!j) throw new Error('O Horus não respondeu. Tente de novo em instantes.');
    if (j.error) throw new Error(j.error.message || 'O Horus recusou a consulta.');
    if (j.result && j.result.isError) throw new Error((j.result.content || []).map((c) => c.text).join(' ').slice(0, 300) || 'O Horus recusou a consulta.');
    return j.result || {};
  }
  const textoDe = (r) => (r.content || []).map((c) => c.text || '').join('\n');

  /* lê a estrutura de um app: colunas por tabela e ligações "lado 1 -> lado N" */
  function lerApp(txt) {
    const cols = {}, rel = [];
    let tab = null;
    txt.split('\n').forEach((l) => {
      const t = l.match(/^## Tabela (.+?) \(/);
      if (t) { tab = t[1]; return; }
      if (/^## /.test(l)) { tab = null; return; }
      const c = l.match(/^- `([^`]+)` \((\w+)/);
      if (tab && c && c[1].startsWith(tab + '.')) (cols[tab] = cols[tab] || []).push({ ref: c[1], nome: c[1].slice(tab.length + 1), tipo: c[2] });
      const r = l.match(/^- `([^`]+)` -> `([^`]+)`/);
      if (r) rel.push([r[1], r[2]]);
    });
    return { cols, rel };
  }
  const tabelaDe = (ref) => ref.slice(0, ref.indexOf('.'));

  async function pmCarregar() {
    PM.etapa = 'carregando'; PM.erro = ''; PM.progresso = 'Procurando os cadastros de meta...'; redesenha();
    const ini = await mcpPost({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'guia-horus-metas', version: '1' } } });
    if (!ini || !ini.result) throw new Error('O Horus não abriu a leitura dos dados.');
    await mcpPost({ jsonrpc: '2.0', method: 'notifications/initialized', params: {} });
    /* cada cadastro de meta tem a coluna "Tipo de Agrupamento"; guarda o primeiro app que traz cada um */
    const cat = textoDe(await ferramenta('search_catalog', { terms: ['Tipo de Agrupamento'] }));
    const achados = new Map();
    let app = null;
    cat.split('\n').forEach((l) => {
      const a = l.match(/\(app (\d+) "([^"]*)"\)/);
      if (a) app = { id: +a[1], nome: a[2] };
      const r = l.match(/"ref":"(.+?)\.Tipo de Agrupamento"/);
      if (r && app && !achados.has(r[1])) achados.set(r[1], app);
    });
    if (!achados.size) throw new Error('Não achei cadastro de metas nos apps que você vê. Confira com o administrador do Horus se você tem acesso ao app de Faturamento ou Vendas.');
    const cads = [];
    for (const [tabela, a] of achados) {
      PM.progresso = `Lendo o app ${a.nome}...`; redesenha();
      const { cols, rel } = lerApp(textoDe(await ferramenta('get_app', { appId: a.id })));
      const agrup = rel.filter(([um, n]) => tabelaDe(n) === tabela && !/^calend/i.test(semAcento(tabelaDe(um))))
        .map(([um, n]) => {
          const dim = tabelaDe(um), campo = n.slice(tabela.length + 1);
          const texto = (cols[dim] || []).filter((c) => c.tipo === 'String');
          const util = texto.filter((c) => !/inativ|^ativo|codigo|cidade|estado|cnpj|cpf|sigla|^uf$|cep|fone|mail|rede/i.test(semAcento(c.nome)));
          const nome = util.find((c) => /raz|nome|descri/i.test(semAcento(c.nome))) || util[0];
          const inativo = texto.find((c) => /^(inativo|ativo|situacao|status)$/i.test(semAcento(c.nome)));
          return { campo, alias: aliasDe(campo), tipo: PM_TIPOS.find((t) => semAcento(t).toLowerCase() === semAcento(campo).toLowerCase()) || null,
            dim, idRef: um, nomeRef: nome ? nome.ref : null, inativoRef: inativo ? inativo.ref : null };
        });
      cads.push({ tabela, appId: a.id, appNome: a.nome, agrup });
    }
    cads.sort((x, y) => x.tabela.localeCompare(y.tabela, 'pt-BR'));
    PM.cadastros = cads; PM.cad = 0;
    PM.agrup = (cads[0].agrup.find((g) => g.tipo === 'Representante') || cads[0].agrup.find((g) => g.tipo) || { campo: 'Geral' }).campo;
    PM.etapa = 'pronto'; PM.progresso = ''; redesenha();
  }

  function pmMeses() {
    const [ai, mi] = PM.ini.split('-').map(Number), [af, mf] = PM.fim.split('-').map(Number);
    const out = [];
    for (let y = ai, m = mi; (y < af || (y === af && m <= mf)) && out.length < 61; m === 12 ? (y++, m = 1) : m++) out.push([y, m]);
    return out;
  }

  function carregarXLSX() {
    if (window.XLSX) return Promise.resolve();
    return new Promise((ok, falha) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = ok;
      s.onerror = () => falha(new Error('Não consegui carregar o gerador de Excel. Confira a internet e tente de novo.'));
      document.head.appendChild(s);
    });
  }

  async function pmGerar() {
    const c = PM.cadastros[PM.cad];
    const g = c.agrup.find((x) => x.campo === PM.agrup) || null;
    const meses = pmMeses();
    if (!PM.ini || !PM.fim || !meses.length) throw new Error('Confira o período: o mês final tem que ser igual ou depois do inicial.');
    if (meses.length > 60) throw new Error('Escolha no máximo 60 meses por planilha.');
    if (g && !g.tipo) throw new Error(`O cadastro não aceita o tipo "${g.campo}". Fale com o suporte WebMais.`);
    PM.etapa = 'gerando'; PM.erro = ''; PM.feito = null;
    let itens = [];
    if (g) {
      const filtros = [];
      if (PM.soAtivos && g.inativoRef) {
        const vals = textoDe(await ferramenta('search_values', { appId: c.appId, ref: g.inativoRef })).split('\n').slice(1).map((v) => v.trim()).filter(Boolean);
        const fora = vals.find((v) => /^(inativo|s|sim|true|1|i)$/i.test(semAcento(v)));
        if (fora) filtros.push({ ref: g.inativoRef, op: '!=', value: fora });
      }
      if (PM.filtro.trim() && g.nomeRef) filtros.push({ ref: g.nomeRef, op: 'like', value: '%' + PM.filtro.trim() + '%' });
      const campos = [{ ref: g.idRef }].concat(g.nomeRef ? [{ ref: g.nomeRef }] : []);
      const vistos = new Map();
      let ultimo = null;
      for (let pag = 0; pag < 200; pag++) {
        PM.progresso = `Buscando ${g.campo.toLowerCase()} no Horus... ${vistos.size} até agora`; redesenha();
        const f = filtros.concat(ultimo == null ? [] : [{ ref: g.idRef, op: '>', value: ultimo }]);
        const r = await ferramenta('query', { appId: c.appId, fields: campos, filters: f.length ? f : null, orderBy: [{ ref: g.idRef, dir: 'asc' }], limit: 500 });
        const linhas = (r.structuredContent && r.structuredContent.rows) || [];
        linhas.forEach(([id, nome]) => { if (id != null && !vistos.has(id)) vistos.set(id, nome == null ? '' : String(nome)); });
        if (linhas.length < 500) break;
        ultimo = linhas[linhas.length - 1][0];
      }
      itens = [...vistos].map(([id, nome]) => ({ id, nome }));
      if (!itens.length) throw new Error('Nenhum item encontrado com essas opções. Tire o filtro por nome ou desmarque "só ativos".');
    }
    const total = (g ? itens.length : 1) * meses.length;
    if (total > 100000) throw new Error(`Ficariam ${total.toLocaleString('pt-BR')} linhas. Use o filtro por nome ou um período menor.`);
    PM.progresso = 'Montando a planilha...'; redesenha();
    await carregarXLSX();
    const X = window.XLSX;
    const outros = c.agrup.filter((x) => x !== g).map((x) => x.alias);
    const cab = [PM_FIXOS.competencia, PM_FIXOS.tipo].concat(g ? [g.alias, 'NOME'] : [], [PM_FIXOS.meta], outros);
    const serial = (y, m) => (Date.UTC(y, m - 1, 1) - Date.UTC(1899, 11, 30)) / 86400000;
    const linhas = [];
    meses.forEach(([y, m]) => (g ? itens : [null]).forEach((it) => linhas.push(
      [{ t: 'n', v: serial(y, m), z: 'mm/yyyy' }, g ? g.tipo : 'Geral'].concat(it ? [it.id, it.nome] : [], [null], outros.map(() => null)))));
    const ws = X.utils.aoa_to_sheet([cab].concat(linhas));
    ws['!cols'] = cab.map((h) => ({ wch: h === 'NOME' ? 48 : Math.max(14, h.length + 4) }));
    ws['!autofilter'] = { ref: ws['!ref'] };
    const iMeta = cab.indexOf(PM_FIXOS.meta);
    for (let r = 1; r <= linhas.length; r++) {
      const ref = X.utils.encode_cell({ r, c: iMeta });
      ws[ref] = { t: 'z', z: '#,##0.00' };
    }
    const ajuda = X.utils.aoa_to_sheet([
      ['Como preencher esta planilha'], [''],
      ['1. Preencha só a coluna META VALOR, com o valor da meta em reais (ex.: 15000,00).'],
      ['2. Apague as linhas que não vão ter meta. A importação é tudo ou nada: uma linha sem valor barra o arquivo inteiro.'],
      ['3. Não mude os títulos da linha 1, a COMPETENCIA, o TIPO AGRUPAMENTO nem os códigos. NOME é só para você se achar.'],
      ['4. No Horus: Cadastros > ' + c.tabela + ' > Ações > Importar.'],
      ['5. Escolha "Adicionar à base". "Limpar base" apaga TODAS as metas que já existem, de todos os agrupamentos.'],
      ['6. Se já existir meta para o mesmo mês e o mesmo item, a importação recusa o arquivo: apague essa linha ou edite a meta na tela.'],
      [''], ['Gerada pelo Guia Horus BI em ' + new Date().toLocaleString('pt-BR') + '.']
    ]);
    ajuda['!cols'] = [{ wch: 110 }];
    const wb = X.utils.book_new();
    X.utils.book_append_sheet(wb, ws, 'Metas');
    X.utils.book_append_sheet(wb, ajuda, 'Como preencher');
    const nomeArq = `metas-${slug(c.tabela)}-${slug(g ? g.campo : 'geral')}-${PM.ini}-a-${PM.fim}.xlsx`;
    X.writeFile(wb, nomeArq);
    PM.amostra = g ? itens.slice(0, 3) : null;
    PM.feito = { arquivo: nomeArq, linhas: linhas.length, itens: g ? itens.length : 0, meses: meses.length, tabela: c.tabela, campo: g ? g.campo : 'Geral' };
    PM.etapa = 'pronto'; PM.progresso = ''; redesenha();
  }

  function pmView() {
    const bread = `<nav class="bread" aria-label="Você está em"><a href="#inicio" data-route="inicio">Início</a>${ic('right', 12)}<a href="#tut-metas" data-route="tut-metas">Metas</a>${ic('right', 12)}<span aria-current="page">Planilha de metas</span></nav>`;
    const logado = !!PM.token && PM.etapa !== 'fora';
    const fase = !logado ? 0 : PM.feito ? 2 : 1;
    const flow = `<ol class="flow" aria-label="Etapas">${['Entrar', 'Baixar', 'Importar']
      .map((n, i) => `<li data-s="${i < fase ? 'feito' : i === fase ? 'agora' : ''}"${i === fase ? ' aria-current="step"' : ''}>${n}</li>`).join('')}</ol>`;
    const head = `<div class="pm-head"><div><h1 class="page-h">Planilha de metas</h1><p class="lead">Códigos prontos. Você só digita a meta.</p></div>${flow}</div>`;
    const erro = PM.erro ? `<p class="note" role="alert" style="margin:16px 0 0">${esc(PM.erro)}</p>` : '';
    const andando = (t) => `<span class="pm-andando" role="status"><i aria-hidden="true"></i>${esc(t)}</span>`;
    const regras = `<ul class="rules3">
      <li><b>Apague as linhas sem meta.</b> A importação é tudo ou nada.</li>
      <li><b>Importe com "Adicionar à base".</b> "Limpar base" apaga as metas existentes.</li>
      <li><b>Errou?</b> Desfaça em Cadastros › Ações › Importações.</li></ul>`;

    const c = logado && PM.cadastros.length ? PM.cadastros[PM.cad] : null;
    const g = c ? c.agrup.find((x) => x.campo === PM.agrup) || null : null;
    /* prévia: as colunas reais da importação; depois de baixar, as primeiras linhas de verdade */
    const cols = g ? ['COMPETENCIA', g.alias, 'NOME', 'META VALOR'] : ['COMPETENCIA', 'TIPO AGRUPAMENTO', 'META VALOR'];
    const [ay, am] = (PM.ini || '2027-01').split('-');
    const mes = `${am}/${ay}`;
    const amostra = (PM.amostra && PM.amostra.length ? PM.amostra : g ? [{ id: '27', nome: 'Exemplo Ltda' }, { id: '47', nome: 'Outro exemplo' }, { id: '83', nome: '…' }] : [null])
      .slice(0, 3).map((it) => `<tr><td>${mes}</td>${g ? `<td class="n">${esc(it.id)}</td><td>${esc(it.nome)}</td>` : '<td class="n">Geral</td>'}<td class="v"></td></tr>`).join('');
    const sheet = `<aside class="sheet" aria-label="Prévia da planilha">
      <span class="sheet-t">${ic('sheet', 14)}Prévia</span>
      <table><thead><tr>${cols.map((h) => `<th title="${h}">${h}</th>`).join('')}</tr></thead><tbody>${amostra}</tbody></table>
      <p>Você preenche só META VALOR.</p></aside>`;

    let card;
    if (PM.etapa === 'carregando') card = `<div class="pm-card">${andando(PM.progresso || 'Carregando...')}</div>`;
    else if (!logado) card = `<div class="pm-card pm-entrar">
        <button class="btn go" type="button" data-pm="entrar">${ic('lock', 16)}Entrar com o Horus</button>
        <small>A senha fica na tela do Horus. Na autorização, confira a empresa e clique em Autorizar.</small></div>`;
    else {
      const ocupado = PM.etapa === 'gerando', dis = ocupado ? ' disabled' : '';
      const n = pmMeses().length;
      const chips = [`<button class="chip" type="button" data-pm="agr:Geral" aria-pressed="${!g}"${dis}>Geral</button>`]
        .concat(c.agrup.map((x) => `<button class="chip" type="button" data-pm="agr:${esc(x.campo)}" aria-pressed="${g === x}"${x.tipo && !ocupado ? '' : ' disabled'}${x.tipo ? '' : ' title="O cadastro ainda não aceita este tipo"'}>${esc(x.campo)}</button>`)).join('');
      card = `<div class="pm-card">
        <div class="pm-quem"><span><i aria-hidden="true"></i>Conectado até <span class="tab">${new Date(PM.exp).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span></span><button class="btn ghost" type="button" data-pm="sair">Sair</button></div>
        ${PM.cadastros.length > 1 ? `<label class="pm-campo full">Cadastro
          <select data-pm-campo="cad"${dis}>${PM.cadastros.map((x, i) => `<option value="${i}"${i === PM.cad ? ' selected' : ''}>${esc(x.tabela)}</option>`).join('')}</select></label>` : ''}
        <div class="pm-campo">Agrupamento<div class="chips" role="group" aria-label="Agrupamento">${chips}</div></div>
        <div class="pm-grid">
          <label class="pm-campo">De<input type="month" data-pm-campo="ini" value="${esc(PM.ini)}"${dis}></label>
          <label class="pm-campo">Até<input type="month" data-pm-campo="fim" value="${esc(PM.fim)}"${dis}></label>
          ${g ? `<label class="pm-campo">Nome contém<input type="search" data-pm-campo="filtro" value="${esc(PM.filtro)}" placeholder="Todos"${dis}></label>` : ''}
          ${g && g.inativoRef ? `<label class="pm-check" style="align-self:end"><input type="checkbox" data-pm-campo="soAtivos"${PM.soAtivos ? ' checked' : ''}${dis}>Só ativos</label>` : ''}
        </div>
        <div class="pm-acoes">
          <button class="btn go" type="button" data-pm="gerar"${ocupado || !n ? ' disabled' : ''}>${ic('down', 16)}Baixar planilha</button>
          ${ocupado ? andando(PM.progresso) : `<span class="pm-conta"><b>${n || 0}</b>${n === 1 ? 'mês' : 'meses'}</span>`}</div>
        ${PM.feito ? `<p class="pm-ok" role="status"><span class="tab">${PM.feito.linhas.toLocaleString('pt-BR')}</span> linhas baixadas. Importe em Cadastros › ${esc(PM.feito.tabela)} › Ações › Importar.</p>` : ''}
      </div>`;
    }
    return `${bread}${head}${erro}<div class="pm-shell">${card}${sheet}</div>${regras}`;
  }

  async function pmAcao(qual) {
    try {
      if (qual === 'entrar') await pmEntrar();
      else if (qual === 'sair') { PM.token = null; PM.sessao = null; PM.etapa = 'fora'; PM.feito = null; PM.erro = ''; redesenha(); }
      else if (qual === 'gerar') await pmGerar();
      else if (qual.startsWith('agr:')) { PM.agrup = qual.slice(4); PM.feito = null; PM.amostra = null; PM.erro = ''; redesenha(); }
    } catch (e) {
      PM.erro = e.message || String(e);
      if (!PM.token) PM.etapa = 'fora'; else if (PM.etapa !== 'pronto') PM.etapa = PM.cadastros.length ? 'pronto' : 'fora';
      PM.progresso = '';
      redesenha();
    }
  }
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-pm-campo]');
    if (!el) return;
    const k = el.dataset.pmCampo;
    if (k === 'soAtivos') PM.soAtivos = el.checked;
    else if (k === 'cad') { PM.cad = +el.value; const c = PM.cadastros[PM.cad]; if (!c.agrup.some((x) => x.campo === PM.agrup)) PM.agrup = 'Geral'; }
    else PM[k] = el.value;
    PM.feito = null; PM.amostra = null;
    if (k !== 'filtro') redesenha();
  });

  /* ---------- rotas ---------- */
  let atual = location.hash.replace('#', '') || 'inicio';
  function render(focar) {
    const q = $('#q').value.trim();
    const a = apps.find((x) => x.slug === atual);
    const t = atual.startsWith('tut-') ? TUT.find((x) => 'tut-' + x.id === atual) : null;
    const hub = atual === 'como-fazer', pm = atual === PM_ROTA, pg = !q && PAGINAS[atual];
    document.querySelectorAll('.menu a').forEach((el) => {
      const r = el.dataset.route;
      const on = !q && (r === atual || (r === 'apps' && a) || (r === 'como-fazer' && (t || pm)));
      on ? el.setAttribute('aria-current', 'page') : el.removeAttribute('aria-current');
    });
    document.body.dataset.rota = !q && !a && !t && !hub && !pm && !pg ? 'home' : 'pagina';
    $('#view').innerHTML = q ? searchView(q) : a ? appView(a) : t ? tutView(t) : hub ? hubView() : pm ? pmView() : pg ? pg() : home();
    iniciarMotions();
    if (focar) $('#view').focus({ preventScroll: true });
  }
  function ir(s) {
    atual = s || 'inicio';
    $('#q').value = '';
    try { history.replaceState(null, '', '#' + atual); } catch (_) {}
    window.scrollTo({ top: 0 });
    render(true);
  }
  document.addEventListener('click', (e) => {
    const pmb = e.target.closest('[data-pm]');
    if (pmb) { e.preventDefault(); if (!pmb.disabled) pmAcao(pmb.dataset.pm); return; }
    const r = e.target.closest('[data-route]');
    if (r) { e.preventDefault(); ir(r.dataset.route); return; }
    const go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); const el = document.getElementById(go.dataset.go); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
    const sq = e.target.closest('[data-q]');
    if (sq) { $('#q').value = sq.dataset.q; render(); $('#q').focus(); return; }
    const mf = e.target.closest('[data-met]');
    if (mf) { metFilter = mf.dataset.met; document.querySelectorAll('[data-met]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.met === metFilter)); $('#mt').innerHTML = metTable(metFilter === 'Todos' ? MET : MET.filter((m) => m.app === metFilter)); return; }
    const btn = e.target.closest('.item > button');
    if (btn) { const it = btn.parentElement, open = it.dataset.open !== 'true'; it.dataset.open = open; btn.setAttribute('aria-expanded', open); it.querySelector('.panel').hidden = !open; }
  });
  let t;
  $('#q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => render(), 200); });
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#q').value = ''; render(); } });
  window.addEventListener('hashchange', () => { const s = location.hash.replace('#', '') || 'inicio'; if (s !== atual) ir(s); });
  $('#foot').textContent = `Atualizado em ${DATA.gerado}, a partir dos apps do plano Ultra. Os números dos painéis mudam com os filtros do topo.`;
  pmRetorno();
  render();
})();
</script>
